[package]
name = "mister-magik-tooling-support"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"
mister-magik-framebuffer-stream = { path = "../framebuffer-stream" }
slint = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", default-features = false, features = ["compat-1-2", "renderer-software", "std"] }
pprof = { git = "https://github.com/NigelBreslaw/pprof-rs", rev = "431b88c4fc67bef98126eaa8932287583d1a660e", default-features = false, features = ["flamegraph"] }
