[package]
name = "mister-magik-particles"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Slint-free particle engines for MiSTer MagiK"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
mister-magik-framebuffer-scenes = { path = "../framebuffer-scenes" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.4.2"
