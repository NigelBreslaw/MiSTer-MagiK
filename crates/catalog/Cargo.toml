[package]
name = "mister-magik-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep catalog builds aligned with the repository's pinned Rust toolchain.
description = "Catalog, library scan, and preview-loading logic for MiSTer MagiK."
license = "GPL-3.0-or-later"

[[bin]]
name = "arcade-catalog-prototype"
path = "src/bin/arcade_catalog_prototype/main.rs"
required-features = ["builder"]

[[bin]]
name = "five-system-catalog-prototype"
path = "src/bin/five_system_catalog_prototype.rs"
required-features = ["builder"]

[[bin]]
name = "catalog-hotpath-profile"
path = "src/bin/catalog_hotpath_profile.rs"
required-features = ["builder", "hotpath"]

[[bin]]
name = "runtime-metadata-builder"
path = "src/bin/runtime_metadata_builder.rs"
required-features = ["builder"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
hotpath = "0.24"
libc = "0.2"
lz4_flex = "0.14.0"
memmap2 = "0.9.11"
mister-magik-perf-events = { path = "../perf-events" }
mister-magik-platform-manifest-contract = { path = "../../mister/platform/contracts/manifest" }
pprof = { git = "https://github.com/NigelBreslaw/pprof-rs", branch = "armv7-itimer-abi", optional = true, default-features = false, features = ["flamegraph"] }
postcard = { version = "1.1.3", features = ["alloc"] }
quick-xml = "0.42"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "functions", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
walkdir = "2"

[features]
default = []
builder = []
hotpath = ["hotpath/hotpath"]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]
profile = ["dep:pprof"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[profile.release-device]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-device-profile]
inherits = "release-device"
strip = false
debug = true
