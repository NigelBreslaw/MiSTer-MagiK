[package]
name = "mister-magik-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep catalog builds aligned with the repository's pinned Rust toolchain.
description = "Catalog, library scan, and preview-loading logic for MiSTer MagiK."
license = "GPL-3.0-or-later"

[[bin]]
name = "mister-magik-catalog-builder"
path = "src/bin/catalog_builder.rs"
required-features = ["builder"]

[[bin]]
name = "catalog-lab"
path = "src/bin/catalog_lab.rs"
required-features = ["builder"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
libc = "0.2"
lz4_flex = "0.14.0"
memmap2 = "0.9.11"
mister-magik-perf-events = { path = "../perf-events" }
quick-xml = "0.41"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "functions", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[features]
default = []
builder = []

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[profile.release-device]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-device-profile]
inherits = "release-device"
strip = false
debug = true
