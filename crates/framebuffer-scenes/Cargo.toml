[package]
name = "mister-magik-framebuffer-scenes"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Portable RGB565 framebuffer-scene contracts for MiSTer MagiK"
license = "GPL-3.0-or-later"

[build-dependencies]
cc = "1.4.2"

[features]
launcher-profile = ["dep:mister-magik-perf-events", "dep:serde"]

[dependencies]
mister-magik-perf-events = { path = "../perf-events", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
