[package]
name = "mini-magik"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Fast consumer experiment for the shared MiSTer MagiK tooling"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mini-magik"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "std", "system-testing"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }
slint = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "std", "system-testing"] }

[dependencies]
mister-magik-tooling-support = { path = "../../crates/tooling-support" }
mister-magik-mister-runtime = { path = "../../mister/platform/runtime", default-features = false, features = ["cached-rgb565-presenter", "framebuffer-lab"] }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0" }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = "debuginfo"
