[package]
name = "mister-magik2-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Native development service for the MiSTer MagiK 2.0 probe"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
libc = "0.2"
mister-magik-framebuffer-stream = { path = "../../crates/framebuffer-stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
