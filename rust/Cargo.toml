[package]
name = "mister-magic-fb"
version = "0.1.0"
edition = "2021"
description = "Native MiSTer frontend: owns the FPGA framebuffer and renders Slint. Spike stage."

[[bin]]
name = "mister-magic-fb"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# No "std" feature on purpose: that pulls system font loading (fontconfig), which
# we don't have/want on the MiSTer. Instead we embed a font for the software
# renderer (see build.rs) and provide time/etc. ourselves via the Platform trait.
# Our own crate still uses std freely; this only affects Slint internals.
slint = { version = "1", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }

[build-dependencies]
slint-build = "1"

# Slint from git master (1.17.x); bench vs 1.16 in history/toolchain-bench/slint-master.md.
[patch.crates-io]
slint = { git = "https://github.com/slint-ui/slint", branch = "master" }
slint-build = { git = "https://github.com/slint-ui/slint", branch = "master" }

[profile.release]
# Daily dev / quick deploy: thin LTO, parallel codegen (~3 min clean cross-build; A0-class).
# See rust/BUILD.md and `build-arm.sh --fast`.
opt-level = 3
lto = true
strip = true
panic = "abort"

[profile.release-device]
# Full MiSTer release: fat LTO + single CGU (A3 bench winner on size; ~5 min clean).
# NEON/VFP rustflags are applied by build-arm.sh for this profile only.
inherits = "release"
lto = "fat"
codegen-units = 1
