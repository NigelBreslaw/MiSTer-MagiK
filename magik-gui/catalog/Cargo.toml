[package]
name = "mister-magik-catalog"
version = "0.1.0"
edition = "2021"
description = "Catalog, library scan, and preview-loading logic for MiSTer MagiK."

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
libc = "0.2"
lz4_flex = "0.13.1"
quick-xml = "0.40"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
