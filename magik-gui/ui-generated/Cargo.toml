[package]
name = "mister-magik-ui"
version = "0.1.0"
edition = "2021"
description = "Generated Slint UI modules for MiSTer MagiK."

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "std"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }

[features]
default = []
bench-scenes = []
video = []

[build-dependencies]
slint-build = "1.17"
