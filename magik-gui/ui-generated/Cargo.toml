[package]
name = "mister-magik-ui"
version = "0.1.0"
edition = "2021"
description = "Generated Slint UI modules for MiSTer MagiK."

[dependencies]
slint = { version = "1", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }

[features]
default = []
bench-scenes = []
video = ["bench-scenes"]

[build-dependencies]
slint-build = "1"
