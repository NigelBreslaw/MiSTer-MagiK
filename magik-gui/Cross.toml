[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:0.2.5"

[build.env]
passthrough = [
    "FFMPEG_DIR",
    "CFLAGS",
    "HOST_CFLAGS",
    "CFLAGS_x86_64_unknown_linux_gnu",
    "MISTER_UI_BUILD_SCOPE",
    "PKG_CONFIG_PATH",
    "PKG_CONFIG_ALLOW_CROSS",
    "SLINT_FONT_SIZES",
]
