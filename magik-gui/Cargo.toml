[package]
name = "mister-magik-fb"
version = "0.1.0"
edition = "2021"
description = "Native MiSTer MagiK frontend: owns the FPGA framebuffer and renders Slint."

[[bin]]
name = "mister-magik-fb"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
libc = "0.2"
# No "std" feature on purpose: that pulls system font loading (fontconfig), which
# we don't have/want on the MiSTer. Instead we embed a font for the software
# renderer (see build.rs) and provide time/etc. ourselves via the Platform trait.
# Our own crate still uses std freely; this only affects Slint internals.
slint = { version = "1", optional = true, default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-png = "0.5"
swash = { version = "0.2.7", features = ["scale", "render"] }
pprof = { git = "https://github.com/NigelBreslaw/pprof-rs", branch = "armv7-itimer-abi", optional = true, default-features = false, features = ["flamegraph"] }
mister-magik-catalog = { path = "catalog" }
mister-magik-ui = { path = "ui-generated", optional = true }
ffmpeg-next = { version = "8.1", optional = true, default-features = false, features = ["codec", "format", "software-scaling", "static"] }

[features]
default = []
profile = ["dep:pprof"]
ui = ["dep:slint", "dep:mister-magik-ui"]
bench-scenes = ["mister-magik-ui?/bench-scenes"]
video = ["dep:ffmpeg-next", "bench-scenes", "mister-magik-ui?/video"]

# Slint from git master (1.17.x); bench vs 1.16 in history/toolchain-bench/slint-master.md.
[patch.crates-io]
slint = { git = "https://github.com/slint-ui/slint", branch = "master" }
slint-build = { git = "https://github.com/slint-ui/slint", branch = "master" }

[profile.release]
# Daily dev / quick deploy: thin LTO, parallel codegen, Cortex-A9 via build-arm.sh.
# See magik-gui/BUILD.md and `build-arm.sh --fast`.
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[profile.release-device]
# Full MiSTer release: fat LTO + single CGU (A3 bench winner on size; ~5 min clean).
# Cortex-A9 tuning is applied by build-arm.sh for every optimized ARM build.
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-fast-dev]
# Local-only deployable iteration profile: keep ARM tuning from build-arm.sh but
# avoid LTO/strip work and favor parallel codegen/incremental rebuilds.
inherits = "release"
lto = false
codegen-units = 64
strip = false
incremental = true

[profile.release-opt2]
inherits = "release"
opt-level = 2

[profile.release-opts]
inherits = "release"
opt-level = "s"

[profile.release-incr]
inherits = "release"
incremental = true

[profile.release-device-profile]
# Profiling build: symbols + frame pointers for pprof flamegraphs on device.
inherits = "release-device"
strip = false
debug = true
