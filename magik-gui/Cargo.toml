[package]
name = "mister-magik-fb"
version = "0.1.0"
edition = "2021"
description = "Native MiSTer MagiK frontend: owns the FPGA framebuffer and renders Slint."

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-fb"
path = "src/main.rs"
required-features = ["ui"]

[[example]]
name = "render-licenses"
path = "examples/render_licenses.rs"
required-features = ["ui"]

[dependencies]
bytemuck = "1"
libc = "0.2"
lz4_flex = "0.13.1"
mister-magik-framebuffer-stream = { path = "../framebuffer-stream" }
# No "std" feature on purpose: that pulls system font loading (fontconfig), which
# we don't have/want on the MiSTer. Instead we embed a font for the software
# renderer (see build.rs) and provide time/etc. ourselves via the Platform trait.
# Our own crate still uses std freely; this only affects Slint internals. macOS
# host UI-test builds opt into Slint std below because Slint's AppKit system tray
# support assumes it, but non-macOS/device targets keep the embedded setup.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
swash = { version = "0.2.7", features = ["scale", "render"] }
pprof = { git = "https://github.com/NigelBreslaw/pprof-rs", branch = "armv7-itimer-abi", optional = true, default-features = false, features = ["flamegraph"] }
mister-magik-catalog = { path = "catalog", default-features = false, features = ["reader"] }
mister-magik-ui = { path = "ui-generated", optional = true }
ffmpeg-next = { version = "8.1", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "static"] }

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.17", optional = true, default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "std"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = { version = "1.17", optional = true, default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }

[features]
default = []
profile = ["dep:pprof"]
ui = ["dep:slint", "dep:mister-magik-ui"]
bench-tools = []
bench-scenes = ["mister-magik-ui?/bench-scenes"]
experiments = ["bench-scenes"]
diagnostics = []
video = ["dep:ffmpeg-next", "mister-magik-ui?/video"]

[build-dependencies]
cc = "1"

[profile.release]
# Base optimized Cargo profile. MiSTer builds use release-device by default.
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[profile.release-device]
# Full MiSTer release: fat LTO + single CGU (A3 bench winner on size; ~5 min clean).
# Cortex-A9 tuning is applied by build-arm.sh for every optimized ARM build.
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-device-profile]
# Profiling build: symbols + frame pointers for pprof flamegraphs on device.
inherits = "release-device"
strip = false
debug = true
