[target.armv7-unknown-linux-gnueabihf]
image = "mister-magik-cross-armv7:sccache-amd64"
rustc-wrapper = "sccache"

[build.env]
passthrough = [
    "FFMPEG_DIR",
    "MISTER_UI_BUILD_SCOPE",
    "PKG_CONFIG_PATH",
    "PKG_CONFIG_ALLOW_CROSS",
    "SCCACHE_DIR",
    "SCCACHE_IDLE_TIMEOUT",
    "SLINT_FONT_SIZES",
]
