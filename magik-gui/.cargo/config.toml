# Override any global ~/.cargo/config.toml compiler wrapper. This crate also has
# a repo-root override, but keeping this local file protects direct invocations
# from inside magik-gui if Cargo config discovery changes.
[build]
rustc-wrapper = ""

# Cortex-A9 + NEON for MiSTer are set via RUSTFLAGS in build-arm.sh when building
# `--profile release-device` only (see rust/BUILD.md). Daily `release` builds stay
# on generic armv7 defaults for faster compiles.
