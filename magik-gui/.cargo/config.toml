# Override the global ~/.cargo/config.toml sccache wrapper: its macOS Homebrew
# path (/opt/homebrew/bin/sccache) does not exist inside the cross Linux
# container, which breaks cross-compilation. Empty string disables the wrapper.
[build]
rustc-wrapper = ""

# Cortex-A9 + NEON for MiSTer are set via RUSTFLAGS in build-arm.sh when building
# `--profile release-device` only (see rust/BUILD.md). Daily `release` builds stay
# on generic armv7 defaults for faster compiles.
