workspace_root = "."

[mcp]
context = "codex"
read_only = true

[mcp.output]
max_total_chars_default = 60000
max_total_chars_hard = 200000

[mcp.tools]
allow = [
  "get_current_config",
  "list_servers",
  "get_server_status",
  "hover_at",
  "get_document_symbols",
  "search_workspace_symbols",
  "find_definition",
  "find_definition_at",
  "find_references",
  "find_references_at",
  "find_implementation_at",
  "find_type_definition_at",
  "find_incoming_calls",
  "find_incoming_calls_at",
  "find_outgoing_calls",
  "find_outgoing_calls_at",
  "get_diagnostics",
]

# This repository intentionally has independent Cargo projects. Keep one
# analyzer per project; Codex warms them at startup so checks always find an
# active server without assigning a query to the wrong Cargo project.
[[servers]]
id = "agent-cli"
kind = "rust_analyzer"
extensions = ["rs"]
root_dir = "agent-cli"
cwd = "."
command = "scripts/rust-analyzer"
initialize_timeout_ms = 30000
request_timeout_ms = 120000
warmup_timeout_ms = 30000

[servers.initialize_options]
checkOnSave = false

[servers.initialize_options.files]
excludeDirs = ["target"]

