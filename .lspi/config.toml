workspace_root = "."

[mcp]
context = "codex"
read_only = true

[mcp.output]
max_total_chars_default = 60000
max_total_chars_hard = 200000

[mcp.tools]
allow = [
  "get_current_config",
  "list_servers",
  "get_server_status",
  "hover_at",
  "get_document_symbols",
  "search_workspace_symbols",
  "find_definition",
  "find_definition_at",
  "find_references",
  "find_references_at",
  "find_implementation_at",
  "find_type_definition_at",
  "find_incoming_calls",
  "find_incoming_calls_at",
  "find_outgoing_calls",
  "find_outgoing_calls_at",
  "get_diagnostics",
]

# Keep three lazy analyzers for the repository's distinct Rust contexts. The
# first server is the fallback for shared crates and tools; the more-specific
# roots route frontend and private-cloud files to their own servers.
[[servers]]
id = "shared-tools"
kind = "rust_analyzer"
extensions = ["rs"]
root_dir = "agent-cli"
cwd = "."
workspace_folders = [
  "crates/agent-protocol",
  "crates/catalog",
  "crates/framebuffer-stream",
  "crates/magik-core",
  "crates/media-contract",
  "crates/mister-ini",
  "mister/platform/contracts/latch",
  "mister/platform/contracts/scanout",
  "mister/platform/runtime",
  "mister/tools/agent",
  "mister/tools/host",
  "mister/tools/manager",
]
command = "scripts/rust-analyzer"
initialize_timeout_ms = 30000
request_timeout_ms = 120000
warmup_timeout_ms = 30000
idle_shutdown_ms = 600000

[servers.initialize_options]
checkOnSave = false

[servers.initialize_options.files]
excludeDirs = ["target"]

[[servers]]
id = "frontends"
kind = "rust_analyzer"
extensions = ["rs"]
root_dir = "apps"
cwd = "."
workspace_folders = [
  "apps/desktop",
  "apps/mister",
  "apps/mister/ui-generated",
]
command = "scripts/rust-analyzer"
initialize_timeout_ms = 30000
request_timeout_ms = 120000
warmup_timeout_ms = 30000
idle_shutdown_ms = 600000

[servers.initialize_options]
checkOnSave = false

[servers.initialize_options.files]
excludeDirs = ["target"]

[[servers]]
id = "private-cloud"
kind = "rust_analyzer"
extensions = ["rs"]
root_dir = "private/magik-cloud"
cwd = "."
command = "scripts/rust-analyzer"
initialize_timeout_ms = 30000
request_timeout_ms = 120000
warmup_timeout_ms = 30000
idle_shutdown_ms = 600000

[servers.initialize_options]
checkOnSave = false

[servers.initialize_options.files]
excludeDirs = ["target"]
