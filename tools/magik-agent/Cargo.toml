[package]
name = "mister-magik-agent"
version = "0.1.0"
edition = "2021"
description = "Small MiSTer MagiK boot/network agent, independent from the Slint UI."
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-agent"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
lz4_flex = "0.14.0"
mister-magik-framebuffer-stream = { path = "../../framebuffer-stream" }
mister-magik-scanout-contract = { path = "../../scanout-contract" }
mister-magik-latch-contract = { path = "../../latch-contract" }
mister-magik-agent-protocol = { path = "../../agent-protocol" }
quick-xml = "0.41.0"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
