[package]
name = "mister-tool"
version = "0.1.0"
edition = "2021"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lz4_flex = "0.13.1"
quick-xml = "0.40"
rayon = "1"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "modern_sqlite"] }
serde_json = "1"
ssh2 = "0.9"

[profile.dev.package.lz4_flex]
opt-level = 3
