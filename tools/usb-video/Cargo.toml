[package]
name = "magik-usb-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", features = ["block2", "dispatch2", "objc2-core-media"] }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = "0.3.2"
objc2-core-image = { version = "0.3.2", features = ["objc2-core-graphics", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
