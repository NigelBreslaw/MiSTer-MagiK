[package]
name = "mister-magik-framebuffer-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Slint-free RGB565 particle lab for MiSTer MagiK"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-particle-lab"
path = "src/main.rs"

[dependencies]
libc = "0.2"
mister-magik-mister-runtime = { path = "../../mister/platform/runtime", default-features = false, features = ["framebuffer-lab"] }
mister-magik-latch-contract = { path = "../../mister/platform/contracts/latch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
softbuffer = "0.4.8"
winit = "0.30.13"

[build-dependencies]
cc = "1.4.2"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = "debuginfo"

[profile.release-live]
inherits = "release"
opt-level = 2
