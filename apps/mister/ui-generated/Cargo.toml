[package]
name = "mister-magik-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Generated Slint UI modules for MiSTer MagiK."
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "std"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }

[features]
default = []
bench-scenes = []

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", default-features = false, features = ["compat-1-18"] }
