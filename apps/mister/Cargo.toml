[package]
name = "mister-magik-fb"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep device builds aligned with the repository's pinned Rust toolchain.
description = "Native MiSTer MagiK frontend: owns the FPGA framebuffer and renders Slint."
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-fb"
path = "src/main.rs"
required-features = ["ui"]

[[example]]
name = "render-licenses"
path = "examples/render_licenses.rs"
required-features = ["ui"]

[[example]]
name = "generate-bitmap-fonts"
path = "examples/generate_bitmap_fonts.rs"
required-features = ["asset-tools"]

[[example]]
name = "generate_magik_mask"
path = "examples/generate_magik_mask.rs"
required-features = ["asset-tools"]

[[bin]]
name = "mister-magik-ui-preview"
path = "src/bin/ui_preview.rs"
required-features = ["ui-preview"]

[dependencies]
mister-magik-tooling-support = { path = "../../crates/tooling-support", optional = true }
bytemuck = "1"
crc32fast = "1"
flate2 = "1"
hotpath = { version = "0.24", optional = true }
libc = "0.2"
lz4_flex = "0.14.0"
mister-magik-agent-protocol = { path = "../../crates/agent-protocol" }
mister-magik-core = { path = "../../crates/magik-core" }
mister-magik-framebuffer-stream = { path = "../../crates/framebuffer-stream" }
mister-magik-framebuffer-scenes = { path = "../../crates/framebuffer-scenes" }
mister-magik-scanout-contract = { path = "../../mister/platform/contracts/scanout" }
mister-magik-media-contract = { path = "../../crates/media-contract", default-features = false }
mister-magik-latch-contract = { path = "../../mister/platform/contracts/latch" }
mister-magik-platform-manifest-contract = { path = "../../mister/platform/contracts/manifest" }
# The runtime owns scanout-slot copy fast paths and their geometry fallbacks.
mister-magik-mister-runtime = { path = "../../mister/platform/runtime", default-features = false, features = ["app-runtime"] }
mister-magik-particles = { path = "../../crates/particles" }
mister-magik-perf-events = { path = "../../crates/perf-events" }
mister-magik-screenshot-parade = { path = "../../crates/screenshot-parade" }
# No "std" feature on purpose: that pulls system font loading (fontconfig), which
# we don't have/want on the MiSTer. Instead we embed a font for the software
# renderer (see build.rs) and provide time/etc. ourselves via the Platform trait.
# Our own crate still uses std freely; this only affects Slint internals. macOS
# host UI-test builds opt into Slint std below because Slint's AppKit system tray
# support assumes it, but non-macOS/device targets keep the embedded setup.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
quick-xml = "0.42"
swash = { version = "0.2.7", features = ["scale", "render"], optional = true }
pprof = { git = "https://github.com/NigelBreslaw/pprof-rs", branch = "armv7-itimer-abi", optional = true, default-features = false, features = ["flamegraph"] }
mister-magik-catalog = { path = "../../crates/catalog", default-features = false, features = ["builder"] }
mister-magik-ui = { path = "ui-generated", optional = true }
i-slint-core = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", optional = true, default-features = false }
i-slint-common = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", optional = true, default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", optional = true, default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "std"] }
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.13", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "72cf74306784e7d15374639ef110c1bb85c21cb0", optional = true, default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }

[target.'cfg(all(target_os = "linux", target_arch = "arm"))'.dependencies]
ffmpeg-next = { version = "8.1", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "static"] }

[build-dependencies]
cc = "1.4.2"

[dev-dependencies]
swash = { version = "0.2.7", features = ["scale", "render"] }

[features]
default = []
asset-tools = ["dep:swash"]
profile = ["dep:pprof"]
hotpath = ["dep:hotpath", "hotpath/hotpath-mcp", "mister-magik-catalog/hotpath-mcp"]
ui = ["dep:slint", "dep:i-slint-core", "dep:mister-magik-ui", "dep:ffmpeg-next", "mister-magik-mister-runtime/ui"]
magik2 = ["ui-device-tests", "dep:mister-magik-tooling-support", "mister-magik-catalog/development-layout"]
ui-device-tests = [
    "ui",
    "slint/system-testing",
    "dep:i-slint-common",
    "i-slint-common/fontconfig-dlopen",
]
ui-preview = ["dep:slint", "dep:i-slint-core", "dep:mister-magik-ui", "dep:softbuffer", "dep:winit", "mister-magik-mister-runtime/ui", "experiments"]
bench-tools = ["mister-magik-mister-runtime/bench-tools"]
bench-scenes = ["mister-magik-ui?/bench-scenes", "mister-magik-mister-runtime/bench-scenes"]
experiments = ["bench-scenes"]
diagnostics = ["mister-magik-mister-runtime/diagnostics"]
signed-media-manifests = ["mister-magik-media-contract/signed-media-manifests"]

[profile.release]
# Base optimized Cargo profile. MiSTer builds use release-device by default.
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[profile.ci-fast]
# Linked non-production ARM validation: preserve correctness checks while
# minimizing LLVM/codegen and link work in pull requests and main CI.
inherits = "dev"
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false

[profile.release-device]
# Full MiSTer release: thin LTO + thirty-two CGUs. This preserves opt-level 3 and
# whole-program optimization while materially shortening the final release
# build on the multicore development host. Binary size is intentionally not a
# delivery gate; the device parity gate remains runtime correctness, memory,
# and frame cadence.
# Cortex-A9 tuning is applied by the typed agent-cli ARM build state machine.
inherits = "release"
lto = "thin"
codegen-units = 32
# Retain function symbols for dormant on-device pprof while dropping bulky
# line-level debug sections.
strip = "debuginfo"

# Attended Slint system-testing binary. This is deliberately separate from the
# delivery profile so an operator cannot replace the production runtime by
# accidentally building the test transport.
[profile.release-device-ui-tests]
inherits = "release-device"

# Historical alias retained for reproducible comparison with the former
# thin-LTO/16-CGU candidate. Ordinary delivery selects release-device above.
[profile.release-device-thin]
inherits = "release-device"
lto = "thin"
codegen-units = 16

[profile.release-device-thin-stripped]
inherits = "release-device-thin"
strip = true

# Named alias for the measured thin-LTO/32-CGU baseline. Ordinary delivery
# selects release-device above.
[profile.release-device-thin-cgu32]
inherits = "release-device"
lto = "thin"
codegen-units = 32

[profile.release-device-profile]
# Profiling build: symbols + frame pointers for pprof flamegraphs on device.
inherits = "release-device"
strip = false
debug = true

[profile.release-live]
# Reproducible iteration profile retained for before/after particle compile-time
# measurements. It is build-only and is never selected by delivery.
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
