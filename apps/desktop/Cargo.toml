[package]
name = "mister-magik-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Desktop companion dashboard for MiSTer MagiK."
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
lz4_flex = "0.14.0"
mister-magik-framebuffer-stream = { path = "../../crates/framebuffer-stream" }
mister-magik-agent-protocol = { path = "../../crates/agent-protocol" }
png = "0.18.1"
serde_json = "1"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030"] }
slint-interpreter = { version = "=1.17.1", optional = true, default-features = false, features = ["compat-1-2", "display-diagnostics"] }
spin_on = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSToolbar", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSRunLoop", "NSString"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "=1.17.1"

[features]
default = ["live-ui"]
live-ui = ["dep:slint-interpreter", "dep:spin_on"]
compiled-ui = []
skia-renderer = ["slint/renderer-skia", "slint-interpreter?/renderer-skia"]
