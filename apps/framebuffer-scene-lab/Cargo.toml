[package]
name = "mister-magik-framebuffer-scene-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Focused Slint-free MagiK and cabinet particle lab"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-framebuffer-scene-lab"
path = "src/main.rs"

[[bin]]
name = "generate-intro-assets"
path = "src/bin/generate_intro_assets.rs"
required-features = ["asset-tools"]

[dependencies]
mister-magik-catalog = { path = "../../crates/catalog", default-features = false, features = ["reader"] }
mister-magik-framebuffer-scenes = { path = "../../crates/framebuffer-scenes" }
mister-magik-core = { path = "../../crates/magik-core" }
mister-magik-particles = { path = "../../crates/particles" }
mister-magik-screenshot-parade = { path = "../../crates/screenshot-parade" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = { version = "0.18.1", optional = true }
swash = { version = "0.2.7", features = ["scale", "render"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
softbuffer = "0.4.8"
winit = "0.30.13"

[target.'cfg(all(target_os = "linux", target_arch = "arm"))'.dependencies]
libc = "0.2"
mister-magik-mister-runtime = { path = "../../mister/platform/runtime", default-features = false, features = ["framebuffer-lab"] }
pprof = { git = "https://github.com/NigelBreslaw/pprof-rs", branch = "armv7-itimer-abi", optional = true, default-features = false, features = ["flamegraph"] }

[features]
default = []
asset-tools = ["dep:png", "dep:swash"]
profile = ["dep:pprof"]

[build-dependencies]
cc = "1.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
panic = "abort"

[profile.release-live]
inherits = "release"
opt-level = 2

[profile.release-device]
inherits = "release"
lto = "fat"
codegen-units = 2
strip = "debuginfo"

[profile.release-device-profile]
inherits = "release-device"
strip = false
debug = true
