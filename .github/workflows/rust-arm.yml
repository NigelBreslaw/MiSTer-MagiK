name: Rust ARM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"
  MISTER_CROSS_IMAGE: ghcr.io/nigelbreslaw/mister-magik-cross-armv7:ubuntu20-d047ace4d737

jobs:
  host-dev:
    name: host-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-host-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock', 'tools/magik-agent/Cargo.lock', 'tools/mister/Cargo.lock') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: Cache host build outputs
        uses: actions/cache@v6
        with:
          path: |
            magik-gui/target/debug
            tools/magik-agent/target/debug
            tools/mister/target/debug
          key: target-host-${{ runner.os }}-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock', 'tools/magik-agent/Cargo.lock', 'tools/mister/Cargo.lock') }}
          restore-keys: |
            target-host-${{ runner.os }}-

      - name: Full host validation
        run: scripts/validate full-host

      - name: Validate affected-path routing
        run: scripts/test-validate.sh

  ci-clippy:
    name: ci-clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-clippy-${{ runner.os }}-
            cargo-host-${{ runner.os }}-

      - name: Cache Clippy build outputs
        uses: actions/cache@v6
        with:
          path: magik-gui/target/debug
          key: target-clippy-${{ runner.os }}-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock') }}
          restore-keys: |
            target-clippy-${{ runner.os }}-
            target-host-${{ runner.os }}-

      - name: Clippy magik-gui host logic
        working-directory: magik-gui
        run: cargo clippy --lib --no-default-features -- -D warnings

  arm-build:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "$MISTER_CROSS_IMAGE"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache minimal FFmpeg
        uses: actions/cache@v6
        with:
          path: magik-gui/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-${{ runner.os }}-8.1.2-${{ hashFiles('magik-gui/scripts/build-minimal-ffmpeg.sh', 'magik-gui/Dockerfile.cross-armv7') }}

      - name: Cache ARM build outputs
        uses: actions/cache@v6
        with:
          path: |
            magik-gui/target/release-device
            magik-gui/target/armv7-unknown-linux-gnueabihf/release-device
          key: target-arm-${{ runner.os }}-release-device-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock', 'magik-gui/build.rs', 'magik-gui/build-arm.sh', 'magik-gui/Dockerfile.cross-armv7') }}
          restore-keys: |
            target-arm-${{ runner.os }}-release-device-

      - name: Build ARM binary
        env:
          MISTER_CARGO_TIMINGS: "1"
        run: magik-gui/build-arm.sh --device

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-release
          path: magik-gui/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Prove unchanged ARM builds are no-ops
        run: scripts/regression-arm-noop.sh --skip-warmup --verify-metadata

      - name: Check ARM shared libraries
        run: magik-gui/scripts/check-arm-shared-libs.sh magik-gui/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-fb

      - name: Upload ARM binary
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-fb-release
          path: magik-gui/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-fb
          if-no-files-found: error

      - name: Upload size history
        uses: actions/upload-artifact@v7
        with:
          name: binary-size-release
          path: build/binary-size.tsv
          if-no-files-found: error

  agent-arm-build:
    name: agent-arm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agent-${{ runner.os }}-${{ hashFiles('tools/magik-agent/Cargo.lock') }}
          restore-keys: |
            cargo-agent-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "$MISTER_CROSS_IMAGE"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache ARM agent build outputs
        uses: actions/cache@v6
        with:
          path: tools/magik-agent/target/armv7-unknown-linux-gnueabihf/release
          key: target-agent-arm-${{ runner.os }}-${{ hashFiles('tools/magik-agent/Cargo.lock', 'tools/magik-agent/Cargo.toml', 'tools/magik-agent/src/**', 'scripts/build-mister-agent.sh', 'magik-gui/Dockerfile.cross-armv7') }}
          restore-keys: |
            target-agent-arm-${{ runner.os }}-

      - name: Build ARM agent
        run: MISTER_ARM_BUILD_BACKEND=cross scripts/build-mister-agent.sh

      - name: Upload ARM agent
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-agent
          path: tools/magik-agent/target/armv7-unknown-linux-gnueabihf/release/mister-magik-agent
          if-no-files-found: error
