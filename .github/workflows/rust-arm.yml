name: Rust ARM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CROSS_IMAGE: cross-custom-rust:armv7-unknown-linux-gnueabihf-b52a5

jobs:
  host-dev:
    name: host-dev
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-host-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: Format
        working-directory: magik-gui
        run: cargo fmt --check

      - name: Test host logic
        working-directory: magik-gui
        run: cargo test --lib --no-default-features

      - name: Check host logic
        working-directory: magik-gui
        run: cargo check --lib --no-default-features

  arm-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            args: --fast
            profile: release
            features: none
          - name: device
            args: --device
            profile: release-device
            features: none
          - name: fast-video
            args: --fast --video
            profile: release
            features: video
          - name: device-video
            args: --device --video
            profile: release-device
            features: video

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: |
          rustup show
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v4
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Cache minimal FFmpeg
        if: matrix.features == 'video'
        uses: actions/cache@v4
        with:
          path: magik-gui/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-${{ runner.os }}-8.1.1-${{ hashFiles('magik-gui/scripts/build-minimal-ffmpeg.sh', 'magik-gui/Dockerfile.cross-armv7') }}

      - name: Build ARM binary
        run: magik-gui/build-arm.sh ${{ matrix.args }}

      - name: Check ARM shared libraries
        run: magik-gui/scripts/check-arm-shared-libs.sh magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}/mister-magik-fb

      - name: Upload ARM binary
        uses: actions/upload-artifact@v4
        with:
          name: mister-magik-fb-${{ matrix.name }}
          path: magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}/mister-magik-fb
          if-no-files-found: error

      - name: Upload size history
        uses: actions/upload-artifact@v4
        with:
          name: binary-size-${{ matrix.name }}
          path: build/binary-size.tsv
          if-no-files-found: error
