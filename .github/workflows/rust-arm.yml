name: Rust ARM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"

jobs:
  host-dev-group:
    name: host-dev (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: quality
            paths: agent-cli scripts docs/agents
          - group: domain
            paths: crates/magik-core mister/platform/runtime
          - group: app
            paths: apps/mister
          - group: catalog
            paths: crates/catalog
          - group: tools
            paths: agent-cli mister/tools/agent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-agent-cli

      - name: Install host validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup default "$toolchain"
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-host-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_host }}
          restore-keys: |
            cargo-host-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Full host validation (${{ matrix.group }})
        run: scripts/agent ci host-assurance --paths ${{ matrix.paths }}

  host-dev:
    name: host-dev
    runs-on: ubuntu-24.04
    needs: host-dev-group
    if: always()
    steps:
      - name: Require every host validation group
        env:
          GROUP_RESULT: ${{ needs.host-dev-group.result }}
        run: test "$GROUP_RESULT" = success

  arm-build:
    name: arm-ci-fast
    # Documentation Dependabot PRs cannot access the private build-assets key
    # and cannot affect the ARM runtime.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !startsWith(github.head_ref, 'dependabot/npm_and_yarn/documentation/')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve private asset revision
        id: magik-assets-ref
        run: echo "sha=$(git rev-parse HEAD:private/magik-assets)" >> "$GITHUB_OUTPUT"

      - name: Checkout private build assets
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/mister-magik-private-assets
          ref: ${{ steps.magik-assets-ref.outputs.sha }}
          path: private/magik-assets
          ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}

      - uses: ./.github/actions/setup-agent-cli

      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_arm }}
          restore-keys: |
            cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CROSS_VERSION }}-${{ steps.cache-id.outputs.cross_abi }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "${{ steps.cache-id.outputs.cross_image }}"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache minimal FFmpeg
        uses: actions/cache@v6
        with:
          path: apps/mister/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-v2-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-8.1.2-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.ffmpeg }}

      - name: Cache ARM build outputs
        uses: actions/cache@v6
        with:
          path: |
            apps/mister/target/ci-fast
            !apps/mister/target/ci-fast/incremental
            apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast
            !apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/incremental
          key: target-arm-v3-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.arm_target }}
          restore-keys: |
            target-arm-v3-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-

      - name: Build ARM binary
        env:
          MISTER_CARGO_TIMINGS: "1"
        run: |
          docker image inspect "${{ steps.cache-id.outputs.cross_image }}" >/dev/null
          MISTER_ARM_BUILD_BACKEND=cross scripts/agent build runtime-ci

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-ci-fast
          path: apps/mister/target/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14

      - name: Check ARM shared libraries
        run: apps/mister/scripts/check-arm-shared-libs.sh apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-fb

      - name: Upload ARM binary
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-fb-ci-fast
          path: apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-fb
          if-no-files-found: error

  agent-arm-build:
    name: agent-arm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-agent-cli

      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agent-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_agent }}
          restore-keys: |
            cargo-agent-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CROSS_VERSION }}-${{ steps.cache-id.outputs.cross_abi }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "${{ steps.cache-id.outputs.cross_image }}"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache ARM agent build outputs
        uses: actions/cache@v6
        with:
          path: |
            mister/tools/agent/target/armv7-unknown-linux-gnueabihf/ci-fast
            !mister/tools/agent/target/armv7-unknown-linux-gnueabihf/ci-fast/incremental
          key: target-agent-arm-v3-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.agent_target }}
          restore-keys: |
            target-agent-arm-v3-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-

      - name: Build ARM agent
        run: |
          docker image inspect "${{ steps.cache-id.outputs.cross_image }}" >/dev/null
          MISTER_ARM_BUILD_BACKEND=cross scripts/agent build device-agent-ci

      - name: Upload ARM agent
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-agent-ci-fast
          path: mister/tools/agent/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-agent
          if-no-files-found: error
