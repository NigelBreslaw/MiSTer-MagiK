name: Rust ARM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"

jobs:
  launcher-neon-parity:
    name: launcher-neon-parity
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check current and fast NEON kernels
        run: scripts/magik-ci neon-parity

  host-dev-group:
    name: host-dev (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [static, domain, catalog, tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/host-validation
        with:
          group: ${{ matrix.group }}

  host-dev-app-shard:
    name: host-dev (app / ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [checks, ui, ui-preview, bench-scenes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/host-validation
        with:
          group: app
          app-shard: ${{ matrix.shard }}
          assets-ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}

  host-dev-app:
    name: host-dev (app)
    runs-on: ubuntu-24.04
    needs: host-dev-app-shard
    if: always()
    steps:
      - name: Require every app validation shard
        env:
          SHARD_RESULT: ${{ needs.host-dev-app-shard.result }}
        run: test "$SHARD_RESULT" = success

  host-dev:
    name: host-dev
    runs-on: ubuntu-24.04
    needs: [host-dev-group, host-dev-app, python-quality]
    if: always()
    steps:
      - name: Require every host validation group
        env:
          GROUP_RESULT: ${{ needs.host-dev-group.result }}
          APP_RESULT: ${{ needs.host-dev-app.result }}
          PYTHON_RESULT: ${{ needs.python-quality.result }}
        run: test "$GROUP_RESULT" = success && test "$APP_RESULT" = success && test "$PYTHON_RESULT" = success

  python-quality:
    name: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Python toolchain
        uses: ./.github/actions/setup-python-tools
      - name: Check formatting
        id: format
        continue-on-error: true
        run: scripts/magik-ci quality format
      - name: Lint Python tooling
        id: lint
        continue-on-error: true
        run: scripts/magik-ci quality lint
      - name: Type-check Python tooling
        id: typecheck
        continue-on-error: true
        run: scripts/magik-ci quality typecheck
      - name: Run Python tests
        id: tests
        continue-on-error: true
        run: uv run pytest scripts/tests -q --ignore scripts/tests/test-slint-build-contract.py
      - name: Summarize Python quality
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          status=0
          report() {
            label="$1"
            outcome="$2"
            if [ "$outcome" = success ]; then
              echo "$label: passed"
            else
              echo "::error::$label: $outcome"
              status=1
            fi
          }
          report format "$FORMAT_OUTCOME"
          report lint "$LINT_OUTCOME"
          report typecheck "$TYPECHECK_OUTCOME"
          report tests "$TESTS_OUTCOME"
          exit "$status"

  launcher-visual-matrix:
    name: launcher-visual-matrix
    if: ${{ false }} # Temporarily disabled while the visual baselines are broken.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve private asset revision
        id: magik-assets-ref
        run: echo "sha=$(git rev-parse HEAD:private/magik-assets)" >> "$GITHUB_OUTPUT"

      - name: Checkout private build assets
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/mister-magik-private-assets
          ref: ${{ steps.magik-assets-ref.outputs.sha }}
          path: private/magik-assets
          ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}


      - name: Select application Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' apps/mister/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup default "$toolchain"

      - name: Compare launcher visual matrix
        run: scripts/magik-ci ci host-assurance --paths apps/mister/tests/visual-baselines/launcher

      - name: Upload launcher visual mismatches
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launcher-visual-mismatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/launcher-visual-check-*/mismatch/*.png
          if-no-files-found: ignore
          retention-days: 14

  arm-build:
    name: arm-ci-fast
    # Dependabot PRs cannot access the private build-assets key. Their public
    # Rust ARM assurance remains required below.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve private asset revision
        id: magik-assets-ref
        run: echo "sha=$(git rev-parse HEAD:private/magik-assets)" >> "$GITHUB_OUTPUT"

      - name: Checkout private build assets
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/mister-magik-private-assets
          ref: ${{ steps.magik-assets-ref.outputs.sha }}
          path: private/magik-assets
          ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}


      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_arm }}
          restore-keys: |
            cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CROSS_VERSION }}-${{ steps.cache-id.outputs.cross_abi }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "${{ steps.cache-id.outputs.cross_image }}"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache minimal FFmpeg
        uses: actions/cache@v6
        with:
          path: apps/mister/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-v2-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-8.1.2-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.ffmpeg }}

      - name: Cache ARM build outputs
        uses: actions/cache@v6
        with:
          path: |
            apps/mister/target/ci-fast
            !apps/mister/target/ci-fast/incremental
            apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast
            !apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/incremental
          # Actions caches are immutable. Keep this dependency baseline exact-only:
          # a rolling restore prefix would copy stale Cargo artifacts into every new key.
          key: target-arm-v4-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.arm_build_cache }}

      - name: Build ARM binary
        env:
          MISTER_CARGO_TIMINGS: "1"
        run: |
          docker image inspect "${{ steps.cache-id.outputs.cross_image }}" >/dev/null
          MISTER_ARM_BUILD_BACKEND=cross scripts/magik-ci build runtime-ci

      - name: Report ARM cache footprint
        if: always()
        shell: bash
        run: |
          {
            echo "### ARM target cache footprint"
            echo
            echo "| Path | Uncompressed size |"
            echo "| --- | ---: |"
            for path in \
              apps/mister/target/ci-fast \
              apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast
            do
              if [[ -d "$path" ]]; then
                kib="$(du -sk "$path" | awk '{print $1}')"
                mib="$(( (kib + 1023) / 1024 ))"
                printf '| `%s` | %s MiB |\n' "$path" "$mib"
              else
                printf '| `%s` | not present |\n' "$path"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-ci-fast
          path: apps/mister/target/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14

      - name: Check ARM shared libraries
        run: apps/mister/scripts/check-arm-shared-libs.sh apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-fb

      - name: Upload ARM binary
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-fb-ci-fast
          path: apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-fb
          if-no-files-found: error

  arm-library-check:
    name: arm-library-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve private asset revision
        id: magik-assets-ref
        run: echo "sha=$(git rev-parse HEAD:private/magik-assets)" >> "$GITHUB_OUTPUT"

      - name: Checkout private build assets
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/mister-magik-private-assets
          ref: ${{ steps.magik-assets-ref.outputs.sha }}
          path: private/magik-assets
          ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}

      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_arm }}
          restore-keys: |
            cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CROSS_VERSION }}-${{ steps.cache-id.outputs.cross_abi }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: docker pull "${{ steps.cache-id.outputs.cross_image }}"

      - name: Cache ARM library check outputs
        uses: actions/cache@v6
        with:
          path: |
            apps/mister/target/debug
            !apps/mister/target/debug/incremental
            apps/mister/target/armv7-unknown-linux-gnueabihf/debug
            !apps/mister/target/armv7-unknown-linux-gnueabihf/debug/incremental
          key: target-arm-library-v1-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-check-debug0-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.arm_build_cache }}-${{ hashFiles('scripts/magik_ci/build.py') }}

      - name: Check ARM no-default library
        run: MISTER_ARM_BUILD_BACKEND=cross scripts/magik-ci build runtime-library-ci

      - name: Report ARM library cache footprint
        if: always()
        run: |
          for path in apps/mister/target/debug apps/mister/target/armv7-unknown-linux-gnueabihf/debug; do
            if [ -d "$path" ]; then
              kib="$(du -sk "$path" | awk '{print $1}')"
              printf 'ARM library cache (%s): %s MiB\n' "$path" "$(( (kib + 1023) / 1024 ))" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
