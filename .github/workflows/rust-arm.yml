name: Rust ARM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"

jobs:
  host-dev-group:
    name: host-dev (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: quality
            paths: agent-cli scripts docs/agents
          - group: domain
            paths: crates/magik-core mister/platform/runtime
          - group: app
            paths: apps/mister
          - group: catalog
            paths: crates/catalog
          - group: tools
            paths: agent-cli mister/tools/agent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Install host validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup default "$toolchain"
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-host-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_host }}
          restore-keys: |
            cargo-host-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Full host validation (${{ matrix.group }})
        run: scripts/magik-ci ci host-assurance --paths ${{ matrix.paths }}

  host-dev:
    name: host-dev
    runs-on: ubuntu-24.04
    needs: [host-dev-group, python-quality]
    if: always()
    steps:
      - name: Require every host validation group
        env:
          GROUP_RESULT: ${{ needs.host-dev-group.result }}
          PYTHON_RESULT: ${{ needs.python-quality.result }}
        run: test "$GROUP_RESULT" = success && test "$PYTHON_RESULT" = success

  python-quality:
    name: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Python toolchain
        uses: ./.github/actions/setup-python-tools
      - name: Check formatting
        id: format
        continue-on-error: true
        run: uv run ruff format --check scripts apps/mister/ui_tests
      - name: Lint maintained scripts
        id: lint
        continue-on-error: true
        run: uv run ruff check scripts apps/mister/ui_tests
      - name: Type-check migrated tooling
        id: typecheck
        continue-on-error: true
        run: uv run ty check scripts/magik_ci scripts/tests/test_magik_ci.py apps/mister/ui_tests
      - name: Run Python tests
        id: tests
        continue-on-error: true
        run: uv run pytest scripts/tests -q
      - name: Summarize Python quality
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          status=0
          report() {
            label="$1"
            outcome="$2"
            if [ "$outcome" = success ]; then
              echo "$label: passed"
            else
              echo "::error::$label: $outcome"
              status=1
            fi
          }
          report format "$FORMAT_OUTCOME"
          report lint "$LINT_OUTCOME"
          report typecheck "$TYPECHECK_OUTCOME"
          report tests "$TESTS_OUTCOME"
          exit "$status"

  launcher-visual-matrix:
    name: launcher-visual-matrix
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve private asset revision
        id: magik-assets-ref
        run: echo "sha=$(git rev-parse HEAD:private/magik-assets)" >> "$GITHUB_OUTPUT"

      - name: Checkout private build assets
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/mister-magik-private-assets
          ref: ${{ steps.magik-assets-ref.outputs.sha }}
          path: private/magik-assets
          ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}


      - name: Select application Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' apps/mister/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup default "$toolchain"

      - name: Compare launcher visual matrix
        run: scripts/magik-ci ci host-assurance --paths apps/mister/tests/visual-baselines/launcher

      - name: Upload launcher visual mismatches
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launcher-visual-mismatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/launcher-visual-check-*/mismatch/*.png
          if-no-files-found: ignore
          retention-days: 14

  arm-build:
    name: arm-ci-fast
    # Dependabot PRs cannot access the private build-assets key. Their public
    # Rust and agent ARM assurance remains required below.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve private asset revision
        id: magik-assets-ref
        run: echo "sha=$(git rev-parse HEAD:private/magik-assets)" >> "$GITHUB_OUTPUT"

      - name: Checkout private build assets
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/mister-magik-private-assets
          ref: ${{ steps.magik-assets-ref.outputs.sha }}
          path: private/magik-assets
          ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}


      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_arm }}
          restore-keys: |
            cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CROSS_VERSION }}-${{ steps.cache-id.outputs.cross_abi }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "${{ steps.cache-id.outputs.cross_image }}"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache minimal FFmpeg
        uses: actions/cache@v6
        with:
          path: apps/mister/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-v2-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-8.1.2-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.ffmpeg }}

      - name: Cache ARM build outputs
        uses: actions/cache@v6
        with:
          path: |
            apps/mister/target/ci-fast
            !apps/mister/target/ci-fast/incremental
            apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast
            !apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/incremental
          # Actions caches are immutable. Keep this dependency baseline exact-only:
          # a rolling restore prefix would copy stale Cargo artifacts into every new key.
          key: target-arm-v4-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.arm_build_cache }}

      - name: Build ARM binary
        env:
          MISTER_CARGO_TIMINGS: "1"
        run: |
          docker image inspect "${{ steps.cache-id.outputs.cross_image }}" >/dev/null
          MISTER_ARM_BUILD_BACKEND=cross scripts/magik-ci build runtime-ci

      - name: Report ARM cache footprint
        if: always()
        shell: bash
        run: |
          {
            echo "### ARM target cache footprint"
            echo
            echo "| Path | Uncompressed size |"
            echo "| --- | ---: |"
            for path in \
              apps/mister/target/ci-fast \
              apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast
            do
              if [[ -d "$path" ]]; then
                kib="$(du -sk "$path" | awk '{print $1}')"
                mib="$(( (kib + 1023) / 1024 ))"
                printf '| `%s` | %s MiB |\n' "$path" "$mib"
              else
                printf '| `%s` | not present |\n' "$path"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-ci-fast
          path: apps/mister/target/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14

      - name: Check ARM shared libraries
        run: apps/mister/scripts/check-arm-shared-libs.sh apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-fb

      - name: Upload ARM binary
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-fb-ci-fast
          path: apps/mister/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-fb
          if-no-files-found: error

  device-agent-arm-build:
    name: device-agent-arm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agent-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_agent }}
          restore-keys: |
            cargo-agent-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CROSS_VERSION }}-${{ steps.cache-id.outputs.cross_abi }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "${{ steps.cache-id.outputs.cross_image }}"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache ARM agent build outputs
        uses: actions/cache@v6
        with:
          path: |
            mister/tools/agent/target/armv7-unknown-linux-gnueabihf/ci-fast
            !mister/tools/agent/target/armv7-unknown-linux-gnueabihf/ci-fast/incremental
          key: target-agent-arm-v3-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.agent_target }}
          restore-keys: |
            target-agent-arm-v3-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-ci-fast-${{ steps.cache-id.outputs.cross_abi }}-

      - name: Build ARM agent
        run: |
          docker image inspect "${{ steps.cache-id.outputs.cross_image }}" >/dev/null
          MISTER_ARM_BUILD_BACKEND=cross scripts/magik-ci build device-agent-ci

      - name: Upload ARM agent
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-agent-ci-fast
          path: mister/tools/agent/target/armv7-unknown-linux-gnueabihf/ci-fast/mister-magik-agent
          if-no-files-found: error
