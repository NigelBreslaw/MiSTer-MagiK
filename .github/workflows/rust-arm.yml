name: Rust ARM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"
  MISTER_CROSS_IMAGE: cross-custom-rust:armv7-unknown-linux-gnueabihf-b52a5

jobs:
  host-dev:
    name: host-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-host-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock', 'tools/magik-agent/Cargo.lock', 'tools/mister/Cargo.lock') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: Cache host build outputs
        uses: actions/cache@v6
        with:
          path: |
            magik-gui/target/debug
            tools/magik-agent/target/debug
            tools/mister/target/debug
          key: target-host-${{ runner.os }}-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock', 'tools/magik-agent/Cargo.lock', 'tools/mister/Cargo.lock') }}
          restore-keys: |
            target-host-${{ runner.os }}-

      - name: Format
        working-directory: magik-gui
        run: cargo fmt --check

      - name: Test host logic
        working-directory: magik-gui
        run: cargo test --lib --no-default-features

      - name: Test catalog crate
        run: cargo test --manifest-path magik-gui/catalog/Cargo.toml

      - name: Clippy catalog crate
        run: cargo clippy --manifest-path magik-gui/catalog/Cargo.toml --all-targets -- -D warnings

      - name: Check host logic
        working-directory: magik-gui
        run: cargo check --lib --no-default-features

      - name: Check host tools
        run: scripts/dev-rust host-tools

      - name: Check MagiK agent
        run: cargo check --manifest-path tools/magik-agent/Cargo.toml

      - name: Clippy host tools
        run: cargo clippy --manifest-path tools/mister/Cargo.toml --all-targets -- -D warnings

      - name: Clippy MagiK agent
        run: cargo clippy --manifest-path tools/magik-agent/Cargo.toml --all-targets -- -D warnings

  ci-clippy:
    name: ci-clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-clippy-${{ runner.os }}-
            cargo-host-${{ runner.os }}-

      - name: Cache Clippy build outputs
        uses: actions/cache@v6
        with:
          path: magik-gui/target/debug
          key: target-clippy-${{ runner.os }}-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock') }}
          restore-keys: |
            target-clippy-${{ runner.os }}-
            target-host-${{ runner.os }}-

      - name: Clippy magik-gui host logic
        working-directory: magik-gui
        run: cargo clippy --lib --no-default-features -- -D warnings

  arm-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            args: --device
            profile: release-device
            features: none
          - name: release-video
            args: --device --video
            profile: release-device
            features: video

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Cache minimal FFmpeg
        if: matrix.features == 'video'
        uses: actions/cache@v6
        with:
          path: magik-gui/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-${{ runner.os }}-8.1.2-${{ hashFiles('magik-gui/scripts/build-minimal-ffmpeg.sh', 'magik-gui/Dockerfile.cross-armv7') }}

      - name: Cache ARM build outputs
        uses: actions/cache@v6
        with:
          path: |
            magik-gui/target/${{ matrix.profile }}
            magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}
          key: target-arm-${{ runner.os }}-${{ matrix.name }}-${{ matrix.profile }}-${{ matrix.features }}-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock', 'magik-gui/build.rs', 'magik-gui/build-arm.sh', 'magik-gui/Dockerfile.cross-armv7') }}
          restore-keys: |
            target-arm-${{ runner.os }}-${{ matrix.name }}-${{ matrix.profile }}-${{ matrix.features }}-
            target-arm-${{ runner.os }}-${{ matrix.name }}-

      - name: Measure ARM cache payload
        shell: bash
        run: |
          set +e
          for dir in \
            "magik-gui/target/${{ matrix.profile }}" \
            "magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}"
          do
            if [ -d "$dir" ]; then
              echo "::group::$dir"
              du -sh "$dir" || true
              find "$dir" -mindepth 1 -maxdepth 1 -exec du -sh {} + | sort -h | tail -20 || true
              echo "::endgroup::"

              for child in deps build; do
                if [ -d "$dir/$child" ]; then
                  echo "::group::$dir/$child file payload"
                  find "$dir/$child" -type f -printf '%s %p\n' | sort -nr | head -30 || true
                  find "$dir/$child" -type f -printf '%f %s\n' | awk '
                    {
                      name=$1
                      size=$2
                      ext="(none)"
                      if (name ~ /\./) {
                        ext=name
                        sub(/^.*\./, ".", ext)
                      }
                      bytes[ext]+=size
                      count[ext]+=1
                    }
                    END {
                      for (ext in bytes) {
                        printf "%12d %8d %s\n", bytes[ext], count[ext], ext
                      }
                    }
                  ' | sort -nr | head -20 || true
                  echo "::endgroup::"
                fi
              done
            else
              echo "missing $dir"
            fi
          done
          exit 0

      - name: Build ARM binary
        run: magik-gui/build-arm.sh ${{ matrix.args }}

      - name: Check ARM shared libraries
        run: magik-gui/scripts/check-arm-shared-libs.sh magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}/mister-magik-fb

      - name: Upload ARM binary
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-fb-${{ matrix.name }}
          path: magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}/mister-magik-fb
          if-no-files-found: error

      - name: Upload size history
        uses: actions/upload-artifact@v7
        with:
          name: binary-size-${{ matrix.name }}
          path: build/binary-size.tsv
          if-no-files-found: error

  agent-arm-build:
    name: agent-arm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-agent-${{ runner.os }}-${{ hashFiles('tools/magik-agent/Cargo.lock') }}
          restore-keys: |
            cargo-agent-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Cache ARM agent build outputs
        uses: actions/cache@v6
        with:
          path: tools/magik-agent/target/armv7-unknown-linux-gnueabihf/release
          key: target-agent-arm-${{ runner.os }}-${{ hashFiles('tools/magik-agent/Cargo.lock', 'tools/magik-agent/Cargo.toml', 'tools/magik-agent/src/main.rs', 'scripts/build-mister-agent.sh', 'magik-gui/Dockerfile.cross-armv7') }}
          restore-keys: |
            target-agent-arm-${{ runner.os }}-

      - name: Build ARM agent
        run: MISTER_ARM_BUILD_BACKEND=cross scripts/build-mister-agent.sh

      - name: Upload ARM agent
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-agent
          path: tools/magik-agent/target/armv7-unknown-linux-gnueabihf/release/mister-magik-agent
          if-no-files-found: error
