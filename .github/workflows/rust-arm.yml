name: Rust ARM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APPLE_CONTAINER_VERSION: 1.0.0
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CROSS_IMAGE: cross-custom-rust:armv7-unknown-linux-gnueabihf-b52a5

jobs:
  host-dev:
    name: host-dev
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-host-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: Format
        working-directory: magik-gui
        run: cargo fmt --check

      - name: Test host logic
        working-directory: magik-gui
        run: cargo test --lib --no-default-features

      - name: Check host logic
        working-directory: magik-gui
        run: cargo check --lib --no-default-features

      - name: Check host tools
        run: scripts/dev-rust host-tools

      - name: Clippy host tools
        run: cargo clippy --manifest-path tools/mister/Cargo.toml --all-targets -- -D warnings

  arm-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            args: --fast
            profile: release
            features: none
          - name: device
            args: --device
            profile: release-device
            features: none
          - name: fast-video
            args: --fast --video
            profile: release
            features: video
          - name: device-video-full
            args: --device --all-scenes --video
            profile: release-device
            features: video

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: |
          rustup show
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v4
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Cache minimal FFmpeg
        if: matrix.features == 'video'
        uses: actions/cache@v4
        with:
          path: magik-gui/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-${{ runner.os }}-8.1.1-${{ hashFiles('magik-gui/scripts/build-minimal-ffmpeg.sh', 'magik-gui/Dockerfile.cross-armv7') }}

      - name: Build ARM binary
        run: magik-gui/build-arm.sh ${{ matrix.args }}

      - name: Check ARM shared libraries
        run: magik-gui/scripts/check-arm-shared-libs.sh magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}/mister-magik-fb

      - name: Upload ARM binary
        uses: actions/upload-artifact@v4
        with:
          name: mister-magik-fb-${{ matrix.name }}
          path: magik-gui/target/armv7-unknown-linux-gnueabihf/${{ matrix.profile }}/mister-magik-fb
          if-no-files-found: error

      - name: Upload size history
        uses: actions/upload-artifact@v4
        with:
          name: binary-size-${{ matrix.name }}
          path: build/binary-size.tsv
          if-no-files-found: error

  macos-arm64-native-container:
    name: macos-arm64-native-container
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 90
    env:
      DOCKER_DEFAULT_PLATFORM: ""
      MISTER_APPLE_CONTAINER_TARGET_DIR: /private/tmp/mister-magik-apple-container-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native macOS ARM runner
        run: |
          echo "host arch: $(uname -m)"
          test "$(uname -m)" = "arm64"
          if command -v cross >/dev/null 2>&1; then
            echo "cross is present on PATH but this job will not call it"
          fi
          if command -v docker >/dev/null 2>&1; then
            echo "Docker is present on PATH but this job will not call it"
          fi

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: |
          rustup toolchain add stable-aarch64-unknown-linux-gnu --profile minimal --force-non-host
          rustup target add armv7-unknown-linux-gnueabihf --toolchain stable-aarch64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-apple-container-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock') }}
          restore-keys: |
            cargo-apple-container-${{ runner.os }}-

      - name: Cache Apple-container target
        uses: actions/cache@v4
        with:
          path: /private/tmp/mister-magik-apple-container-target
          key: apple-container-target-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock', 'magik-gui/Dockerfile.cross-armv7') }}
          restore-keys: |
            apple-container-target-${{ runner.os }}-

      - name: Install Apple container
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if command -v container >/dev/null 2>&1; then
            container --version
            exit 0
          fi
          mkdir -p /tmp/apple-container
          gh release download "$APPLE_CONTAINER_VERSION" \
            --repo apple/container \
            --pattern '*.pkg' \
            --dir /tmp/apple-container
          ls -la /tmp/apple-container
          pkg="$(find /tmp/apple-container -maxdepth 1 -name '*.pkg' | head -n 1)"
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /
          container --version

      - name: Start Apple container services
        run: |
          container system start
          container builder start --cpus 3 --memory 5g

      - name: Build ARM binary with native Apple container
        run: magik-gui/build-arm64-apple-container.sh --fast

      - name: Upload macOS ARM-native binary
        uses: actions/upload-artifact@v4
        with:
          name: mister-magik-fb-macos-arm64-native
          path: /private/tmp/mister-magik-apple-container-target/armv7-unknown-linux-gnueabihf/release/mister-magik-fb
          if-no-files-found: error
