name: Build MiSTer MagiK Platform

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Promote the verified candidate as the next platform release
        required: false
        default: false
        type: boolean
      retain_experimental_fpga:
        description: Retain an unqualified diagnostic RBF when FPGA signoff fails
        required: false
        default: false
        type: boolean

concurrency:
  group: build-mister-magik-platform
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  MAIN_REPOSITORY: NigelBreslaw/Main_MiSTer
  MAIN_BRANCH: mister-magik
  MAIN_TOOLCHAIN_VERSION: gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf

jobs:
  plan:
    name: Plan component reuse and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      current-version: ${{ steps.plan.outputs.current_version }}
      next-version: ${{ steps.plan.outputs.next_version }}
      release-tag: ${{ steps.plan.outputs.release_tag }}
      update-needed: ${{ steps.plan.outputs.update_needed }}
      main-changed: ${{ steps.plan.outputs.main_changed }}
      fpga-changed: ${{ steps.plan.outputs.fpga_changed }}
      kernel-changed: ${{ steps.plan.outputs.kernel_changed }}
      main-id: ${{ steps.identity.outputs.main_id }}
      fpga-id: ${{ steps.reuse.outputs.fpga_id || steps.identity.outputs.fpga_id }}
      fpga-synthesis-id: ${{ steps.identity.outputs.fpga_synthesis_id }}
      kernel-id: ${{ steps.reuse.outputs.kernel_id || steps.identity.outputs.kernel_id }}
      main-revision: ${{ steps.identity.outputs.main_revision }}
      bundle-id: ${{ steps.plan.outputs.bundle_id }}
      candidate-hit: ${{ steps.reuse.outputs.candidate_hit }}
      main-cache-hit: ${{ steps.reuse.outputs.main_hit }}
      fpga-cache-hit: ${{ steps.reuse.outputs.fpga_hit }}
      kernel-cache-hit: ${{ steps.reuse.outputs.kernel_hit }}
      main-cache-run-id: ${{ steps.reuse.outputs.main_run_id }}
      fpga-cache-run-id: ${{ steps.reuse.outputs.fpga_run_id }}
      kernel-cache-run-id: ${{ steps.reuse.outputs.kernel_run_id }}
      main-cache-head-sha: ${{ steps.reuse.outputs.main_head_sha }}
      fpga-cache-head-sha: ${{ steps.reuse.outputs.fpga_head_sha }}
      kernel-cache-head-sha: ${{ steps.reuse.outputs.kernel_head_sha }}
    steps:
      - name: Refuse non-main dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Platform builds are restricted to main; got $GITHUB_REF" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent-cli

      - name: Verify checked-out main
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Capture desired component identities
        id: identity
        run: |
          set -euo pipefail
          main_revision="$(git ls-remote "https://github.com/$MAIN_REPOSITORY.git" "refs/heads/$MAIN_BRANCH" | awk '{print $1}')"
          [[ "$main_revision" =~ ^[0-9a-f]{40}$ ]]
          main_id="$(python3 scripts/release/platform/main-component.py identity --revision "$main_revision")"
          fpga_id="$(python3 scripts/release/platform/platform-component-id.py component fpga)"
          fpga_synthesis_id="$(python3 scripts/release/platform/platform-component-id.py component fpga-synthesis)"
          kernel_id="$(python3 scripts/release/platform/platform-component-id.py component kernel)"
          printf 'main_revision=%s\nmain_id=%s\nfpga_id=%s\nfpga_synthesis_id=%s\nkernel_id=%s\n' \
            "$main_revision" "$main_id" "$fpga_id" "$fpga_synthesis_id" "$kernel_id" >> "$GITHUB_OUTPUT"

      - name: Inspect latest platform release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$SECONDS
          mkdir -p build/platform-current/release
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/platform-current/releases.json
          tag="$(python3 scripts/release/databases/select-published-release.py platform --releases build/platform-current/releases.json)"
          version="$(python3 scripts/release/databases/select-published-release.py platform --field version --releases build/platform-current/releases.json)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir build/platform-current/release \
            --pattern 'platform-bundle-v0.2.json' --pattern 'SHA256SUMS'
          manifest="build/platform-current/release/platform-bundle-v0.2.json"
          test -f "$manifest"
          grep '  platform-bundle-v0.2.json$' build/platform-current/release/SHA256SUMS \
            | (cd build/platform-current/release && sha256sum -c -)
          test "$(jq -r .format "$manifest")" = mister-magik-platform-bundle-v0.2
          printf 'version=%s\ntag=%s\nmanifest=%s\n' "$version" "$tag" "$manifest" >> "$GITHUB_OUTPUT"
          printf 'latest manifest inspection: %ss, %s bytes\n' "$((SECONDS-started))" "$(stat -c %s "$manifest")" >> "$GITHUB_STEP_SUMMARY"

      - name: Plan platform update
        id: plan
        run: |
          scripts/agent ci platform-bundle plan-update \
            --manifest '${{ steps.current.outputs.manifest }}' \
            --current-version '${{ steps.current.outputs.version }}' \
            --main-id '${{ steps.identity.outputs.main_id }}' \
            --fpga-id '${{ steps.identity.outputs.fpga_id }}' \
            --kernel-id '${{ steps.identity.outputs.kernel_id }}' \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve exact reusable candidate and components
        id: reuse
        if: steps.plan.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ID: ${{ steps.plan.outputs.bundle_id }}
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
          MAIN_CHANGED: ${{ steps.plan.outputs.main_changed }}
          FPGA_CHANGED: ${{ steps.plan.outputs.fpga_changed }}
          KERNEL_CHANGED: ${{ steps.plan.outputs.kernel_changed }}
          MAIN_ID: ${{ steps.identity.outputs.main_id }}
          FPGA_ID: ${{ steps.identity.outputs.fpga_id }}
          KERNEL_ID: ${{ steps.identity.outputs.kernel_id }}
          MAIN_REVISION: ${{ steps.identity.outputs.main_revision }}
        run: |
          set -euo pipefail
          reuse_started=$SECONDS
          mkdir -p build/platform-reuse
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > build/platform-reuse/artifacts.json
          resolve() {
            local kind="$1" name="$2" identity="$3" artifact_id run_id head_sha attempt details canonical archive manifest verification
            while IFS=$'\t' read -r artifact_id run_id head_sha; do
              [[ "$artifact_id" =~ ^[0-9]+$ ]] || continue
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              details="build/platform-reuse/run-$run_id.json"
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion,workflowName,headBranch,event,headSha > "$details" || continue
              scripts/agent ci platform-eligible-run "$details" "$head_sha" || continue
              attempt="build/platform-reuse/attempt-$kind-$artifact_id"
              mkdir -p "$attempt"
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$attempt" || continue
              if [ "$kind" = candidate ]; then
                archive="$attempt/mister-magik-platform-v0.$NEXT_VERSION.zip"
                manifest="$attempt/platform-bundle-v0.2.json"
                scripts/agent ci platform-bundle verify "$archive" \
                  --manifest "$manifest" --release-version "$NEXT_VERSION" >/dev/null || continue
                [ "$(jq -r .bundle_id "$manifest")" = "$BUNDLE_ID" ] || continue
              else
                args=(--component "$kind" --artifact "$attempt" --component-id "$identity")
                [ "$kind" != main ] || args+=(--revision "$MAIN_REVISION")
                verification="build/platform-reuse/verification-$kind-$artifact_id.json"
                scripts/agent ci platform-bundle verify-component "${args[@]}" > "$verification" || continue
                if ! run_id="$(jq -er '.origin.run_id | tostring | select(test("^[0-9]+$"))' "$verification")"; then
                  continue
                fi
                if ! head_sha="$(jq -er '.origin.head_sha | strings | select(test("^[0-9a-f]{40}$"))' "$verification")"; then
                  continue
                fi
              fi
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              canonical="build/platform-reuse/$kind"
              if [ "$kind" = fpga ]; then
                scripts/agent ci platform-bundle compact-component \
                  --component fpga --artifact "$attempt" --component-id "$identity" --output "$canonical" >/dev/null
              else
                mkdir -p "$canonical"
                cp -R "$attempt"/. "$canonical"/
              fi
              printf '%s_hit=true\n%s_run_id=%s\n' "$kind" "$kind" "$run_id" >> "$GITHUB_OUTPUT"
              printf '%s_head_sha=%s\n' "$kind" "$head_sha" >> "$GITHUB_OUTPUT"
              [ "$kind" = candidate ] || printf '%s_id=%s\n' "$kind" "$identity" >> "$GITHUB_OUTPUT"
              return 0
            done < <(scripts/agent ci platform-candidates build/platform-reuse/artifacts.json "$name")
            echo "${kind}_hit=false" >> "$GITHUB_OUTPUT"
            return 1
          }
          resolve_equivalent() {
            local kind="$1" prefix="$2" inputs_manifest="$3" artifact_id run_id head_sha name identity attempt details verification canonical
            local -a component_inputs
            while IFS=$'\t' read -r artifact_id run_id head_sha name; do
              [[ "$artifact_id" =~ ^[0-9]+$ ]] || continue
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              [[ "$name" = "$prefix"* ]] || continue
              identity="${name#"$prefix"}"
              [[ "$identity" =~ ^[0-9a-f]{64}$ ]] || continue
              details="build/platform-reuse/run-$run_id.json"
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion,workflowName,headBranch,event,headSha > "$details" || continue
              scripts/agent ci platform-eligible-run "$details" "$head_sha" || continue
              attempt="build/platform-reuse/attempt-$kind-$artifact_id"
              mkdir -p "$attempt"
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$attempt" || continue
              verification="build/platform-reuse/verification-$kind-$artifact_id.json"
              scripts/agent ci platform-bundle verify-component \
                --component "$kind" --artifact "$attempt" --component-id "$identity" > "$verification" || continue
              if ! run_id="$(jq -er '.origin.run_id | tostring | select(test("^[0-9]+$"))' "$verification")"; then
                continue
              fi
              if ! head_sha="$(jq -er '.origin.head_sha | strings | select(test("^[0-9a-f]{40}$"))' "$verification")"; then
                continue
              fi
              git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
              mapfile -t component_inputs < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' -e '\#^\.github/workflows/platform-bundle.yml$#d' "$inputs_manifest")
              component_inputs+=("$inputs_manifest")
              git diff --quiet "$head_sha" "$GITHUB_SHA" -- "${component_inputs[@]}" || continue
              canonical="build/platform-reuse/$kind"
              if [ "$kind" = fpga ]; then
                scripts/agent ci platform-bundle compact-component \
                  --component fpga --artifact "$attempt" --component-id "$identity" --output "$canonical" >/dev/null
              else
                mkdir -p "$canonical"
                cp -R "$attempt"/. "$canonical"/
              fi
              printf '%s_hit=true\n%s_id=%s\n%s_run_id=%s\n%s_head_sha=%s\n' \
                "$kind" "$kind" "$identity" "$kind" "$run_id" "$kind" "$head_sha" >> "$GITHUB_OUTPUT"
              return 0
            done < <(jq -r --arg prefix "$prefix" '
              [.[]?.artifacts[]? |
                select((.name | startswith($prefix)) and (.expired == false) and
                  (.workflow_run.head_branch == "main") and
                  (.workflow_run.repository_id == .workflow_run.head_repository_id))] |
              sort_by(.created_at) | reverse[] |
              [.id, .workflow_run.id, .workflow_run.head_sha, .name] | @tsv
            ' build/platform-reuse/artifacts.json)
            echo "${kind}_hit=false" >> "$GITHUB_OUTPUT"
            return 1
          }
          candidate_name="platform-bundle-v0.$NEXT_VERSION-candidate"
          if resolve candidate "$candidate_name" "$BUNDLE_ID"; then
            echo 'main_hit=false' >> "$GITHUB_OUTPUT"
            echo 'fpga_hit=false' >> "$GITHUB_OUTPUT"
            echo 'kernel_hit=false' >> "$GITHUB_OUTPUT"
          else
            [ "$MAIN_CHANGED" = true ] && resolve main "platform-main-v0.1-$MAIN_ID" "$MAIN_ID" || [ "$MAIN_CHANGED" != true ] || true
            if [ "$FPGA_CHANGED" = true ] && ! resolve fpga "platform-fpga-v0.1-$FPGA_ID" "$FPGA_ID"; then
              resolve_equivalent fpga platform-fpga-v0.1- scripts/platform-component-inputs/fpga-v0.1.txt || true
            fi
            if [ "$KERNEL_CHANGED" = true ] && ! resolve kernel "platform-kernel-v0.1-$KERNEL_ID" "$KERNEL_ID"; then
              resolve_equivalent kernel platform-kernel-v0.1- scripts/platform-component-inputs/kernel-v0.1.txt || true
            fi
            [ "$MAIN_CHANGED" = true ] || echo 'main_hit=false' >> "$GITHUB_OUTPUT"
            [ "$FPGA_CHANGED" = true ] || echo 'fpga_hit=false' >> "$GITHUB_OUTPUT"
            [ "$KERNEL_CHANGED" = true ] || echo 'kernel_hit=false' >> "$GITHUB_OUTPUT"
          fi
          {
            echo
            echo "Reuse resolution: $((SECONDS-reuse_started))s"
            if [ -d build/platform-reuse/fpga ]; then
              echo "Compacted FPGA component: $(du -sb build/platform-reuse/fpga | cut -f1) bytes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Carry exact candidate into current run
        if: steps.reuse.outputs.candidate_hit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: platform-bundle-v0.${{ steps.plan.outputs.next_version }}-candidate
          path: build/platform-reuse/candidate
          if-no-files-found: error
          retention-days: 30

      - name: Carry exact Main component into current run
        if: steps.reuse.outputs.main_hit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: platform-main-v0.1-${{ steps.identity.outputs.main_id }}
          path: build/platform-reuse/main
          if-no-files-found: error
          retention-days: 30

      - name: Carry exact FPGA component into current run
        if: steps.reuse.outputs.fpga_hit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: platform-fpga-v0.1-${{ steps.reuse.outputs.fpga_id }}
          path: build/platform-reuse/fpga
          if-no-files-found: error
          retention-days: 30

      - name: Carry exact kernel component into current run
        if: steps.reuse.outputs.kernel_hit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: platform-kernel-v0.1-${{ steps.reuse.outputs.kernel_id }}
          path: build/platform-reuse/kernel
          if-no-files-found: error
          retention-days: 30

      - name: Report component decisions
        run: |
          status() {
            if [ '${{ steps.reuse.outputs.candidate_hit }}' = true ]; then echo 'reuse exact candidate'
            elif [ "$1" != true ]; then echo 'reuse latest release'
            elif [ "$2" = true ]; then echo 'reuse verified component artifact'
            else echo 'build required'
            fi
          }
          {
            echo "## Platform component plan"
            echo
            echo "| Component | Decision | Identity |"
            echo "|---|---|---|"
            echo "| Main | $(status '${{ steps.plan.outputs.main_changed }}' '${{ steps.reuse.outputs.main_hit }}') | \`${{ steps.identity.outputs.main_id }}\` |"
            echo "| FPGA | $(status '${{ steps.plan.outputs.fpga_changed }}' '${{ steps.reuse.outputs.fpga_hit }}') | \`${{ steps.reuse.outputs.fpga_id || steps.identity.outputs.fpga_id }}\` |"
            echo "| Kernel | $(status '${{ steps.plan.outputs.kernel_changed }}' '${{ steps.reuse.outputs.kernel_hit }}') | \`${{ steps.reuse.outputs.kernel_id || steps.identity.outputs.kernel_id }}\` |"
            if [ '${{ steps.reuse.outputs.candidate_hit }}' = true ]; then
              echo
              echo "Exact verified candidate recovered; component builds and assembly will be skipped."
            elif [ '${{ steps.plan.outputs.update_needed }}' = true ]; then
              echo
              echo "Candidate platform-v0.${{ steps.plan.outputs.next_version }} will be assembled."
            else
              echo
              echo "Platform-v0.${{ steps.plan.outputs.current_version }} is current; no builds, candidate, or publication are needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify latest platform release for assembly
        if: steps.plan.outputs.update_needed == 'true' && steps.reuse.outputs.candidate_hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.current.outputs.tag }}
          VERSION: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail
          started=$SECONDS
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir build/platform-current/release \
            --pattern 'mister-magik-platform-v0.*.zip'
          archive="$(find build/platform-current/release -name 'mister-magik-platform-v0.*.zip' -print -quit)"
          test -n "$archive"
          scripts/agent ci platform-bundle verify "$archive" \
            --manifest build/platform-current/release/platform-bundle-v0.2.json --release-version "$VERSION" >/dev/null
          printf 'baseline download and verification: %ss, %s bytes\n' \
            "$((SECONDS-started))" "$(stat -c %s "$archive")" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain verified baseline for assembly
        if: steps.plan.outputs.update_needed == 'true' && steps.reuse.outputs.candidate_hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: platform-latest-verified
          path: build/platform-current/release
          if-no-files-found: error
          retention-days: 1

  build-main:
    name: Build changed Main component
    needs: plan
    if: needs.plan.outputs.main-changed == 'true' && needs.plan.outputs.candidate-hit != 'true' && needs.plan.outputs.main-cache-hit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-agent-cli

      - uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/Main_MiSTer
          ref: ${{ needs.plan.outputs.main-revision }}
          path: Main_MiSTer
          fetch-depth: 0

      - name: Test exact Main fork
        working-directory: Main_MiSTer
        run: |
          scripts/test-magik-state.sh
          scripts/check-magik-patch-surface.sh
          python3 tests/test_main_component.py

      - name: Cache Main toolchain
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/mister-magik/${{ env.MAIN_TOOLCHAIN_VERSION }}
          key: main-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MAIN_TOOLCHAIN_VERSION }}

      - name: Install Main toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/mister-magik
          wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/${MAIN_TOOLCHAIN_VERSION}.tar.xz" \
            | tar -xJ -C ~/.cache/mister-magik

      - name: Build and attest Main
        env:
          MAIN_REVISION: ${{ needs.plan.outputs.main-revision }}
        run: |
          export PATH="$HOME/.cache/mister-magik/$MAIN_TOOLCHAIN_VERSION/bin:$PATH"
          make -C Main_MiSTer
          python3 Main_MiSTer/support/mister_magik/main_component.py create \
            --binary Main_MiSTer/bin/MiSTer --output build/main-component \
            --revision "$MAIN_REVISION" --toolchain "$MAIN_TOOLCHAIN_VERSION" >/dev/null
          python3 scripts/release/platform/main-component.py verify \
            --artifact build/main-component --revision "$MAIN_REVISION" >/dev/null
          scripts/agent ci platform-bundle write-component-cache \
            --component main --artifact build/main-component \
            --component-id '${{ needs.plan.outputs.main-id }}' \
            --run-id "$GITHUB_RUN_ID" --head-sha "$MAIN_REVISION"

      - uses: actions/upload-artifact@v7
        with:
          name: platform-main-v0.1-${{ needs.plan.outputs.main-id }}
          path: build/main-component
          if-no-files-found: error
          retention-days: 30

  build-kernel:
    name: Build changed kernel component
    needs: plan
    if: needs.plan.outputs.kernel-changed == 'true' && needs.plan.outputs.candidate-hit != 'true' && needs.plan.outputs.kernel-cache-hit != 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 20
    steps:
      - name: Install checkout and kernel tools
        run: >-
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
          git ca-certificates curl make gcc-arm-linux-gnueabihf flex bison bc libssl-dev pkg-config
          libelf-dev kmod sparse python3 ripgrep

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent-cli
        with:
          cache-scope: ubuntu-20.04

      - name: Trust checkout and fetch pinned kernel
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init build/Linux-Kernel_MiSTer
          git -C build/Linux-Kernel_MiSTer remote add origin https://github.com/MiSTer-devel/Linux-Kernel_MiSTer.git
          git -C build/Linux-Kernel_MiSTer fetch --depth=1 origin f0fb626acadd07f0718934826b143b6e4c9ce81c
          git -C build/Linux-Kernel_MiSTer checkout --detach FETCH_HEAD

      - name: Build and attest module
        run: |
          scripts/checks/check-scanout-slots-contract.sh
          python3 scripts/tests/test-scanout-platform-contract.py
          KERNEL_SRC="$PWD/build/Linux-Kernel_MiSTer" KERNEL_BUILD="$PWD/build/scanout-slots-kernel" \
            scripts/build-scanout-slots-module.sh
          {
            echo "component_input_sha256=${{ needs.plan.outputs.kernel-id }}"
            echo "component_revision=$(git log -1 --format=%H -- $(sed '/^#/d;/^$/d' scripts/platform-component-inputs/kernel-v0.1.txt))"
            echo "builder_revision=$GITHUB_SHA"
          } >> build/scanout-slots/provenance.txt
          (cd build/scanout-slots && sha256sum mister_magik_scanout_slots.ko modinfo.txt provenance.txt imports.txt > SHA256SUMS)
          scripts/agent ci platform-bundle write-component-cache \
            --component kernel --artifact build/scanout-slots \
            --component-id '${{ needs.plan.outputs.kernel-id }}' \
            --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA"

      - name: Release-grade kernel checks
        run: |
          make -C mister/platform/kernel/scanout-slots KERNEL_SRC="$PWD/build/Linux-Kernel_MiSTer" \
            KERNEL_BUILD="$PWD/build/scanout-slots-kernel" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- W=1 all
          make -C mister/platform/kernel/scanout-slots KERNEL_SRC="$PWD/build/Linux-Kernel_MiSTer" \
            KERNEL_BUILD="$PWD/build/scanout-slots-kernel" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- C=2 CHECK=sparse all
          "$PWD/build/Linux-Kernel_MiSTer/scripts/checkpatch.pl" --no-tree --strict --file --ignore SPDX_LICENSE_TAG \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_slots.c \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_slots_uapi.h \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_platform.h \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_policy.h
          grep -q '^vermagic:[[:space:]]*5\.15\.1-MiSTer ' build/scanout-slots/modinfo.txt

      - uses: actions/upload-artifact@v7
        with:
          name: platform-kernel-v0.1-${{ needs.plan.outputs.kernel-id }}
          path: build/scanout-slots
          if-no-files-found: error
          retention-days: 30

  build-fpga:
    name: Build changed FPGA component
    needs: plan
    if: needs.plan.outputs.fpga-changed == 'true' && needs.plan.outputs.candidate-hit != 'true' && needs.plan.outputs.fpga-cache-hit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      QUARTUS_ACCEPT_EULA: "1"
      QUARTUS_CACHE_DIR: ${{ github.workspace }}/build/quartus-lite-17.0
      QUARTUS_DOCKER_BASE_IMAGE: ubuntu:18.04
      QUARTUS_DOCKER_IMAGE: mister-magik-quartus-runtime:ubuntu18-amd64
      QUARTUS_DOCKER_CPUS: "4"
      QUARTUS_DOCKER_MEMORY: "0"
      QUARTUS_R2_ACCOUNT_ID: ${{ vars.QUARTUS_R2_ACCOUNT_ID }}
      QUARTUS_R2_BUCKET: ${{ vars.QUARTUS_R2_BUCKET || 'mister-magik-ci-cache' }}
    steps:
      - uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: false
          remove-android: false
          remove-haskell: false
          remove-codeql: false
          remove-docker-images: true
          build-mount-path: ${{ github.workspace }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent-cli

      - name: Resolve Menu and component metadata
        id: metadata
        run: |
          set -euo pipefail
          menu_ref="$(cat mister/platform/fpga/menu-vblank-latch/Menu_MiSTer.commit)"
          baseline_ref="$(cat mister/platform/fpga/menu-vblank-latch/video-diagnostics-baseline.commit)"
          [[ "$menu_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$baseline_ref" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$baseline_ref^{commit}"
          git merge-base --is-ancestor "$baseline_ref" "$GITHUB_SHA"
          component_revision="$(python3 scripts/release/platform/platform-component-id.py component fpga --revision-only)"
          synthesis_revision="$(python3 scripts/release/platform/platform-component-id.py component fpga-synthesis --revision-only)"
          build_date="$(git show -s --format=%cd --date=format:%y%m%d "$synthesis_revision")"
          printf 'menu_ref=%s\nbaseline_ref=%s\ncomponent_revision=%s\nsynthesis_revision=%s\nbuild_date=%s\n' \
            "$menu_ref" "$baseline_ref" "$component_revision" "$synthesis_revision" "$build_date" >> "$GITHUB_OUTPUT"

      - name: Restore completed FPGA synthesis
        id: fpga-synthesis-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/fpga-signoff
            !build/fpga-signoff/**/Menu-work/**
          key: platform-fpga-synthesis-v0.1-${{ needs.plan.outputs.fpga-synthesis-id }}

      - name: Verify restored FPGA synthesis identity
        if: steps.fpga-synthesis-cache.outputs.cache-hit == 'true'
        env:
          SYNTHESIS_ID: ${{ needs.plan.outputs.fpga-synthesis-id }}
        run: |
          set -euo pipefail
          for flavour in stock pre-observer patched; do
            root="build/fpga-signoff/$flavour"
            test -f "$root/menu-magik-vblank-latch.rbf"
            test -f "$root/menu-magik-vblank-latch.build.log"
            test -d "$root/reports"
            grep -Fx "synthesis_input_sha256=$SYNTHESIS_ID" \
              "$root/menu-magik-vblank-latch.metadata.txt"
          done
          echo "Reusing completed Quartus synthesis; all FPGA validation will run again." >> "$GITHUB_STEP_SUMMARY"

      - name: Bind runner temp to build volume
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.runner-temp"
          sudo mount --bind "$GITHUB_WORKSPACE/.runner-temp" "$RUNNER_TEMP"

      - name: Prepare Quartus Docker runtime
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo systemctl stop docker
          mkdir -p "$GITHUB_WORKSPACE/.docker-data"
          printf '{"data-root":"%s/.docker-data"}\n' "$GITHUB_WORKSPACE" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker pull "$QUARTUS_DOCKER_BASE_IMAGE"
          echo "QUARTUS_DOCKER_BASE_IMAGE_DIGEST=$(docker image inspect "$QUARTUS_DOCKER_BASE_IMAGE" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"

      - name: Restore private Quartus runtime
        id: quartus-cache
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.QUARTUS_R2_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QUARTUS_R2_READ_SECRET_ACCESS_KEY }}
        run: |
          set +e
          scripts/quartus-r2-cache.sh restore
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 10 ]; then
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Quartus cache restore failed with status $status; installing the pinned runtime without updating the cache"
            echo 'hit=degraded' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Quartus on cache miss
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true' && steps.quartus-cache.outputs.hit != 'true'
        env:
          QUARTUS_RUN_URL_SECRET: ${{ secrets.QUARTUS_17_0_RUN_URL }}
          CYCLONEV_QDZ_URL_SECRET: ${{ secrets.QUARTUS_17_0_CYCLONEV_QDZ_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$QUARTUS_CACHE_DIR"
          curl --fail --location --retry 5 --output "$QUARTUS_CACHE_DIR/QuartusLiteSetup-17.0.0.595-linux.run" \
            "${QUARTUS_RUN_URL_SECRET:-https://downloads.intel.com/akdlm/software/acdsinst/17.0std/595/ib_installers/QuartusLiteSetup-17.0.0.595-linux.run}"
          curl --fail --location --retry 5 --output "$QUARTUS_CACHE_DIR/cyclonev-17.0.0.595.qdz" \
            "${CYCLONEV_QDZ_URL_SECRET:-https://downloads.intel.com/akdlm/software/acdsinst/17.0std/595/ib_installers/cyclonev-17.0.0.595.qdz}"
          scripts/install-quartus-lite-docker.sh

      - name: Save private Quartus runtime
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true' && steps.quartus-cache.outputs.hit == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.QUARTUS_R2_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QUARTUS_R2_WRITE_SECRET_ACCESS_KEY }}
        run: scripts/quartus-r2-cache.sh save

      - uses: actions/checkout@v7
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true'
        with:
          repository: MiSTer-devel/Menu_MiSTer
          ref: ${{ steps.metadata.outputs.menu_ref }}
          path: build/Menu_MiSTer

      - name: Build matched stock, pre-observer, and final RBFs
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true'
        env:
          MISTER_MENU_DIR: ${{ github.workspace }}/build/Menu_MiSTer
          MISTER_FPGA_QUALIFIED_MAGIK_REVISION: ${{ github.sha }}
          MISTER_FPGA_SYNTHESIS_INPUT_SHA256: ${{ needs.plan.outputs.fpga-synthesis-id }}
          MISTER_FPGA_BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
          QUARTUS_DOCKER_EMPTY_SYS: "1"
          QUARTUS_STRACE: "0"
        run: |
          set -euo pipefail
          python3 scripts/prepare-fpga-menu-signoff.py "$GITHUB_WORKSPACE/build/Menu_MiSTer"
          fpga_seed_file="mister/platform/fpga/menu-vblank-latch/Quartus.seed"
          if (( $(wc -l < "$fpga_seed_file") != 1 )); then
            echo "canonical Quartus seed file must end with one newline" >&2
            exit 1
          fi
          fpga_seed="$(< "$fpga_seed_file")"
          if [[ ! "$fpga_seed" =~ ^[1-9][0-9]*$ ]]; then
            echo "canonical Quartus seed must be a positive integer" >&2
            exit 1
          fi
          MISTER_FPGA_APPLY_PATCH=0 MISTER_FPGA_QUARTUS_SEED="$fpga_seed" MISTER_FPGA_OUT_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/stock" \
            MISTER_MENU_BUILD_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/stock/Menu-work" scripts/build-fpga-vblank-latch-core.sh
          baseline_root="$GITHUB_WORKSPACE/build/video-diagnostics-baseline-source"
          git worktree add --detach "$baseline_root" '${{ steps.metadata.outputs.baseline_ref }}'
          QUARTUS_HOST_INSTALL_ROOT="$GITHUB_WORKSPACE/build/quartus-lite-17.0/docker-intelFPGA_lite" \
            MISTER_FPGA_APPLY_PATCH=1 MISTER_FPGA_QUARTUS_SEED="$fpga_seed" MISTER_FPGA_OUT_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/pre-observer" \
            MISTER_MENU_BUILD_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/pre-observer/Menu-work" \
            "$baseline_root/scripts/build-fpga-vblank-latch-core.sh"
          git worktree remove "$baseline_root"
          MISTER_FPGA_APPLY_PATCH=1 MISTER_FPGA_QUARTUS_SEED="$fpga_seed" MISTER_FPGA_OUT_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/patched" \
            MISTER_MENU_BUILD_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/patched/Menu-work" scripts/build-fpga-vblank-latch-core.sh

      - name: Preserve completed FPGA synthesis
        if: steps.fpga-synthesis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/fpga-signoff
            !build/fpga-signoff/**/Menu-work/**
          key: platform-fpga-synthesis-v0.1-${{ needs.plan.outputs.fpga-synthesis-id }}

      - name: Verify Quartus delta
        id: quartus_delta
        env:
          COMPONENT_ID: ${{ needs.plan.outputs.fpga-id }}
          COMPONENT_REVISION: ${{ steps.metadata.outputs.component_revision }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' report; do args+=(--stock "$report"); done < <(find build/fpga-signoff/stock -maxdepth 1 -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0)
          while IFS= read -r -d '' report; do args+=(--stock "$report"); done < <(find build/fpga-signoff/stock/reports -maxdepth 1 -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0)
          while IFS= read -r -d '' report; do args+=(--baseline "$report"); done < <(find build/fpga-signoff/pre-observer -maxdepth 1 -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0)
          while IFS= read -r -d '' report; do args+=(--baseline "$report"); done < <(find build/fpga-signoff/pre-observer/reports -maxdepth 1 -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0)
          while IFS= read -r -d '' report; do args+=(--patched "$report"); done < <(find build/fpga-signoff/patched -maxdepth 1 -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0)
          while IFS= read -r -d '' report; do args+=(--patched "$report"); done < <(find build/fpga-signoff/patched/reports -maxdepth 1 -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0)
          scripts/checks/check-fpga-quartus-delta.py "${args[@]}" | tee build/fpga-signoff/quartus-delta-signoff.tsv
          cp build/fpga-signoff/quartus-delta-signoff.tsv build/fpga-signoff/patched/reports/quartus-delta-signoff.tsv
          delta_sha="$(shasum -a 256 build/fpga-signoff/patched/reports/quartus-delta-signoff.tsv | awk '{print $1}')"
          for flavour in stock pre-observer patched; do
            metadata="build/fpga-signoff/$flavour/menu-magik-vblank-latch.metadata.txt"
            if [ "$(grep -c '^source_status=' "$metadata")" != 2 ] || \
               ! grep -Fxq 'source_status= M menu.qsf' "$metadata" || \
               ! grep -Fxq 'source_status= M sys/sys_top.sdc' "$metadata"; then
              echo "unexpected Menu source modification in $flavour metadata" >&2
              exit 1
            fi
            printf 'analysis_constraint_override=clock_groups_exclusive_to_asynchronous\nquartus_processors=4\nparallel_synthesis=off\nauto_parallel_synthesis=off\ncomponent_input_sha256=%s\ncomponent_revision=%s\n' \
              "$COMPONENT_ID" "$COMPONENT_REVISION" >> "$metadata"
          done
          printf 'report_sha256.reports/quartus-delta-signoff.tsv=%s\nsignoff_valid=1\n' \
            "$delta_sha" >> build/fpga-signoff/patched/menu-magik-vblank-latch.metadata.txt
          scripts/checks/verify-fpga-rbf-manifest.py \
            build/fpga-signoff/patched/menu-magik-vblank-latch.metadata.txt
          scripts/agent ci platform-bundle write-component-cache \
            --component fpga --artifact build/fpga-signoff \
            --component-id '${{ needs.plan.outputs.fpga-id }}' \
            --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA"

      - name: Compact and verify FPGA component
        run: |
          set -euo pipefail
          started=$SECONDS
          scripts/agent ci platform-bundle compact-component \
            --component fpga --artifact build/fpga-signoff \
            --component-id '${{ needs.plan.outputs.fpga-id }}' \
            --output build/fpga-component >/dev/null
          printf 'FPGA compaction: %ss, %s bytes\n' "$((SECONDS-started))" \
            "$(du -sb build/fpga-component | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: platform-fpga-v0.1-${{ needs.plan.outputs.fpga-id }}
          path: build/fpga-component
          if-no-files-found: error
          retention-days: 30

      - name: Mark unqualified experimental FPGA output
        if: failure() && steps.quartus_delta.outcome == 'failure' && inputs.retain_experimental_fpga == true && inputs.publish != true
        run: |
          cat > build/fpga-signoff/patched/EXPERIMENTAL-UNQUALIFIED.txt <<EOF
          This RBF failed production FPGA signoff and is retained only for attended diagnosis.
          It must not be published, released, or installed as a production platform component.
          source_sha=$GITHUB_SHA
          workflow_run_id=$GITHUB_RUN_ID
          EOF

      - name: Retain unqualified experimental diagnostic RBF
        if: failure() && steps.quartus_delta.outcome == 'failure' && inputs.retain_experimental_fpga == true && inputs.publish != true
        uses: actions/upload-artifact@v7
        with:
          name: experimental-fpga-unqualified-${{ github.run_id }}
          path: |
            build/fpga-signoff/patched/menu-magik-vblank-latch.rbf
            build/fpga-signoff/patched/menu-magik-vblank-latch.metadata.txt
            build/fpga-signoff/patched/EXPERIMENTAL-UNQUALIFIED.txt
            build/fpga-signoff/quartus-delta-signoff.tsv
            build/fpga-signoff/patched/reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Retain failed FPGA diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-fpga-diagnostics-${{ github.run_id }}
          path: |
            build/fpga-signoff/**/*.log
            build/fpga-signoff/**/*.rpt
            build/fpga-signoff/**/*.summary
            build/fpga-signoff/**/*.txt
            build/fpga-signoff/**/*.tsv
            !build/fpga-signoff/**/Menu-work/**
          if-no-files-found: warn
          retention-days: 7

  assemble:
    name: Assemble verified platform candidate
    needs: [plan, build-main, build-fpga, build-kernel]
    if: >-
      always() && needs.plan.outputs.update-needed == 'true' &&
      needs.plan.outputs.candidate-hit != 'true' &&
      (needs.build-main.result == 'success' || needs.build-main.result == 'skipped') &&
      (needs.build-fpga.result == 'success' || needs.build-fpga.result == 'skipped') &&
      (needs.build-kernel.result == 'success' || needs.build-kernel.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      next-version: ${{ needs.plan.outputs.next-version }}
      release-tag: ${{ needs.plan.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-agent-cli

      - uses: actions/download-artifact@v8
        with:
          name: platform-latest-verified
          path: build/platform-current

      - if: needs.plan.outputs.main-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: platform-main-v0.1-${{ needs.plan.outputs.main-id }}
          path: build/platform-input/main

      - if: needs.plan.outputs.fpga-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: platform-fpga-v0.1-${{ needs.plan.outputs.fpga-id }}
          path: build/platform-input/fpga

      - if: needs.plan.outputs.kernel-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: platform-kernel-v0.1-${{ needs.plan.outputs.kernel-id }}
          path: build/platform-input/scanout

      - name: Reuse unchanged components from latest release
        env:
          MAIN_CHANGED: ${{ needs.plan.outputs.main-changed }}
          FPGA_CHANGED: ${{ needs.plan.outputs.fpga-changed }}
          KERNEL_CHANGED: ${{ needs.plan.outputs.kernel-changed }}
          MAIN_ID: ${{ needs.plan.outputs.main-id }}
          FPGA_ID: ${{ needs.plan.outputs.fpga-id }}
          KERNEL_ID: ${{ needs.plan.outputs.kernel-id }}
        run: |
          set -euo pipefail
          archive="$(find build/platform-current -name 'mister-magik-platform-v0.*.zip' -print -quit)"
          manifest="build/platform-current/platform-bundle-v0.2.json"
          test -n "$archive" && test -f "$manifest"
          [ "$MAIN_CHANGED" = true ] || scripts/agent ci platform-bundle extract-component "$archive" --manifest "$manifest" --component main --component-id "$MAIN_ID" --output build/platform-input/main
          [ "$FPGA_CHANGED" = true ] || scripts/agent ci platform-bundle extract-component "$archive" --manifest "$manifest" --component fpga --component-id "$FPGA_ID" --output build/platform-input/fpga
          [ "$KERNEL_CHANGED" = true ] || scripts/agent ci platform-bundle extract-component "$archive" --manifest "$manifest" --component kernel --component-id "$KERNEL_ID" --output build/platform-input/scanout

      - name: Assemble and verify candidate
        env:
          CURRENT_MANIFEST: build/platform-current/platform-bundle-v0.2.json
          MAIN_CHANGED: ${{ needs.plan.outputs.main-changed }}
          FPGA_CHANGED: ${{ needs.plan.outputs.fpga-changed }}
          KERNEL_CHANGED: ${{ needs.plan.outputs.kernel-changed }}
          MAIN_ID: ${{ needs.plan.outputs.main-id }}
          FPGA_ID: ${{ needs.plan.outputs.fpga-id }}
          KERNEL_ID: ${{ needs.plan.outputs.kernel-id }}
          MAIN_REVISION: ${{ needs.plan.outputs.main-revision }}
          NEXT_VERSION: ${{ needs.plan.outputs.next-version }}
          MAIN_CACHE_HIT: ${{ needs.plan.outputs.main-cache-hit }}
          FPGA_CACHE_HIT: ${{ needs.plan.outputs.fpga-cache-hit }}
          KERNEL_CACHE_HIT: ${{ needs.plan.outputs.kernel-cache-hit }}
          MAIN_CACHE_RUN_ID: ${{ needs.plan.outputs.main-cache-run-id }}
          FPGA_CACHE_RUN_ID: ${{ needs.plan.outputs.fpga-cache-run-id }}
          KERNEL_CACHE_RUN_ID: ${{ needs.plan.outputs.kernel-cache-run-id }}
          MAIN_CACHE_HEAD_SHA: ${{ needs.plan.outputs.main-cache-head-sha }}
          FPGA_CACHE_HEAD_SHA: ${{ needs.plan.outputs.fpga-cache-head-sha }}
          KERNEL_CACHE_HEAD_SHA: ${{ needs.plan.outputs.kernel-cache-head-sha }}
        run: |
          set -euo pipefail
          started=$SECONDS
          origin() { if [ "$1" = true ]; then printf '%s' "$2"; else jq -r ".components.$3.$4" "$CURRENT_MANIFEST"; fi; }
          cached() { if [ "$2" = true ]; then printf '%s' "$3"; else origin "$1" "$4" "$5" "$6"; fi; }
          main_run="$(cached "$MAIN_CHANGED" "$MAIN_CACHE_HIT" "$MAIN_CACHE_RUN_ID" "$GITHUB_RUN_ID" main run_id)"
          fpga_run="$(cached "$FPGA_CHANGED" "$FPGA_CACHE_HIT" "$FPGA_CACHE_RUN_ID" "$GITHUB_RUN_ID" fpga run_id)"
          kernel_run="$(cached "$KERNEL_CHANGED" "$KERNEL_CACHE_HIT" "$KERNEL_CACHE_RUN_ID" "$GITHUB_RUN_ID" kernel run_id)"
          main_sha="$(cached "$MAIN_CHANGED" "$MAIN_CACHE_HIT" "$MAIN_CACHE_HEAD_SHA" "$MAIN_REVISION" main head_sha)"
          fpga_sha="$(cached "$FPGA_CHANGED" "$FPGA_CACHE_HIT" "$FPGA_CACHE_HEAD_SHA" "$GITHUB_SHA" fpga head_sha)"
          kernel_sha="$(cached "$KERNEL_CHANGED" "$KERNEL_CACHE_HIT" "$KERNEL_CACHE_HEAD_SHA" "$GITHUB_SHA" kernel head_sha)"
          source() { if [ "$1" != true ]; then echo reused-from-latest-release; elif [ "$2" = true ]; then echo reused-from-actions-cache; else echo built-in-current-run; fi; }
          scripts/agent ci platform-bundle create \
            --main-dir build/platform-input/main --fpga-dir build/platform-input/fpga --scanout-dir build/platform-input/scanout \
            --main-id "$MAIN_ID" --fpga-id "$FPGA_ID" --kernel-id "$KERNEL_ID" \
            --main-run-id "$main_run" --fpga-run-id "$fpga_run" --kernel-run-id "$kernel_run" \
            --main-head-sha "$main_sha" --fpga-head-sha "$fpga_sha" --kernel-head-sha "$kernel_sha" \
            --main-source "$(source "$MAIN_CHANGED" "$MAIN_CACHE_HIT")" --fpga-source "$(source "$FPGA_CHANGED" "$FPGA_CACHE_HIT")" --kernel-source "$(source "$KERNEL_CHANGED" "$KERNEL_CACHE_HIT")" \
            --release-version "$NEXT_VERSION" --output build/platform-bundle
          created=$SECONDS
          scripts/agent ci platform-bundle verify \
            "build/platform-bundle/mister-magik-platform-v0.$NEXT_VERSION.zip" \
            --manifest build/platform-bundle/platform-bundle-v0.2.json --release-version "$NEXT_VERSION" >/dev/null
          archive="build/platform-bundle/mister-magik-platform-v0.$NEXT_VERSION.zip"
          printf 'candidate creation: %ss; verification: %ss; archive: %s bytes\n' \
            "$((created-started))" "$((SECONDS-created))" "$(stat -c %s "$archive")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: platform-bundle-v0.${{ needs.plan.outputs.next-version }}-candidate
          path: build/platform-bundle
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable platform bundle
    needs: [plan, assemble]
    if: >-
      always() && needs.plan.outputs.update-needed == 'true' && inputs.publish == true &&
      (needs.assemble.result == 'success' || needs.plan.outputs.candidate-hit == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: publish-platform
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-agent-cli

      - uses: actions/download-artifact@v8
        with:
          name: platform-bundle-v0.${{ needs.plan.outputs.next-version }}-candidate
          path: candidate

      - name: Publish or verify immutable platform bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release-tag }}
          VERSION: ${{ needs.plan.outputs.next-version }}
        run: |
          set -euo pipefail
          archive="candidate/mister-magik-platform-v0.$VERSION.zip"
          manifest="candidate/platform-bundle-v0.2.json"
          scripts/agent ci platform-bundle verify "$archive" --manifest "$manifest" --release-version "$VERSION" >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; numbered platform releases are immutable." >&2
            exit 1
          fi
          gh release create "$TAG" "$archive" "$manifest" candidate/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MiSTer MagiK Platform Bundle v0.$VERSION" \
            --draft --prerelease
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
