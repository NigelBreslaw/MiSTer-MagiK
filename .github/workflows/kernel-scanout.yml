name: Kernel scanout slots

on:
  pull_request:
    paths:
      - "mister/platform/kernel/scanout-slots/**"
      - "scripts/build-scanout-slots-module.sh"
      - "scripts/checks/check-scanout-slots-contract.sh"
      - "scripts/tests/test-scanout-platform-contract.py"
      - "scripts/platform-component-inputs/kernel-v0.1.txt"
      - "scripts/release/platform/platform-component-id.py"
      - ".github/workflows/kernel-scanout.yml"
  push:
    branches: [main]
    paths:
      - "mister/platform/kernel/scanout-slots/**"
      - "scripts/build-scanout-slots-module.sh"
      - "scripts/checks/check-scanout-slots-contract.sh"
      - "scripts/tests/test-scanout-platform-contract.py"
      - "scripts/platform-component-inputs/kernel-v0.1.txt"
      - "scripts/release/platform/platform-component-id.py"
      - ".github/workflows/kernel-scanout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 15
    steps:
      - name: Bootstrap Git for provenance-preserving checkout
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Refuse non-main manual artifact production
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Kernel artifact production is restricted to main; got $GITHUB_REF" >&2
          exit 1

      - name: Trust the container-mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install kernel module tools
        run: >-
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
          make gcc-arm-linux-gnueabihf flex bison bc libssl-dev libelf-dev kmod
          sparse python3

      - name: Fetch pinned MiSTer kernel with provenance
        run: |
          set -eu
          git init build/Linux-Kernel_MiSTer
          git -C build/Linux-Kernel_MiSTer remote add origin https://github.com/MiSTer-devel/Linux-Kernel_MiSTer.git
          git -C build/Linux-Kernel_MiSTer fetch --depth=1 origin f0fb626acadd07f0718934826b143b6e4c9ce81c
          git -C build/Linux-Kernel_MiSTer checkout --detach FETCH_HEAD

      - name: Check one-job contract
        run: |
          scripts/checks/check-scanout-slots-contract.sh
          python3 scripts/tests/test-scanout-platform-contract.py

      - name: Build and attest module
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_DIRTY: "0"
        run: >-
          KERNEL_SRC="$PWD/build/Linux-Kernel_MiSTer"
          KERNEL_BUILD="$PWD/build/scanout-slots-kernel"
          scripts/build-scanout-slots-module.sh

      - name: Compute main platform component identity
        id: component-id
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/platform/platform-component-id.py component kernel --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Attest main platform component identity
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "component_input_sha256=${{ steps.component-id.outputs.kernel_input_sha256 }}"
            echo "component_revision=${{ steps.component-id.outputs.kernel_component_revision }}"
            echo "builder_revision=$GITHUB_SHA"
          } >> build/scanout-slots/provenance.txt
          (cd build/scanout-slots && sha256sum mister_magik_scanout_slots.ko modinfo.txt provenance.txt imports.txt > SHA256SUMS)

      - name: Warning-clean rebuild
        run: >-
          make -C mister/platform/kernel/scanout-slots
          KERNEL_SRC="$PWD/build/Linux-Kernel_MiSTer"
          KERNEL_BUILD="$PWD/build/scanout-slots-kernel"
          ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- W=1 all

      - name: Sparse type check
        run: >-
          make -C mister/platform/kernel/scanout-slots
          KERNEL_SRC="$PWD/build/Linux-Kernel_MiSTer"
          KERNEL_BUILD="$PWD/build/scanout-slots-kernel"
          ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          C=2 CHECK=sparse all

      - name: Kernel style checks
        run: |
          set -eu
          # The pinned Linux tree predates SPDX GPL-3.0-or-later. The project
          # license check enforces the current identifier; checkpatch still
          # verifies every other kernel style rule here.
          "$PWD/build/Linux-Kernel_MiSTer/scripts/checkpatch.pl" --no-tree --strict --file \
            --ignore SPDX_LICENSE_TAG \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_slots.c \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_slots_uapi.h \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_platform.h \
            mister/platform/kernel/scanout-slots/mister_magik_scanout_policy.h

      - name: Audit module imports and metadata
        run: |
          set -eu
          scripts/checks/check-scanout-slots-contract.sh
          grep -q '^vermagic:[[:space:]]*5\.15\.1-MiSTer ' build/scanout-slots/modinfo.txt
          grep -q '^kernel_revision=f0fb626acadd07f0718934826b143b6e4c9ce81c$' build/scanout-slots/provenance.txt
          grep -q '^source_dirty=0$' build/scanout-slots/provenance.txt
          test "$(sed -n 's/^source_revision=//p' build/scanout-slots/provenance.txt)" = \
            "$(sed -n 's/^observed_source_revision=//p' build/scanout-slots/provenance.txt)"
          grep -q '^observed_source_dirty=0$' build/scanout-slots/provenance.txt
          grep -q '^platform_contract_sha256=[0-9a-f]\{64\}$' build/scanout-slots/provenance.txt
          grep -q '^license:[[:space:]]*Proprietary$' build/scanout-slots/modinfo.txt
          grep -q '^mister_magik_source_license:[[:space:]]*GPL-3.0-or-later$' build/scanout-slots/modinfo.txt

      - name: Upload attested module
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: mister-magik-scanout-slots-v0.1-${{ steps.component-id.outputs.kernel_input_sha256 }}
          path: |
            build/scanout-slots/mister_magik_scanout_slots.ko
            build/scanout-slots/modinfo.txt
            build/scanout-slots/provenance.txt
            build/scanout-slots/SHA256SUMS
            build/scanout-slots/imports.txt
          if-no-files-found: error

  clang-build:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check out pinned MiSTer kernel
        uses: actions/checkout@v7
        with:
          repository: MiSTer-devel/Linux-Kernel_MiSTer
          ref: f0fb626acadd07f0718934826b143b6e4c9ce81c
          path: build/Linux-Kernel_MiSTer

      - name: Install Clang kernel tools
        run: >-
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
          make clang llvm lld flex bison bc libssl-dev libelf-dev

      - name: Prepare pinned kernel with Clang
        run: |
          set -eu
          make -C build/Linux-Kernel_MiSTer O="$GITHUB_WORKSPACE/build/scanout-slots-clang" \
            ARCH=arm LLVM=1 LOCALVERSION=-MiSTer MiSTer_defconfig
          make -C build/Linux-Kernel_MiSTer O="$GITHUB_WORKSPACE/build/scanout-slots-clang" \
            ARCH=arm LLVM=1 LOCALVERSION=-MiSTer modules_prepare

      - name: Build module with Clang warnings denied
        run: >-
          make -C mister/platform/kernel/scanout-slots
          KERNEL_SRC="$GITHUB_WORKSPACE/build/Linux-Kernel_MiSTer"
          KERNEL_BUILD="$GITHUB_WORKSPACE/build/scanout-slots-clang"
          ARCH=arm LLVM=1 WERROR=1 W=1 all

  coccinelle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check out pinned MiSTer kernel
        uses: actions/checkout@v7
        with:
          repository: MiSTer-devel/Linux-Kernel_MiSTer
          ref: f0fb626acadd07f0718934826b143b6e4c9ce81c
          path: build/Linux-Kernel_MiSTer

      - name: Install semantic checker
        run: sudo apt-get update && sudo apt-get install -y coccinelle

      - name: Run Coccinelle reports
        run: >-
          make -C build/Linux-Kernel_MiSTer
          M="$GITHUB_WORKSPACE/mister/platform/kernel/scanout-slots"
          coccicheck MODE=report
