name: FPGA latch fast gates

on:
  pull_request:
    paths:
      - "mister/platform/fpga/menu-vblank-latch/**"
      - "scripts/*fpga*latch*"
      - "scripts/build-fpga-vblank-latch-core.sh"
      - ".github/workflows/fpga-latch-fast.yml"
  push:
    paths:
      - "mister/platform/fpga/menu-vblank-latch/**"
      - "scripts/*fpga*latch*"
      - "scripts/build-fpga-vblank-latch-core.sh"
      - ".github/workflows/fpga-latch-fast.yml"

permissions:
  contents: read

jobs:
  latch-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read qualified Menu source revision
        id: menu-source
        run: |
          set -euo pipefail
          mapfile -t menu_refs < mister/platform/fpga/menu-vblank-latch/Menu_MiSTer.commit
          if [[ ${#menu_refs[@]} -ne 1 ]]; then
            echo "qualified Menu source revision must be exactly one line" >&2
            exit 2
          fi
          menu_ref="${menu_refs[0]}"
          if [[ ! "$menu_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid qualified Menu source revision: $menu_ref" >&2
            exit 2
          fi
          printf 'commit=%s\n' "$menu_ref" >> "$GITHUB_OUTPUT"
      - name: Install FPGA fast-gate tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator lcov
      - name: Check out pinned Menu source
        uses: actions/checkout@v7
        with:
          repository: MiSTer-devel/Menu_MiSTer
          ref: ${{ steps.menu-source.outputs.commit }}
          path: build/Menu_MiSTer
      - name: Run warning-clean Icarus simulation
        run: scripts/tests/test-fpga-vblank-latch.sh
      - name: Lint custom RTL
        run: >-
          verilator --lint-only --Wall --Wno-fatal
          -Imister/platform/fpga/menu-vblank-latch
          mister/platform/fpga/menu-vblank-latch/mister_magik_vblank_latch.sv
      - name: Verify pinned patch integration and opcode ownership
        run: scripts/checks/check-fpga-latch-integration.py build/Menu_MiSTer
      - name: Measure reachable custom RTL coverage
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          verilator --cc --exe --build --timing --coverage-line \
            --top-module tb_mister_magik_vblank_latch \
            --Mdir "$build_dir/obj" \
            -Imister/platform/fpga/menu-vblank-latch \
            mister/platform/fpga/menu-vblank-latch/mister_magik_vblank_latch.sv \
            mister/platform/fpga/menu-vblank-latch/tb_mister_magik_vblank_latch.sv \
            "$GITHUB_WORKSPACE/mister/platform/fpga/menu-vblank-latch/verilator_coverage_main.cpp"
          (cd "$build_dir" && "$build_dir/obj/Vtb_mister_magik_vblank_latch")
          verilator_coverage --annotate-min 1 --annotate-all --annotate "$build_dir/annotated" "$build_dir/coverage.dat"
          scripts/checks/check-fpga-latch-coverage.py "$build_dir/annotated"
