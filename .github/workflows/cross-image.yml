name: Cross image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mister-magik-cross-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse non-main publication
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Cross images must be dispatched from the main branch; got $GITHUB_REF" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Read canonical cross image
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Verify content-versioned image tag
        env:
          IMAGE: ${{ steps.cache-id.outputs.cross_image }}
        run: |
          set -euo pipefail
          dockerfile_hash="$(sha256sum magik-gui/Dockerfile.cross-armv7 | awk '{print substr($1, 1, 12)}')"
          expected_image="ghcr.io/nigelbreslaw/mister-magik-cross-armv7:ubuntu20-$dockerfile_hash"
          if [ "$IMAGE" != "$expected_image" ]; then
            echo "Cross.toml image must be $expected_image; got $IMAGE" >&2
            exit 1
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Refuse an existing image tag
        env:
          IMAGE: ${{ steps.cache-id.outputs.cross_image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image tag $IMAGE already exists; content-versioned images are immutable." >&2
            exit 1
          fi

      - name: Build and publish image
        env:
          IMAGE: ${{ steps.cache-id.outputs.cross_image }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          build_started="$(date +%s)"
          docker build --platform linux/amd64 --tag "$IMAGE" --file magik-gui/Dockerfile.cross-armv7 magik-gui
          build_finished="$(date +%s)"
          push_started="$(date +%s)"
          docker push "$IMAGE"
          push_finished="$(date +%s)"
          {
            printf 'image=%s\n' "$IMAGE"
            printf 'build_seconds=%s\n' "$((build_finished - build_started))"
            printf 'push_seconds=%s\n' "$((push_finished - push_started))"
            printf 'uncompressed_bytes=%s\n' "$(docker image inspect "$IMAGE" --format '{{.Size}}')"
            docker image inspect "$IMAGE" --format 'repo_digest={{index .RepoDigests 0}}'
          } | tee build/ci/cross-image-publish.txt

      - name: Upload publish measurements
        uses: actions/upload-artifact@v7
        with:
          name: cross-image-publish
          path: build/ci/cross-image-publish.txt
          if-no-files-found: error
          retention-days: 14
