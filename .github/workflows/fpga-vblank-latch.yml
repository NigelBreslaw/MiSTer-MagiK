name: FPGA Vblank Latch RBF

on:
  pull_request:
    paths:
      - ".github/workflows/fpga-vblank-latch.yml"
      - "experiments/fpga-vblank-latch/**"
      - "scripts/build-fpga-vblank-latch-core.sh"
      - "scripts/install-quartus-lite-docker.sh"
  workflow_dispatch:
    inputs:
      menu_ref:
        description: "MiSTer-devel/Menu_MiSTer ref to build"
        required: true
        default: "master"
      quartus_run_url:
        description: "Optional URL for QuartusLiteSetup-17.0.0.595-linux.run; falls back to secret QUARTUS_17_0_RUN_URL"
        required: false
        default: ""
      cyclonev_qdz_url:
        description: "Optional URL for cyclonev-17.0.0.595.qdz; falls back to secret QUARTUS_17_0_CYCLONEV_QDZ_URL"
        required: false
        default: ""
      apply_magik_patch:
        description: "Apply the experimental MagiK vblank-latch patch before building"
        required: true
        default: "true"

permissions:
  contents: read

env:
  QUARTUS_ACCEPT_EULA: "1"
  QUARTUS_CACHE_DIR: ${{ github.workspace }}/build/quartus-lite-17.0
  QUARTUS_DOCKER_BASE_IMAGE: ubuntu:18.04
  QUARTUS_DOCKER_IMAGE: mister-magik-quartus-runtime:ubuntu18-amd64
  QUARTUS_DOCKER_CPUS: "4"
  QUARTUS_DOCKER_MEMORY: "0"
  QUARTUS_DOCKER_PRIVILEGED: "1"

jobs:
  build-rbf:
    name: Build vblank-latched Menu RBF
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Maximize runner build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: false
          remove-android: false
          remove-haskell: false
          remove-codeql: false
          remove-docker-images: false

      - name: Checkout MagiK repo
        uses: actions/checkout@v7

      - name: Checkout Menu_MiSTer
        uses: actions/checkout@v7
        with:
          repository: MiSTer-devel/Menu_MiSTer
          ref: ${{ github.event.inputs.menu_ref || 'master' }}
          path: build/Menu_MiSTer

      - name: Report initial disk state
        run: |
          set -euo pipefail
          df -h /
          df -h "$GITHUB_WORKSPACE"
          docker system df || true

      - name: Download Quartus 17.0 installer payloads
        env:
          QUARTUS_RUN_URL_INPUT: ${{ github.event.inputs.quartus_run_url }}
          CYCLONEV_QDZ_URL_INPUT: ${{ github.event.inputs.cyclonev_qdz_url }}
          QUARTUS_RUN_URL_SECRET: ${{ secrets.QUARTUS_17_0_RUN_URL }}
          CYCLONEV_QDZ_URL_SECRET: ${{ secrets.QUARTUS_17_0_CYCLONEV_QDZ_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$QUARTUS_CACHE_DIR"

          quartus_url="${QUARTUS_RUN_URL_INPUT:-$QUARTUS_RUN_URL_SECRET}"
          cyclonev_url="${CYCLONEV_QDZ_URL_INPUT:-$CYCLONEV_QDZ_URL_SECRET}"
          if [ -z "$quartus_url" ] || [ -z "$cyclonev_url" ]; then
            echo "Set workflow inputs quartus_run_url/cyclonev_qdz_url or repo secrets QUARTUS_17_0_RUN_URL/QUARTUS_17_0_CYCLONEV_QDZ_URL." >&2
            exit 2
          fi

          curl --fail --location --retry 5 --retry-delay 10 --output "$QUARTUS_CACHE_DIR/QuartusLiteSetup-17.0.0.595-linux.run" "$quartus_url"
          curl --fail --location --retry 5 --retry-delay 10 --output "$QUARTUS_CACHE_DIR/cyclonev-17.0.0.595.qdz" "$cyclonev_url"

          shasum -a 1 "$QUARTUS_CACHE_DIR/QuartusLiteSetup-17.0.0.595-linux.run"
          shasum -a 1 "$QUARTUS_CACHE_DIR/cyclonev-17.0.0.595.qdz"

      - name: Install Quartus Docker runtime
        run: scripts/install-quartus-lite-docker.sh

      - name: Report post-install disk state
        if: always()
        run: |
          set -euo pipefail
          df -h /
          df -h "$GITHUB_WORKSPACE"
          du -sh build/quartus-lite-17.0 || true
          docker system df || true

      - name: Build vblank-latched RBF
        env:
          MISTER_MENU_DIR: ${{ github.workspace }}/build/Menu_MiSTer
          MISTER_FPGA_APPLY_PATCH: ${{ github.event.inputs.apply_magik_patch || 'true' }}
        run: scripts/build-fpga-vblank-latch-core.sh

      - name: Upload FPGA build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpga-vblank-latch-build
          path: |
            build/fpga-vblank-latch/menu-magik-vblank-latch.rbf
            build/fpga-vblank-latch/menu-magik-vblank-latch.metadata.txt
            build/fpga-vblank-latch/menu-magik-vblank-latch.build.log
          if-no-files-found: warn
