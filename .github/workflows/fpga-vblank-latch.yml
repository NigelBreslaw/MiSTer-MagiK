name: FPGA Vblank Latch RBF

# This workflow is intentionally manual-only. Quartus/RBF builds are heavyweight
# and should be started with workflow_dispatch when a new core artifact is
# actually needed.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QUARTUS_ACCEPT_EULA: "1"
  QUARTUS_CACHE_DIR: ${{ github.workspace }}/build/quartus-lite-17.0
  QUARTUS_DOCKER_BASE_IMAGE: ubuntu:18.04
  QUARTUS_DOCKER_IMAGE: mister-magik-quartus-runtime:ubuntu18-amd64
  QUARTUS_DOCKER_CPUS: "4"
  QUARTUS_DOCKER_MEMORY: "0"

jobs:
  prepare-quartus:
    name: Prepare cached Quartus runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Refuse non-main dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "FPGA artifact production is restricted to main; got $GITHUB_REF" >&2
          exit 1

      - name: Maximize runner build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: false
          remove-android: false
          remove-haskell: false
          remove-codeql: false
          remove-docker-images: true
          build-mount-path: ${{ github.workspace }}

      - name: Checkout MagiK repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute platform component identity
        id: component-id
        run: python3 scripts/platform-component-id.py component fpga --github-output "$GITHUB_OUTPUT"

      - name: Bind runner temp to build volume
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.runner-temp"
          sudo mount --bind "$GITHUB_WORKSPACE/.runner-temp" "$RUNNER_TEMP"
          df -h "$RUNNER_TEMP"

      - name: Move Docker data root to build volume
        run: |
          set -euo pipefail
          sudo systemctl stop docker
          mkdir -p "$GITHUB_WORKSPACE/.docker-data"
          printf '{"data-root":"%s/.docker-data"}\n' "$GITHUB_WORKSPACE" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'DockerRootDir={{.DockerRootDir}}'

      - name: Restore installed Quartus cache
        id: quartus-install-cache
        uses: actions/cache/restore@v4
        with:
          path: build/quartus-lite-17.0/docker-intelFPGA_lite
          key: quartus-lite-17.0.0.595-cyclonev-${{ runner.os }}-${{ env.QUARTUS_DOCKER_BASE_IMAGE }}-${{ hashFiles('scripts/install-quartus-lite-docker.sh', '.github/workflows/fpga-vblank-latch.yml') }}
          restore-keys: |
            quartus-lite-17.0.0.595-cyclonev-${{ runner.os }}-${{ env.QUARTUS_DOCKER_BASE_IMAGE }}-

      - name: Download Quartus 17.0 installer payloads
        if: steps.quartus-install-cache.outputs.cache-hit != 'true'
        env:
          QUARTUS_RUN_URL_SECRET: ${{ secrets.QUARTUS_17_0_RUN_URL }}
          CYCLONEV_QDZ_URL_SECRET: ${{ secrets.QUARTUS_17_0_CYCLONEV_QDZ_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$QUARTUS_CACHE_DIR"

          quartus_url="${QUARTUS_RUN_URL_SECRET:-https://downloads.intel.com/akdlm/software/acdsinst/17.0std/595/ib_installers/QuartusLiteSetup-17.0.0.595-linux.run}"
          cyclonev_url="${CYCLONEV_QDZ_URL_SECRET:-https://downloads.intel.com/akdlm/software/acdsinst/17.0std/595/ib_installers/cyclonev-17.0.0.595.qdz}"

          download_payload() {
            local url="$1"
            local output="$2"
            curl \
              --fail \
              --location \
              --show-error \
              --continue-at - \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 10 \
              --retry-max-time 900 \
              --connect-timeout 30 \
              --max-time 900 \
              --speed-time 120 \
              --speed-limit 1048576 \
              --output "$output" \
              "$url"
          }

          download_payload "$quartus_url" "$QUARTUS_CACHE_DIR/QuartusLiteSetup-17.0.0.595-linux.run"
          download_payload "$cyclonev_url" "$QUARTUS_CACHE_DIR/cyclonev-17.0.0.595.qdz"

          shasum -a 1 "$QUARTUS_CACHE_DIR/QuartusLiteSetup-17.0.0.595-linux.run"
          shasum -a 1 "$QUARTUS_CACHE_DIR/cyclonev-17.0.0.595.qdz"

      - name: Install or verify Quartus Docker runtime
        run: scripts/install-quartus-lite-docker.sh

      - name: Normalize Quartus cache ownership
        if: steps.quartus-install-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" build/quartus-lite-17.0/docker-intelFPGA_lite
          chmod -R u+rwX build/quartus-lite-17.0/docker-intelFPGA_lite
          test -x build/quartus-lite-17.0/docker-intelFPGA_lite/17.0/quartus/bin/quartus_sh

      - name: Save installed Quartus cache
        if: steps.quartus-install-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/quartus-lite-17.0/docker-intelFPGA_lite
          key: ${{ steps.quartus-install-cache.outputs.cache-primary-key }}

      - name: Report cached Quartus disk state
        if: always()
        run: |
          set -euo pipefail
          df -h /
          df -h "$GITHUB_WORKSPACE"
          du -sh build/quartus-lite-17.0/docker-intelFPGA_lite || true
          docker system df || true

  build-rbf:
    name: Build vblank-latched Menu RBF
    runs-on: ubuntu-24.04
    needs: prepare-quartus
    timeout-minutes: 180

    steps:
      - name: Maximize runner build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: false
          remove-android: false
          remove-haskell: false
          remove-codeql: false
          remove-docker-images: true
          build-mount-path: ${{ github.workspace }}

      - name: Checkout MagiK repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read qualified Menu source revision
        id: menu-source
        run: |
          set -euo pipefail
          mapfile -t menu_refs < fpga/menu-vblank-latch/Menu_MiSTer.commit
          if [[ ${#menu_refs[@]} -ne 1 ]]; then
            echo "qualified Menu source revision must be exactly one line" >&2
            exit 2
          fi
          menu_ref="${menu_refs[0]}"
          if [[ ! "$menu_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid qualified Menu source revision: $menu_ref" >&2
            exit 2
          fi
          printf 'commit=%s\n' "$menu_ref" >> "$GITHUB_OUTPUT"

      - name: Compute platform component identity
        id: component-id
        run: python3 scripts/platform-component-id.py component fpga --github-output "$GITHUB_OUTPUT"

      - name: Derive component build date
        id: component-date
        run: |
          set -euo pipefail
          printf 'value=%s\n' "$(git show -s --format=%cd --date=format:%y%m%d '${{ steps.component-id.outputs.fpga_component_revision }}')" >> "$GITHUB_OUTPUT"

      - name: Bind runner temp to build volume
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.runner-temp"
          sudo mount --bind "$GITHUB_WORKSPACE/.runner-temp" "$RUNNER_TEMP"
          df -h "$RUNNER_TEMP"

      - name: Move Docker data root to build volume
        run: |
          set -euo pipefail
          sudo systemctl stop docker
          mkdir -p "$GITHUB_WORKSPACE/.docker-data"
          printf '{"data-root":"%s/.docker-data"}\n' "$GITHUB_WORKSPACE" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'DockerRootDir={{.DockerRootDir}}'

      - name: Restore installed Quartus cache
        uses: actions/cache/restore@v4
        with:
          path: build/quartus-lite-17.0/docker-intelFPGA_lite
          key: quartus-lite-17.0.0.595-cyclonev-${{ runner.os }}-${{ env.QUARTUS_DOCKER_BASE_IMAGE }}-${{ hashFiles('scripts/install-quartus-lite-docker.sh', '.github/workflows/fpga-vblank-latch.yml') }}
          fail-on-cache-miss: true

      - name: Verify Quartus Docker runtime
        run: scripts/install-quartus-lite-docker.sh

      - name: Checkout Menu_MiSTer
        uses: actions/checkout@v4
        with:
          repository: MiSTer-devel/Menu_MiSTer
          ref: ${{ steps.menu-source.outputs.commit }}
          path: build/Menu_MiSTer

      - name: Report pre-build disk state
        if: always()
        run: |
          set -euo pipefail
          df -h /
          df -h "$GITHUB_WORKSPACE"
          du -sh build/quartus-lite-17.0/docker-intelFPGA_lite || true
          docker system df || true

      - name: Build matched stock and vblank-latched RBFs
        env:
          MISTER_MENU_DIR: ${{ github.workspace }}/build/Menu_MiSTer
          MISTER_FPGA_QUALIFIED_MAGIK_REVISION: ${{ github.sha }}
          MISTER_FPGA_COMPONENT_INPUT_SHA256: ${{ steps.component-id.outputs.fpga_input_sha256 }}
          MISTER_FPGA_COMPONENT_REVISION: ${{ steps.component-id.outputs.fpga_component_revision }}
          MISTER_FPGA_BUILD_DATE: ${{ steps.component-date.outputs.value }}
          QUARTUS_DOCKER_EMPTY_SYS: "1"
          QUARTUS_STRACE: "0"
        run: |
          set -euo pipefail
          test "$(git -C "$MISTER_MENU_DIR" rev-parse HEAD)" = "${{ steps.menu-source.outputs.commit }}"
          MISTER_FPGA_APPLY_PATCH=0 \
            MISTER_FPGA_OUT_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/stock" \
            MISTER_MENU_BUILD_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/stock/Menu-work" \
          scripts/build-fpga-vblank-latch-core.sh
          MISTER_FPGA_APPLY_PATCH=1 \
            MISTER_FPGA_OUT_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/patched" \
            MISTER_MENU_BUILD_DIR="$GITHUB_WORKSPACE/build/fpga-signoff/patched/Menu-work" \
          scripts/build-fpga-vblank-latch-core.sh

      - name: Compare stock and MagiK custom delta
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' report; do args+=(--stock "$report"); done < <(
            find build/fpga-signoff/stock -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0
          )
          while IFS= read -r -d '' report; do args+=(--patched "$report"); done < <(
            find build/fpga-signoff/patched -type f \( -name '*.log' -o -name '*.rpt' -o -name '*.summary' \) -print0
          )
          scripts/check-fpga-quartus-delta.py "${args[@]}" | tee build/fpga-signoff/quartus-delta-signoff.tsv
          cp build/fpga-signoff/quartus-delta-signoff.tsv build/fpga-signoff/patched/reports/quartus-delta-signoff.tsv
          delta_sha="$(shasum -a 256 build/fpga-signoff/patched/reports/quartus-delta-signoff.tsv | awk '{print $1}')"
          printf 'report_sha256.reports/quartus-delta-signoff.tsv=%s\nsignoff_valid=1\n' "$delta_sha" \
            >> build/fpga-signoff/patched/menu-magik-vblank-latch.metadata.txt

      - name: Upload FPGA build evidence
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fpga-vblank-latch-signoff-v0.1-${{ steps.component-id.outputs.fpga_input_sha256 }}
          path: |
            build/fpga-signoff/stock/menu-magik-vblank-latch.rbf
            build/fpga-signoff/stock/menu-magik-vblank-latch.metadata.txt
            build/fpga-signoff/stock/menu-magik-vblank-latch.build.log
            build/fpga-signoff/stock/reports/*
            build/fpga-signoff/stock/Menu-work/output_files/*.rpt
            build/fpga-signoff/stock/Menu-work/output_files/*.summary
            build/fpga-signoff/patched/menu-magik-vblank-latch.rbf
            build/fpga-signoff/patched/menu-magik-vblank-latch.metadata.txt
            build/fpga-signoff/patched/menu-magik-vblank-latch.build.log
            build/fpga-signoff/patched/reports/*
            build/fpga-signoff/patched/Menu-work/output_files/*.rpt
            build/fpga-signoff/patched/Menu-work/output_files/*.summary
            build/fpga-signoff/quartus-delta-signoff.tsv
          if-no-files-found: warn
