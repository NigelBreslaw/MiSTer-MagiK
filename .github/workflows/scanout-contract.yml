name: Scanout contract

on:
  pull_request:
    paths:
      - "mister/platform/runtime/src/framebuffer/hidden_scanout.rs"
      - "mister/platform/runtime/src/framebuffer/scanout_slots.rs"
      - "mister/platform/contracts/scanout/src/lib.rs"
      - "mister/tools/agent/src/scanout_slots_contract.rs"
      - "agent-cli/src/platform_stage.rs"
      - "agent-cli/src/host/platform_deploy.rs"
      - "scripts/checks/check-scanout-slots-contract.sh"
      - "documentation/src/content/docs/architecture/kernel-scanout-plugin.mdx"
      - ".github/workflows/scanout-contract.yml"
  push:
    branches: [main]
    paths:
      - "mister/platform/runtime/src/framebuffer/hidden_scanout.rs"
      - "mister/platform/runtime/src/framebuffer/scanout_slots.rs"
      - "mister/platform/contracts/scanout/src/lib.rs"
      - "mister/tools/agent/src/scanout_slots_contract.rs"
      - "agent-cli/src/platform_stage.rs"
      - "agent-cli/src/host/platform_deploy.rs"
      - "scripts/checks/check-scanout-slots-contract.sh"
      - "documentation/src/content/docs/architecture/kernel-scanout-plugin.mdx"
      - ".github/workflows/scanout-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install contract tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check cross-language scanout contract
        run: scripts/checks/check-scanout-slots-contract.sh
