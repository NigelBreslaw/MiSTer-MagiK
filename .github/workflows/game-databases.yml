name: Promote MiSTer MagiK Game Databases

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force_mame_rebuild:
        description: Rebuild MAME even when its upstream tag and SHA are unchanged
        required: true
        type: boolean
        default: false
      force_arcade_updater_rebuild:
        description: Rebuild the Update_All Arcade index even when its upstream revisions are unchanged
        required: true
        type: boolean
        default: false

concurrency:
  group: promote-mister-magik-game-databases
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Check upstream database releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      current-version: ${{ steps.plan.outputs.current_version }}
      next-version: ${{ steps.plan.outputs.next_version }}
      update-needed: ${{ steps.plan.outputs.update_needed }}
      mame-changed: ${{ steps.plan.outputs.mame_changed }}
      hbmame-changed: ${{ steps.plan.outputs.hbmame_changed }}
      arcade-database-changed: ${{ steps.plan.outputs.arcade_database_changed }}
      arcade-updater-changed: ${{ steps.plan.outputs.arcade_updater_changed }}
      mame-tag: ${{ steps.upstream.outputs.mame_tag }}
      mame-sha: ${{ steps.upstream.outputs.mame_sha }}
      mame-listxml-asset: ${{ steps.upstream.outputs.mame_listxml_asset }}
      mame-listxml-url: ${{ steps.upstream.outputs.mame_listxml_url }}
      hbmame-tag: ${{ steps.upstream.outputs.hbmame_tag }}
      hbmame-sha: ${{ steps.upstream.outputs.hbmame_sha }}
      arcade-database-sha: ${{ steps.upstream.outputs.arcade_database_sha }}
      distribution-sha: ${{ steps.upstream.outputs.distribution_sha }}
      jtcores-sha: ${{ steps.upstream.outputs.jtcores_sha }}
      coinop-sha: ${{ steps.upstream.outputs.coinop_sha }}
      arcade-offset-sha: ${{ steps.upstream.outputs.arcade_offset_sha }}
    steps:
      - name: Refuse non-main dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Game-database promotion is restricted to main; got $GITHUB_REF" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Verify checked-out main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve latest MAME release and HBMAME tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/game-databases
          gh api repos/mamedev/mame/releases/latest > build/game-databases/mame-release.json
          mame_tag="$(jq -r '.tag_name | select(test("^mame[0-9]+$"))' build/game-databases/mame-release.json)"
          test -n "$mame_tag"
          mame_sha="$(gh api "repos/mamedev/mame/commits/$mame_tag" --jq .sha)"
          mame_asset="$(jq -r '[.assets[] | select(.name | test("lx\\.zip$"))] | if length == 1 then .[0].name else empty end' build/game-databases/mame-release.json)"
          mame_url="$(jq -r --arg name "$mame_asset" '.assets[] | select(.name == $name) | .browser_download_url' build/game-databases/mame-release.json)"
          test -n "$mame_asset" && test -n "$mame_url"

          gh api --paginate --slurp 'repos/Robbbert/hbmame/tags?per_page=100' > build/game-databases/hbmame-tags.json
          hbmame_tag="$(jq -r 'add | [.[] | select(.name | test("^tag[0-9]+$"))] | max_by(.name | ltrimstr("tag") | tonumber) | .name' build/game-databases/hbmame-tags.json)"
          test -n "$hbmame_tag" && test "$hbmame_tag" != null
          hbmame_sha="$(gh api "repos/Robbbert/hbmame/commits/$hbmame_tag" --jq .sha)"
          arcade_database_sha="$(gh api repos/MiSTer-devel/ArcadeDatabase_MiSTer/commits/main --jq .sha)"
          test "$arcade_database_sha" != null
          distribution_sha="$(gh api repos/MiSTer-devel/Distribution_MiSTer/commits/main --jq .sha)"
          jtcores_sha="$(gh api repos/jotego/jtcores_mister/commits/main --jq .sha)"
          coinop_sha="$(gh api repos/Coin-OpCollection/Distribution-MiSTerFPGA/commits/db --jq .sha)"
          arcade_offset_sha="$(gh api repos/Toryalai1/Arcade_Offset/commits/db --jq .sha)"
          test "$distribution_sha" != null && test "$jtcores_sha" != null
          test "$coinop_sha" != null && test "$arcade_offset_sha" != null

          echo "mame_tag=$mame_tag" >> "$GITHUB_OUTPUT"
          echo "mame_sha=$mame_sha" >> "$GITHUB_OUTPUT"
          echo "mame_listxml_asset=$mame_asset" >> "$GITHUB_OUTPUT"
          echo "mame_listxml_url=$mame_url" >> "$GITHUB_OUTPUT"
          echo "hbmame_tag=$hbmame_tag" >> "$GITHUB_OUTPUT"
          echo "hbmame_sha=$hbmame_sha" >> "$GITHUB_OUTPUT"
          echo "arcade_database_sha=$arcade_database_sha" >> "$GITHUB_OUTPUT"
          echo "distribution_sha=$distribution_sha" >> "$GITHUB_OUTPUT"
          echo "jtcores_sha=$jtcores_sha" >> "$GITHUB_OUTPUT"
          echo "coinop_sha=$coinop_sha" >> "$GITHUB_OUTPUT"
          echo "arcade_offset_sha=$arcade_offset_sha" >> "$GITHUB_OUTPUT"

      - name: Download and verify current numbered release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/game-databases/releases.json
          if tag="$(python3 scripts/release/databases/select-published-release.py game-databases --releases build/game-databases/releases.json 2>/dev/null)"; then
            version="${tag#game-databases-v}"
            mkdir -p build/game-databases/current
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir build/game-databases/current \
              --pattern "mister-magik-game-databases-v${version}.zip" \
              --pattern game-databases-manifest.json --pattern SHA256SUMS
            archive="build/game-databases/current/mister-magik-game-databases-v${version}.zip"
            scripts/magik-ci ci game-databases verify "$archive" \
              --manifest build/game-databases/current/game-databases-manifest.json >/dev/null
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "manifest=build/game-databases/current/game-databases-manifest.json" >> "$GITHUB_OUTPUT"
          else
            echo "No existing numbered game-database release; v1 will build both databases."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "manifest=" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan database update
        id: plan
        env:
          CURRENT_MANIFEST: ${{ steps.current.outputs.manifest }}
          FORCE_MAME_REBUILD: ${{ inputs.force_mame_rebuild }}
          FORCE_ARCADE_UPDATER_REBUILD: ${{ inputs.force_arcade_updater_rebuild }}
          MAME_TAG: ${{ steps.upstream.outputs.mame_tag }}
          MAME_SHA: ${{ steps.upstream.outputs.mame_sha }}
          HBMAME_TAG: ${{ steps.upstream.outputs.hbmame_tag }}
          HBMAME_SHA: ${{ steps.upstream.outputs.hbmame_sha }}
          ARCADE_DATABASE_SHA: ${{ steps.upstream.outputs.arcade_database_sha }}
          DISTRIBUTION_SHA: ${{ steps.upstream.outputs.distribution_sha }}
          JTCORES_SHA: ${{ steps.upstream.outputs.jtcores_sha }}
          COINOP_SHA: ${{ steps.upstream.outputs.coinop_sha }}
          ARCADE_OFFSET_SHA: ${{ steps.upstream.outputs.arcade_offset_sha }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$CURRENT_MANIFEST" ]; then
            args+=(--manifest "$CURRENT_MANIFEST")
          fi
          scripts/magik-ci ci game-databases plan-update "${args[@]}" \
            --mame-tag "$MAME_TAG" --mame-sha "$MAME_SHA" \
            --hbmame-tag "$HBMAME_TAG" --hbmame-sha "$HBMAME_SHA" \
            --arcade-database-sha "$ARCADE_DATABASE_SHA" \
            --arcade-updater-builder-sha "$GITHUB_SHA" \
            --arcade-updater-revision "distribution=$DISTRIBUTION_SHA" \
            --arcade-updater-revision "alternatives=$DISTRIBUTION_SHA" \
            --arcade-updater-revision "jtcores=$JTCORES_SHA" \
            --arcade-updater-revision "coinop=$COINOP_SHA" \
            --arcade-updater-revision "arcade-offset=$ARCADE_OFFSET_SHA" \
            --github-output "$GITHUB_OUTPUT"
          if [ "$FORCE_MAME_REBUILD" = true ]; then
            echo "mame_changed=true" >> "$GITHUB_OUTPUT"
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$FORCE_ARCADE_UPDATER_REBUILD" = true ]; then
            echo "arcade_updater_changed=true" >> "$GITHUB_OUTPUT"
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report update decision
        env:
          UPDATE_NEEDED: ${{ steps.plan.outputs.update_needed }}
          CURRENT_VERSION: ${{ steps.plan.outputs.current_version }}
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
          MAME_CHANGED: ${{ steps.plan.outputs.mame_changed }}
          HBMAME_CHANGED: ${{ steps.plan.outputs.hbmame_changed }}
          ARCADE_DATABASE_CHANGED: ${{ steps.plan.outputs.arcade_database_changed }}
          ARCADE_UPDATER_CHANGED: ${{ steps.plan.outputs.arcade_updater_changed }}
          MAME_TAG: ${{ steps.upstream.outputs.mame_tag }}
          HBMAME_TAG: ${{ steps.upstream.outputs.hbmame_tag }}
        run: |
          {
            echo "## Game database promotion"
            echo
            if [ "$UPDATE_NEEDED" = true ]; then
              echo "Preparing v$NEXT_VERSION (current v$CURRENT_VERSION): MAME changed=$MAME_CHANGED, HBMAME changed=$HBMAME_CHANGED, ArcadeDatabase changed=$ARCADE_DATABASE_CHANGED, updater Arcade changed=$ARCADE_UPDATER_CHANGED."
            else
              echo "Game databases v$CURRENT_VERSION are already up to date ($MAME_TAG, $HBMAME_TAG)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-updater-arcade:
    name: Build Update_All Arcade index
    runs-on: ubuntu-24.04
    needs: inspect
    if: needs.inspect.outputs.arcade-updater-changed == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7


      - name: Download pinned updater databases and source trees
        env:
          DISTRIBUTION_SHA: ${{ needs.inspect.outputs.distribution-sha }}
          JTCORES_SHA: ${{ needs.inspect.outputs.jtcores-sha }}
          COINOP_SHA: ${{ needs.inspect.outputs.coinop-sha }}
          ARCADE_OFFSET_SHA: ${{ needs.inspect.outputs.arcade-offset-sha }}
        run: |
          set -euo pipefail
          mkdir -p build/updater build/sources
          curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/db.json.zip -o build/updater/distribution.zip
          curl -fsSL https://raw.githubusercontent.com/jotego/jtcores_mister/main/jtbindb.json.zip -o build/updater/jtcores.zip
          curl -fsSL https://raw.githubusercontent.com/Coin-OpCollection/Distribution-MiSTerFPGA/db/db.json.zip -o build/updater/coinop.zip
          curl -fsSL https://raw.githubusercontent.com/Toryalai1/Arcade_Offset/db/arcadeoffsetdb.json.zip -o build/updater/arcade-offset.zip
          unzip -p build/updater/distribution.zip > build/updater/distribution.json
          unzip -p build/updater/jtcores.zip > build/updater/jtcores.json
          unzip -p build/updater/coinop.zip > build/updater/coinop.json
          unzip -p build/updater/arcade-offset.zip > build/updater/arcade-offset.json

          distribution_ref="$(jq -r '.base_files_url | capture("/(?<sha>[0-9a-f]{40})/").sha' build/updater/distribution.json)"
          jtcores_ref="$(jq -r '.base_files_url | capture("/(?<sha>[0-9a-f]{40})/").sha' build/updater/jtcores.json)"
          coinop_ref="$(jq -r '.base_files_url | capture("/(?<sha>[0-9a-f]{40})/").sha' build/updater/coinop.json)"
          arcade_offset_ref="$(jq -r '[.files[].url? // empty][0] | capture("/(?<sha>[0-9a-f]{40})/").sha' build/updater/arcade-offset.json)"
          for source in distribution jtcores coinop arcade-offset; do
            git init -q "build/sources/$source"
          done
          git -C build/sources/distribution remote add origin https://github.com/MiSTer-devel/Distribution_MiSTer.git
          git -C build/sources/jtcores remote add origin https://github.com/jotego/jtcores_mister.git
          git -C build/sources/coinop remote add origin https://github.com/Coin-OpCollection/Distribution-MiSTerFPGA.git
          git -C build/sources/arcade-offset remote add origin https://github.com/Toryalai1/Arcade_Offset.git
          git -C build/sources/distribution fetch -q --depth 1 origin "$distribution_ref"
          git -C build/sources/jtcores fetch -q --depth 1 origin "$jtcores_ref"
          git -C build/sources/coinop fetch -q --depth 1 origin "$coinop_ref"
          git -C build/sources/arcade-offset fetch -q --depth 1 origin "$arcade_offset_ref"
          git -C build/sources/distribution checkout -q --detach FETCH_HEAD
          git -C build/sources/jtcores checkout -q --detach FETCH_HEAD
          git -C build/sources/coinop checkout -q --detach FETCH_HEAD
          git -C build/sources/arcade-offset checkout -q --detach FETCH_HEAD

          python3 scripts/release/databases/build-alternatives-database.py \
            build/sources/distribution build/updater/alternatives.json
          jq -n \
            --arg distribution "$DISTRIBUTION_SHA" --arg jtcores "$JTCORES_SHA" \
            --arg coinop "$COINOP_SHA" --arg offset "$ARCADE_OFFSET_SHA" \
            --arg root "$GITHUB_WORKSPACE" \
            '{format:"mister-magik-arcade-updater-inputs-v1",sources:[
              {id:"distribution",revision:$distribution,database:($root+"/build/updater/distribution.json"),roots:[$root+"/build/sources/distribution"]},
              {id:"alternatives",revision:$distribution,database:($root+"/build/updater/alternatives.json"),roots:[$root+"/build/sources/distribution"]},
              {id:"jtcores",revision:$jtcores,database:($root+"/build/updater/jtcores.json"),roots:[$root+"/build/sources/jtcores",$root+"/build/sources/distribution"]},
              {id:"coinop",revision:$coinop,database:($root+"/build/updater/coinop.json"),roots:[$root+"/build/sources/coinop",$root+"/build/sources/jtcores",$root+"/build/sources/distribution"]},
              {id:"arcade-offset",revision:$offset,database:($root+"/build/updater/arcade-offset.json"),roots:[$root+"/build/sources/arcade-offset/release"]}
            ]}' > build/updater/inputs.json

      - name: Build and verify updater Arcade index
        run: |
          set -euo pipefail
          scripts/magik-ci ci game-databases build-updater-arcade \
            --input-manifest build/updater/inputs.json \
            --out build/arcade-updater-index-v1.lz4b | tee build/updater-summary.json
          test -s build/arcade-updater-index-v1.lz4b
          test -s build/updater-summary.json
          jq -e '
            .format == "mister-magik-arcade-updater-index-v1" and
            (.rows | type == "number") and
            (.compressed_bytes | type == "number")
          ' build/updater-summary.json >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: game-databases-updater-arcade
          path: |
            build/arcade-updater-index-v1.lz4b
            build/updater-summary.json
          if-no-files-found: error
          retention-days: 7

  build-mame:
    name: Build MAME metadata database
    runs-on: ubuntu-24.04
    needs: inspect
    if: needs.inspect.outputs.mame-changed == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y curl sqlite3 unzip

      - name: Download MAME listxml
        env:
          LISTXML_URL: ${{ needs.inspect.outputs.mame-listxml-url }}
          LISTXML_ASSET: ${{ needs.inspect.outputs.mame-listxml-asset }}
        run: |
          set -euo pipefail
          mkdir -p build/mame-release
          curl -fsSL "$LISTXML_URL" -o "build/mame-release/$LISTXML_ASSET"
          sha256sum "build/mame-release/$LISTXML_ASSET" | awk '{print $1}' > build/mame-listxml.sha256
          member="$(unzip -Z1 "build/mame-release/$LISTXML_ASSET" | grep -E '^mame[0-9]+\.xml$')"
          test -n "$member"
          unzip -p "build/mame-release/$LISTXML_ASSET" "$member" > build/mame-listxml.xml

      - name: Checkout matching MAME hash lists
        uses: actions/checkout@v7
        with:
          repository: mamedev/mame
          ref: ${{ needs.inspect.outputs.mame-sha }}
          path: mame-source
          sparse-checkout: hash

      - name: Build MAME database
        run: scripts/magik-ci ci game-databases build-mame --listxml build/mame-listxml.xml --software-dir "$GITHUB_WORKSPACE/mame-source/hash" --out build/mame.sqlite3

      - name: Verify Atari Lynx software list
        run: |
          set -euo pipefail
          lynx_rows="$(sqlite3 build/mame.sqlite3 "SELECT count(*) FROM mame_software_items WHERE list_name='lynx';")"
          test "$lynx_rows" -gt 0
          echo "Atari Lynx software-list rows: $lynx_rows"

      - uses: actions/upload-artifact@v7
        with:
          name: game-databases-mame
          path: |
            build/mame.sqlite3
            build/mame-listxml.sha256
          if-no-files-found: error
          retention-days: 7

  build-hbmame-listxml:
    name: Build HBMAME listxml
    runs-on: windows-latest
    needs: inspect
    if: needs.inspect.outputs.hbmame-changed == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Robbbert/hbmame
          ref: ${{ needs.inspect.outputs.hbmame-sha }}
          path: hbmame

      - uses: msys2/setup-msys2@v2
        with:
          install: git make mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-lld mingw-w64-x86_64-libc++

      - name: Build HBMAME
        shell: msys2 {0}
        working-directory: hbmame
        env:
          MINGW64: "/mingw64"
          PTR64: "1"
        run: make -j2 PTR64=1 TARGET=hbmame DEPRECATED=0 SYMBOLS=0 NO_SYMBOLS=1 NOWERROR=1

      - name: Generate HBMAME listxml
        shell: msys2 {0}
        working-directory: hbmame
        run: ./hbmame -listxml > ../hbmame-listxml.xml

      - uses: actions/upload-artifact@v7
        with:
          name: game-databases-hbmame-listxml
          path: hbmame-listxml.xml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble numbered game-database release
    runs-on: ubuntu-24.04
    needs: [inspect, build-mame, build-hbmame-listxml, build-updater-arcade]
    if: |
      always() &&
      needs.inspect.result == 'success' &&
      needs.inspect.outputs.update-needed == 'true' &&
      (needs.build-mame.result == 'success' || needs.build-mame.result == 'skipped') &&
      (needs.build-hbmame-listxml.result == 'success' || needs.build-hbmame-listxml.result == 'skipped') &&
      (needs.build-updater-arcade.result == 'success' || needs.build-updater-arcade.result == 'skipped')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7


      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y curl sqlite3 unzip

      - name: Restore unchanged databases from current release
        if: needs.inspect.outputs.current-version != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ needs.inspect.outputs.current-version }}
        run: |
          set -euo pipefail
          mkdir -p build/current
          tag="game-databases-v$CURRENT_VERSION"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir build/current \
            --pattern "mister-magik-game-databases-v${CURRENT_VERSION}.zip" \
            --pattern game-databases-manifest.json
          archive="build/current/mister-magik-game-databases-v${CURRENT_VERSION}.zip"
          scripts/magik-ci ci game-databases verify "$archive" \
            --manifest build/current/game-databases-manifest.json >/dev/null
          unzip -q "$archive" mame.sqlite3 hbmame.sqlite3 -d build/current
          if unzip -Z1 "$archive" | grep -qx ArcadeDatabase.csv; then
            unzip -q "$archive" ArcadeDatabase.csv ArcadeDatabase-LICENSE.txt -d build/current
          fi
          if unzip -Z1 "$archive" | grep -qx arcade-updater-index-v1.lz4b; then
            unzip -q "$archive" arcade-updater-index-v1.lz4b -d build/current
          fi

      - name: Download rebuilt updater Arcade index
        if: needs.inspect.outputs.arcade-updater-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: game-databases-updater-arcade
          path: build

      - name: Reuse unchanged updater Arcade index
        if: needs.inspect.outputs.arcade-updater-changed != 'true'
        run: cp build/current/arcade-updater-index-v1.lz4b build/arcade-updater-index-v1.lz4b

      - name: Download rebuilt MAME database
        if: needs.inspect.outputs.mame-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: game-databases-mame
          path: build

      - name: Reuse unchanged MAME database
        if: needs.inspect.outputs.mame-changed != 'true'
        run: cp build/current/mame.sqlite3 build/mame.sqlite3

      - name: Fetch pinned ArcadeDatabase source
        if: needs.inspect.outputs.mame-changed == 'true' || needs.inspect.outputs.arcade-database-changed == 'true'
        env:
          ARCADE_DATABASE_SHA: ${{ needs.inspect.outputs.arcade-database-sha }}
        run: |
          set -euo pipefail
          # The former Rust arcade-database-import operation is now Python.
          curl -fsSL "https://raw.githubusercontent.com/MiSTer-devel/ArcadeDatabase_MiSTer/$ARCADE_DATABASE_SHA/ArcadeDatabase.csv" -o build/ArcadeDatabase.csv
          curl -fsSL "https://raw.githubusercontent.com/MiSTer-devel/ArcadeDatabase_MiSTer/$ARCADE_DATABASE_SHA/LICENSE" -o build/ArcadeDatabase-LICENSE.txt
          scripts/magik-ci ci game-databases import-arcade --sqlite build/mame.sqlite3 \
            --csv build/ArcadeDatabase.csv --source-sha "$ARCADE_DATABASE_SHA"

      - name: Reuse unchanged ArcadeDatabase source
        if: needs.inspect.outputs.mame-changed != 'true' && needs.inspect.outputs.arcade-database-changed != 'true'
        run: |
          cp build/current/ArcadeDatabase.csv build/ArcadeDatabase.csv
          cp build/current/ArcadeDatabase-LICENSE.txt build/ArcadeDatabase-LICENSE.txt

      - name: Download rebuilt HBMAME listxml
        if: needs.inspect.outputs.hbmame-changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: game-databases-hbmame-listxml
          path: build

      - name: Build HBMAME database
        if: needs.inspect.outputs.hbmame-changed == 'true'
        run: scripts/magik-ci ci game-databases build-mame --listxml build/hbmame-listxml.xml --out build/hbmame.sqlite3

      - name: Reuse unchanged HBMAME database
        if: needs.inspect.outputs.hbmame-changed != 'true'
        run: cp build/current/hbmame.sqlite3 build/hbmame.sqlite3

      - name: Create and verify numbered bundle
        run: |
          set -euo pipefail
          mame_builder_sha="$GITHUB_SHA"
          hbmame_builder_sha="$GITHUB_SHA"
          arcade_database_builder_sha="$GITHUB_SHA"
          arcade_updater_builder_sha="$GITHUB_SHA"
          if [ '${{ needs.inspect.outputs.mame-changed }}' = true ]; then
            mame_listxml_sha256="$(cat build/mame-listxml.sha256)"
          else
            mame_listxml_sha256="$(jq -r '.sources.mame.listxml_sha256' build/current/game-databases-manifest.json)"
            mame_builder_sha="$(jq -r '.sources.mame.builder_sha' build/current/game-databases-manifest.json)"
          fi
          if [ '${{ needs.inspect.outputs.hbmame-changed }}' != true ]; then
            hbmame_builder_sha="$(jq -r '.sources.hbmame.builder_sha' build/current/game-databases-manifest.json)"
          fi
          if [ '${{ needs.inspect.outputs.mame-changed }}' != true ] && [ '${{ needs.inspect.outputs.arcade-database-changed }}' != true ]; then
            arcade_database_builder_sha="$(jq -r '.sources.arcade_database.builder_sha' build/current/game-databases-manifest.json)"
          fi
          if [ '${{ needs.inspect.outputs.arcade-updater-changed }}' != true ]; then
            arcade_updater_builder_sha="$(jq -r '.sources.arcade_updater.builder_sha' build/current/game-databases-manifest.json)"
          fi
          scripts/magik-ci ci game-databases create \
            --mame-sqlite build/mame.sqlite3 --hbmame-sqlite build/hbmame.sqlite3 \
            --release-version '${{ needs.inspect.outputs.next-version }}' \
            --mame-tag '${{ needs.inspect.outputs.mame-tag }}' \
            --mame-sha '${{ needs.inspect.outputs.mame-sha }}' \
            --mame-listxml-asset '${{ needs.inspect.outputs.mame-listxml-asset }}' \
            --mame-listxml-sha256 "$mame_listxml_sha256" \
            --hbmame-tag '${{ needs.inspect.outputs.hbmame-tag }}' \
            --hbmame-sha '${{ needs.inspect.outputs.hbmame-sha }}' \
            --mame-builder-sha "$mame_builder_sha" \
            --hbmame-builder-sha "$hbmame_builder_sha" \
            --arcade-database-csv build/ArcadeDatabase.csv \
            --arcade-database-license build/ArcadeDatabase-LICENSE.txt \
            --arcade-database-sha '${{ needs.inspect.outputs.arcade-database-sha }}' \
            --arcade-database-builder-sha "$arcade_database_builder_sha" \
            --arcade-updater-builder-sha "$arcade_updater_builder_sha" \
            --arcade-updater-index build/arcade-updater-index-v1.lz4b \
            --output build/game-databases

      - uses: actions/upload-artifact@v7
        with:
          name: game-databases-v${{ needs.inspect.outputs.next-version }}-candidate
          path: build/game-databases
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish numbered game-database release
    runs-on: ubuntu-24.04
    needs: [inspect, assemble]
    if: |
      always() &&
      needs.inspect.result == 'success' &&
      needs.assemble.result == 'success'
    timeout-minutes: 15
    environment:
      name: publish-game-databases
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7


      - uses: actions/download-artifact@v8
        with:
          name: game-databases-v${{ needs.inspect.outputs.next-version }}-candidate
          path: candidate

      - name: Publish immutable numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.inspect.outputs.next-version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          tag="game-databases-v$VERSION"
          archive="candidate/mister-magik-game-databases-v$VERSION.zip"
          scripts/magik-ci ci game-databases verify "$archive" \
            --manifest candidate/game-databases-manifest.json >/dev/null
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; numbered database releases are immutable." >&2
            exit 1
          fi
          gh release create "$tag" "$archive" candidate/game-databases-manifest.json candidate/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MiSTer MagiK Game Databases v$VERSION" --draft --prerelease
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
