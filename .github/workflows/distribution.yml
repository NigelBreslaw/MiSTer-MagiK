name: Distribution ZIP

on:
  workflow_dispatch:
    inputs:
      main_ref:
        description: "Main_MiSTer ref to bundle"
        required: true
        default: "mister-magik"
      artifact_name:
        description: "Distribution artifact basename"
        required: true
        default: "mister-magik"
      hbmame_download_url:
        description: "Optional HBMAME Windows cmd-line archive URL; falls back to repo variable HBMAME_DOWNLOAD_URL"
        required: false
        default: ""
      hbmame_cache_key:
        description: "HBMAME metadata cache version; bump when the HBMAME archive changes"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"
  MISTER_CROSS_IMAGE: cross-custom-rust:armv7-unknown-linux-gnueabihf-b52a5
  MAIN_TOOLCHAIN_VERSION: gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf

jobs:
  hbmame-listxml:
    name: Build HBMAME listxml
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      cache-key: ${{ steps.hbmame-inputs.outputs.cache_key }}

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v6

      - name: Resolve HBMAME inputs
        id: hbmame-inputs
        shell: pwsh
        run: |
          $url = "${{ github.event.inputs.hbmame_download_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = "${{ vars.HBMAME_DOWNLOAD_URL }}"
          }
          if ([string]::IsNullOrWhiteSpace($url)) {
            Write-Error "Set workflow input hbmame_download_url or repository variable HBMAME_DOWNLOAD_URL to the official HBMAME command-line archive URL."
          }
          $cacheKey = "${{ github.event.inputs.hbmame_cache_key }}"
          if ([string]::IsNullOrWhiteSpace($cacheKey)) {
            $cacheKey = "${{ vars.HBMAME_CACHE_KEY }}"
          }
          if ([string]::IsNullOrWhiteSpace($cacheKey)) {
            $cacheKey = "hbmame-current"
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Content -Path build/hbmame-url.txt -Value $url
          Set-Content -Path build/hbmame-cache-key.txt -Value $cacheKey
          "url=$url" >> $env:GITHUB_OUTPUT
          "cache_key=$cacheKey" >> $env:GITHUB_OUTPUT

      - name: Cache HBMAME listxml
        id: hbmame-listxml-cache
        uses: actions/cache@v5
        with:
          path: build/hbmame-listxml.xml
          key: hbmame-listxml-${{ runner.os }}-${{ steps.hbmame-inputs.outputs.cache_key }}-${{ hashFiles('.github/workflows/distribution.yml') }}

      - name: Download HBMAME command-line archive
        if: steps.hbmame-listxml-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build,hbmame-download | Out-Null
          Invoke-WebRequest -Uri "${{ steps.hbmame-inputs.outputs.url }}" -OutFile hbmame-download/hbmame.7z

      - name: Extract HBMAME
        if: steps.hbmame-listxml-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          7z x hbmame-download/hbmame.7z -ohbmame-download/extracted -y
          $exe = Get-ChildItem -Path hbmame-download/extracted -Recurse -Filter hbmame.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "hbmame.exe not found in archive"
          }
          "HBMAME_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Generate HBMAME listxml
        if: steps.hbmame-listxml-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:HBMAME_EXE" -listxml | Out-File -FilePath build/hbmame-listxml.xml -Encoding utf8

      - name: Upload HBMAME listxml
        uses: actions/upload-artifact@v7
        with:
          name: hbmame-listxml
          path: build/hbmame-listxml.xml
          if-no-files-found: error

  distribution:
    name: Build distribution ZIP
    runs-on: ubuntu-24.04
    needs: hbmame-listxml
    timeout-minutes: 120

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v6

      - name: Checkout Main_MiSTer fork
        uses: actions/checkout@v6
        with:
          repository: NigelBreslaw/Main_MiSTer
          ref: ${{ github.event.inputs.main_ref }}
          path: Main_MiSTer

      - name: Resolve Main_MiSTer revision
        id: main-rev
        run: echo "sha=$(git -C Main_MiSTer rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-dist-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock', 'tools/mister/Cargo.lock') }}
          restore-keys: |
            cargo-dist-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v5
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Cache ARM frontend build outputs
        uses: actions/cache@v5
        with:
          path: |
            magik-gui/target/release-device
            magik-gui/target/armv7-unknown-linux-gnueabihf/release-device
          key: target-arm-dist-${{ runner.os }}-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock', 'magik-gui/build.rs', 'magik-gui/build-arm.sh', 'magik-gui/Dockerfile.cross-armv7') }}
          restore-keys: |
            target-arm-dist-${{ runner.os }}-
            target-arm-${{ runner.os }}-release-release-device-none-

      - name: Build ARM frontend
        run: magik-gui/build-arm.sh --device

      - name: Check ARM shared libraries
        run: magik-gui/scripts/check-arm-shared-libs.sh magik-gui/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-fb

      - name: Cache Main_MiSTer build outputs
        id: main-build-cache
        uses: actions/cache@v5
        with:
          path: Main_MiSTer/bin
          key: main-mister-bin-${{ runner.os }}-${{ steps.main-rev.outputs.sha }}

      - name: Cache Main_MiSTer toolchain
        if: steps.main-build-cache.outputs.cache-hit != 'true'
        id: main-toolchain-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/mister-magik/${{ env.MAIN_TOOLCHAIN_VERSION }}
          key: main-toolchain-${{ runner.os }}-${{ env.MAIN_TOOLCHAIN_VERSION }}

      - name: Install Main_MiSTer toolchain
        if: steps.main-build-cache.outputs.cache-hit != 'true' && steps.main-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/mister-magik
          wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/${MAIN_TOOLCHAIN_VERSION}.tar.xz" \
            | tar -xJ -C ~/.cache/mister-magik

      - name: Build Main_MiSTer fork
        if: steps.main-build-cache.outputs.cache-hit != 'true'
        working-directory: Main_MiSTer
        run: |
          export PATH="$HOME/.cache/mister-magik/$MAIN_TOOLCHAIN_VERSION/bin:$PATH"
          make

      - name: Cache MAME metadata database
        id: mame-db-cache
        uses: actions/cache@v5
        with:
          path: build/mame.sqlite3
          key: mame-sqlite-${{ runner.os }}-v1

      - name: Cache HBMAME metadata database
        id: hbmame-db-cache
        uses: actions/cache@v5
        with:
          path: build/hbmame.sqlite3
          key: hbmame-sqlite-${{ runner.os }}-${{ needs.hbmame-listxml.outputs.cache-key }}-${{ hashFiles('.github/workflows/distribution.yml', 'tools/mister/src/main.rs') }}

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Install MAME for metadata
        if: steps.mame-db-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y mame

      - name: Build MAME metadata database
        if: steps.mame-db-cache.outputs.cache-hit != 'true'
        run: scripts/mister mame-metadata-build --mame mame --out build/mame.sqlite3

      - name: Download HBMAME listxml
        if: steps.hbmame-db-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: hbmame-listxml
          path: build

      - name: Build HBMAME metadata database
        if: steps.hbmame-db-cache.outputs.cache-hit != 'true'
        run: scripts/mister mame-metadata-build --listxml build/hbmame-listxml.xml --out build/hbmame.sqlite3

      - name: Package distribution zip
        run: |
          scripts/package-distribution.sh \
            --main-bin Main_MiSTer/bin/MiSTer \
            --hbmame-sqlite-default \
            --name "${{ github.event.inputs.artifact_name }}"

      - name: Upload distribution zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.artifact_name }}-distribution
          path: dist/${{ github.event.inputs.artifact_name }}.zip
          if-no-files-found: error
