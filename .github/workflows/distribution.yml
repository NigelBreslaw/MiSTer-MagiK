name: Publish MiSTer MagiK

on:
  workflow_dispatch:
    inputs:
      main_ref:
        description: "Main_MiSTer ref to bundle"
        required: true
        default: "mister-magik"
      release_channel:
        description: "Release channel"
        required: true
        type: choice
        default: beta
        options:
          - beta
          - release
      fpga_run_id:
        description: "Successful FPGA Vblank Latch RBF workflow run ID for this exact MagiK revision"
        required: true
      scanout_run_id:
        description: "Successful Kernel scanout slots workflow run ID for this exact MagiK revision"
        required: true
      hbmame_ref:
        description: "Optional Robbbert/hbmame tag/ref; blank uses latest tagNNNNN tag"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"
  MISTER_CROSS_IMAGE: cross-custom-rust:armv7-unknown-linux-gnueabihf-b52a5
  MAIN_TOOLCHAIN_VERSION: gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf
  MAME_REF: mame0288
  MAME_LISTXML_URL: https://github.com/mamedev/mame/releases/download/mame0288/mame0288lx.zip

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build-number: ${{ steps.release.outputs.build_number }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      artifact-name: ${{ steps.release.outputs.artifact_name }}
      timestamp: ${{ steps.release.outputs.timestamp }}
    steps:
      - name: Refuse non-main publication
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from the main branch; got $GITHUB_REF" >&2
          exit 1

      - name: Checkout complete app history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive build-based version
        id: release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          build_number="$(git rev-list --count "$GITHUB_SHA")"
          version="0.2.$build_number"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=mister-magik-$version-candidate" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  resolve-hbmame:
    name: Resolve HBMAME ref
    runs-on: ubuntu-24.04
    needs: release-metadata
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.hbmame-ref.outputs.ref }}
      sha: ${{ steps.hbmame-ref.outputs.sha }}
      cache-key: ${{ steps.hbmame-ref.outputs.cache_key }}

    steps:
      - name: Resolve HBMAME tag/ref
        id: hbmame-ref
        env:
          GH_TOKEN: ${{ github.token }}
          HBMAME_REF_INPUT: ${{ github.event.inputs.hbmame_ref }}
        run: |
          set -euo pipefail
          ref="$HBMAME_REF_INPUT"
          if [ -z "$ref" ]; then
            ref="$(gh api repos/Robbbert/hbmame/tags --jq 'map(select(.name | test("^tag[0-9]+$")))[0].name')"
          fi
          if [ -z "$ref" ] || [ "$ref" = "null" ]; then
            echo "Unable to resolve latest Robbbert/hbmame tagNNNNN tag" >&2
            exit 1
          fi
          sha="$(gh api "repos/Robbbert/hbmame/commits/$ref" --jq .sha)"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "Unable to resolve Robbbert/hbmame commit for ref: $ref" >&2
            exit 1
          fi
          cache_key="${ref}-${sha}"
          echo "Using Robbbert/hbmame ref $ref at $sha"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"

  hbmame-db-cache:
    name: Check HBMAME metadata cache
    runs-on: ubuntu-24.04
    needs: resolve-hbmame
    timeout-minutes: 10
    outputs:
      cache-restored: ${{ steps.hbmame-db-cache.outputs.cache-matched-key != '' }}

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v7

      - name: Check HBMAME metadata database cache
        id: hbmame-db-cache
        uses: actions/cache/restore@v6
        with:
          path: build/hbmame.sqlite3
          key: hbmame-sqlite-${{ runner.os }}-${{ needs.resolve-hbmame.outputs.cache-key }}-${{ hashFiles('tools/mister/src/main.rs') }}
          restore-keys: |
            hbmame-sqlite-${{ runner.os }}-${{ needs.resolve-hbmame.outputs.cache-key }}-
          lookup-only: true

  hbmame-listxml:
    name: Build HBMAME listxml
    runs-on: windows-latest
    needs:
      - resolve-hbmame
      - hbmame-db-cache
    if: needs.hbmame-db-cache.outputs.cache-restored != 'true'
    timeout-minutes: 60
    outputs:
      cache-key: ${{ steps.hbmame-outputs.outputs.cache_key }}

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v7

      - name: Expose HBMAME cache key
        id: hbmame-outputs
        run: echo "cache_key=${{ needs.resolve-hbmame.outputs.cache-key }}" >> "$GITHUB_OUTPUT"

      - name: Cache HBMAME listxml
        id: hbmame-listxml-cache
        uses: actions/cache@v6
        with:
          path: build/hbmame-listxml.xml
          key: hbmame-listxml-${{ runner.os }}-${{ needs.resolve-hbmame.outputs.cache-key }}-${{ hashFiles('.github/workflows/distribution.yml') }}

      - name: Checkout HBMAME
        if: steps.hbmame-listxml-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: Robbbert/hbmame
          ref: ${{ needs.resolve-hbmame.outputs.ref }}
          path: hbmame

      - name: Install HBMAME build tools
        if: steps.hbmame-listxml-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          install: git make mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-lld mingw-w64-x86_64-libc++

      - name: Build HBMAME
        if: steps.hbmame-listxml-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: hbmame
        env:
          MINGW64: "/mingw64"
          PTR64: "1"
        run: make -j2 PTR64=1 TARGET=hbmame DEPRECATED=0 SYMBOLS=0 NO_SYMBOLS=1 NOWERROR=1

      - name: Generate HBMAME listxml
        if: steps.hbmame-listxml-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: hbmame
        run: |
          mkdir -p ../build
          ./hbmame -listxml > ../build/hbmame-listxml.xml

      - name: Upload HBMAME listxml
        uses: actions/upload-artifact@v7
        with:
          name: hbmame-listxml
          path: build/hbmame-listxml.xml
          if-no-files-found: error

  distribution:
    name: Build distribution ZIP
    runs-on: ubuntu-24.04
    needs:
      - release-metadata
      - resolve-hbmame
      - hbmame-db-cache
      - hbmame-listxml
    if: |
      always() &&
      needs.release-metadata.result == 'success' &&
      needs.resolve-hbmame.result == 'success' &&
      needs.hbmame-db-cache.result == 'success' &&
      (
        needs.hbmame-db-cache.outputs.cache-restored == 'true' ||
        needs.hbmame-listxml.result == 'success'
      )
    timeout-minutes: 120

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Main_MiSTer fork
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/Main_MiSTer
          ref: ${{ github.event.inputs.main_ref }}
          path: Main_MiSTer
          fetch-depth: 0

      - name: Resolve Main_MiSTer revision
        id: main-rev
        run: echo "sha=$(git -C Main_MiSTer rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test Main_MiSTer state and patch surface
        working-directory: Main_MiSTer
        run: |
          scripts/test-magik-state.sh
          scripts/check-magik-patch-surface.sh

      - name: Download explicitly qualified FPGA and module artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          FPGA_RUN_ID: ${{ github.event.inputs.fpga_run_id }}
          SCANOUT_RUN_ID: ${{ github.event.inputs.scanout_run_id }}
        run: |
          set -euo pipefail
          for run_id in "$FPGA_RUN_ID" "$SCANOUT_RUN_ID"; do
            conclusion="$(gh run view "$run_id" --json conclusion --jq .conclusion)"
            head_sha="$(gh run view "$run_id" --json headSha --jq .headSha)"
            test "$conclusion" = success
            test "$head_sha" = "$GITHUB_SHA"
          done
          mkdir -p build/qualified/fpga build/qualified/scanout
          gh run download "$FPGA_RUN_ID" --name fpga-vblank-latch-signoff --dir build/qualified/fpga
          gh run download "$SCANOUT_RUN_ID" --name mister-magik-scanout-slots --dir build/qualified/scanout
          test "$(find build/qualified/fpga -name menu-magik-vblank-latch.rbf | wc -l)" -ge 2
          test "$(find build/qualified/scanout -name mister_magik_scanout_slots.ko | wc -l)" -eq 1

      - name: Install Rust toolchain
        working-directory: magik-gui
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-dist-${{ runner.os }}-${{ hashFiles('magik-gui/Cargo.lock', 'tools/mister/Cargo.lock') }}
          restore-keys: |
            cargo-dist-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Cache ARM frontend build outputs
        uses: actions/cache@v6
        with:
          path: |
            magik-gui/target/release-device
            magik-gui/target/armv7-unknown-linux-gnueabihf/release-device
          key: target-arm-dist-${{ runner.os }}-${{ needs.release-metadata.outputs.build-number }}-${{ hashFiles('magik-gui/rust-toolchain.toml', 'magik-gui/Cargo.lock', 'magik-gui/build.rs', 'magik-gui/build-arm.sh', 'magik-gui/Dockerfile.cross-armv7') }}
          restore-keys: |
            target-arm-dist-${{ runner.os }}-
            target-arm-${{ runner.os }}-release-release-device-none-

      - name: Build ARM frontend
        env:
          MISTER_MAGIK_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
          MISTER_MAGIK_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: magik-gui/build-arm.sh --device --video

      - name: Build ARM catalog builder
        env:
          MISTER_MAGIK_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
          MISTER_MAGIK_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: scripts/build-catalog-builder.sh --device

      - name: Check ARM shared libraries
        run: magik-gui/scripts/check-arm-shared-libs.sh magik-gui/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-fb

      - name: Generate matching third-party notices
        run: python3 scripts/generate-third-party-licenses.py

      - name: Cache Main_MiSTer build outputs
        id: main-build-cache
        uses: actions/cache@v6
        with:
          path: Main_MiSTer/bin
          key: main-mister-bin-${{ runner.os }}-${{ steps.main-rev.outputs.sha }}

      - name: Cache Main_MiSTer toolchain
        if: steps.main-build-cache.outputs.cache-hit != 'true'
        id: main-toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/mister-magik/${{ env.MAIN_TOOLCHAIN_VERSION }}
          key: main-toolchain-${{ runner.os }}-${{ env.MAIN_TOOLCHAIN_VERSION }}

      - name: Install Main_MiSTer toolchain
        if: steps.main-build-cache.outputs.cache-hit != 'true' && steps.main-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/mister-magik
          wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/${MAIN_TOOLCHAIN_VERSION}.tar.xz" \
            | tar -xJ -C ~/.cache/mister-magik

      - name: Build Main_MiSTer fork
        if: steps.main-build-cache.outputs.cache-hit != 'true'
        working-directory: Main_MiSTer
        run: |
          export PATH="$HOME/.cache/mister-magik/$MAIN_TOOLCHAIN_VERSION/bin:$PATH"
          make

      - name: Cache MAME metadata database
        id: mame-db-cache
        uses: actions/cache@v6
        with:
          path: build/mame.sqlite3
          key: mame-sqlite-${{ runner.os }}-${{ env.MAME_REF }}-v3-${{ hashFiles('tools/mister/src/main.rs', '.github/workflows/distribution.yml') }}

      - name: Cache HBMAME metadata database
        id: hbmame-db-cache
        uses: actions/cache/restore@v6
        with:
          path: build/hbmame.sqlite3
          key: hbmame-sqlite-${{ runner.os }}-${{ needs.resolve-hbmame.outputs.cache-key }}-${{ hashFiles('tools/mister/src/main.rs') }}
          restore-keys: |
            hbmame-sqlite-${{ runner.os }}-${{ needs.resolve-hbmame.outputs.cache-key }}-

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl sqlite3 unzip zip

      - name: Download MAME listxml
        if: steps.mame-db-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/mame-release
          curl -fsSL "$MAME_LISTXML_URL" -o build/mame-release/mame-listxml.zip
          unzip -p build/mame-release/mame-listxml.zip mame0288.xml > build/mame-listxml.xml

      - name: Checkout MAME hash lists
        if: steps.mame-db-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: mamedev/mame
          ref: ${{ env.MAME_REF }}
          path: mame-source
          sparse-checkout: hash

      - name: Resolve MAME software lists
        if: steps.mame-db-cache.outputs.cache-hit != 'true'
        id: mame-hash
        shell: bash
        run: |
          hash_dir="$GITHUB_WORKSPACE/mame-source/hash"
          if [[ -z "$hash_dir" || ! -f "$hash_dir/saturn.xml" ]]; then
            echo "MAME $MAME_REF hash directory with target software lists was not found" >&2
            exit 1
          fi
          echo "dir=$hash_dir" >> "$GITHUB_OUTPUT"

      - name: Build MAME metadata database
        if: steps.mame-db-cache.outputs.cache-hit != 'true'
        run: scripts/mister mame-metadata-build --listxml build/mame-listxml.xml --software-dir "${{ steps.mame-hash.outputs.dir }}" --out build/mame.sqlite3

      - name: Verify MAME software metadata
        run: |
          source_version="$(sqlite3 build/mame.sqlite3 "SELECT DISTINCT source_version FROM mame_machines;")"
          if [ "$source_version" != "0.288 (mame0288)" ]; then
            echo "Expected MAME metadata source_version '0.288 (mame0288)', got '$source_version'" >&2
            exit 1
          fi
          machine_rows="$(sqlite3 build/mame.sqlite3 "SELECT count(*) FROM mame_machines;")"
          if [ "${machine_rows:-0}" -lt 50000 ]; then
            echo "MAME metadata DB is suspiciously small: $machine_rows machine rows" >&2
            exit 1
          fi
          sqlite3 build/mame.sqlite3 "
            WITH expected(list_name) AS (
              VALUES ('megadriv'),('n64'),('nes'),('saturn'),('sms'),('snes')
            )
            SELECT expected.list_name, COALESCE(counts.rows, 0) AS rows
            FROM expected
            LEFT JOIN (
              SELECT list_name, count(*) AS rows
              FROM mame_software_items
              GROUP BY list_name
            ) counts USING (list_name)
            ORDER BY expected.list_name;
          " | tee build/mame-software-counts.txt
          if grep -E '\|0$' build/mame-software-counts.txt; then
            echo "One or more required MAME software lists are missing from build/mame.sqlite3" >&2
            exit 1
          fi

      - name: Upload MAME metadata database
        uses: actions/upload-artifact@v7
        with:
          name: mame-sqlite-${{ env.MAME_REF }}
          path: build/mame.sqlite3
          if-no-files-found: error
          retention-days: 30

      - name: Download HBMAME listxml
        if: steps.hbmame-db-cache.outputs.cache-matched-key == ''
        uses: actions/download-artifact@v8
        with:
          name: hbmame-listxml
          path: build

      - name: Build HBMAME metadata database
        if: steps.hbmame-db-cache.outputs.cache-matched-key == ''
        run: scripts/mister mame-metadata-build --listxml build/hbmame-listxml.xml --out build/hbmame.sqlite3

      - name: Verify HBMAME metadata
        run: |
          rows="$(sqlite3 build/hbmame.sqlite3 "SELECT count(*) FROM mame_machines;")"
          if [ "${rows:-0}" -lt 5000 ]; then
            echo "HBMAME metadata DB is suspiciously small: $rows machine rows" >&2
            exit 1
          fi
          marpy_parent="$(sqlite3 build/hbmame.sqlite3 "SELECT COALESCE(parent_setname, '') FROM mame_machines WHERE setname = 'marpy';")"
          if [ "$marpy_parent" != "mappy" ]; then
            echo "HBMAME metadata sentinel failed: expected marpy parent mappy, got '${marpy_parent:-missing}'" >&2
            exit 1
          fi

      - name: Save HBMAME metadata database cache
        if: steps.hbmame-db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/hbmame.sqlite3
          key: ${{ steps.hbmame-db-cache.outputs.cache-primary-key }}

      - name: Upload HBMAME metadata database
        uses: actions/upload-artifact@v7
        with:
          name: hbmame-sqlite-${{ needs.resolve-hbmame.outputs.sha }}
          path: build/hbmame.sqlite3
          if-no-files-found: error
          retention-days: 30

      - name: Package distribution zip
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          rbf="$(find build/qualified/fpga -path '*/patched/menu-magik-vblank-latch.rbf' -print -quit)"
          rbf_meta="$(find build/qualified/fpga -path '*/patched/menu-magik-vblank-latch.metadata.txt' -print -quit)"
          module="$(find build/qualified/scanout -name mister_magik_scanout_slots.ko -print -quit)"
          module_meta="$(find build/qualified/scanout -name provenance.txt -print -quit)"
          test -f "$rbf" && test -f "$rbf_meta" && test -f "$module" && test -f "$module_meta"
          test "$(sed -n 's/^magik_commit=//p' "$rbf_meta")" = "$GITHUB_SHA"
          scripts/platform-manifest.py generate \
            --output build/platform-v1.manifest \
            --main Main_MiSTer/bin/MiSTer \
            --gui magik-gui/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-fb \
            --catalog-builder magik-gui/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-catalog-builder \
            --scanout-module "$module" \
            --scanout-metadata "$module_meta" \
            --latch-rbf "$rbf" \
            --latch-metadata "$rbf_meta" \
            --main-revision "${{ steps.main-rev.outputs.sha }}" \
            --magik-revision "$GITHUB_SHA"
          scripts/package-distribution.sh \
            --catalog-builder magik-gui/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-catalog-builder \
            --main-bin Main_MiSTer/bin/MiSTer \
            --main-source-revision "${{ steps.main-rev.outputs.sha }}" \
            --scanout-module "$module" \
            --scanout-metadata "$module_meta" \
            --latch-rbf "$rbf" \
            --latch-metadata "$rbf_meta" \
            --platform-manifest build/platform-v1.manifest \
            --mame-source-ref "$MAME_REF" \
            --hbmame-source-revision "${{ needs.resolve-hbmame.outputs.sha }}" \
            --hbmame-sqlite-default \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --name "mister-magik-$RELEASE_VERSION" \
            --release-assets-dir dist/release-assets
          python3 scripts/generate-downloader-db.py \
            --receipt dist/release-assets/release-assets.json \
            --output dist/release-assets \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --timestamp "${{ needs.release-metadata.outputs.timestamp }}"
          if [ "$RELEASE_CHANNEL" = release ]; then
            python3 scripts/generate-downloader-db.py \
              --receipt dist/release-assets/release-assets.json \
              --output dist/release-assets \
              --channel beta \
              --tag "$RELEASE_TAG" \
              --timestamp "${{ needs.release-metadata.outputs.timestamp }}"
          fi
          (
            cd dist/release-assets
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Verify release identity is consistent
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path

          root = Path("dist/release-assets")
          receipt = json.loads((root / "release-assets.json").read_text())
          version = os.environ["RELEASE_VERSION"]
          build = int(os.environ["RELEASE_BUILD_NUMBER"])
          tag = os.environ["RELEASE_TAG"]
          channel = os.environ["RELEASE_CHANNEL"]
          assert receipt["version"] == version == f"0.2.{build}"
          assert tag == f"v{version}"
          assert receipt["archive"] == f"mister-magik-{version}.zip"
          with zipfile.ZipFile(root / receipt["archive"]) as package:
              release = dict(
                  line.split("=", 1)
                  for line in package.read("mister-magik/release-v1.txt").decode().splitlines()
              )
          assert release["version"] == version
          assert int(release["build_number"]) == build
          database = json.loads((root / f"mister-magik-{channel}-db.json").read_text())
          assert database["db_id"] == "mister_magik"
          assert tag in json.dumps(database)
          PY

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.release-metadata.outputs.artifact-name }}
          path: dist/release-assets
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ github.event.inputs.release_channel }} release
    runs-on: ubuntu-24.04
    needs:
      - release-metadata
      - distribution
    timeout-minutes: 20
    environment:
      name: publish-${{ github.event.inputs.release_channel }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download reviewed candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-metadata.outputs.artifact-name }}
          path: candidate

      - name: Refuse an existing immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          (cd candidate && sha256sum --check SHA256SUMS)
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; immutable releases are never overwritten." >&2
            exit 1
          fi
          test "${{ github.ref }}" = refs/heads/main

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          title="MiSTer MagiK $RELEASE_VERSION"
          prerelease=()
          if [ "$RELEASE_CHANNEL" = beta ]; then
            title="$title Beta"
            prerelease=(--prerelease)
          fi
          mapfile -t assets < <(find candidate -type f -print | sort)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --generate-notes \
            "${prerelease[@]}"

      - name: Update channel feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GH_REPO/git/ref/heads/downloader" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/heads/downloader \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
          publish_file() {
            local source="$1" destination="$2" existing_sha
            existing_sha="$(gh api "repos/$GH_REPO/contents/$destination?ref=downloader" --jq .sha 2>/dev/null || true)"
            args=(
              --method PUT "repos/$GH_REPO/contents/$destination"
              -f message="Publish MiSTer MagiK $RELEASE_VERSION $destination"
              -f branch=downloader
              -f content="$(base64 -w 0 "$source")"
            )
            if [ -n "$existing_sha" ]; then
              args+=(-f sha="$existing_sha")
            fi
            gh api "${args[@]}" >/dev/null
          }
          publish_file \
            "candidate/mister-magik-$RELEASE_CHANNEL-db.json.zip" \
            "mister-magik-$RELEASE_CHANNEL-db.json.zip"
          if [ "$RELEASE_CHANNEL" = release ]; then
            publish_file \
              candidate/mister-magik-beta-db.json.zip \
              mister-magik-beta-db.json.zip
          fi
