name: Publish MiSTer MagiK

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        required: true
        type: choice
        default: beta
        options:
          - alpha
          - beta
          - release
      candidate_version:
        description: "Exact existing alpha version to promote (required for beta/release; empty for alpha)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  MISTER_CARGO_TIMINGS: "0"
  MAIN_REF: mister-magik
  MAIN_TOOLCHAIN_VERSION: gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build-number: ${{ steps.release.outputs.build_number }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      artifact-name: ${{ steps.release.outputs.artifact_name }}
      timestamp: ${{ steps.release.outputs.timestamp }}
    steps:
      - name: Refuse non-main publication
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from the main branch; got $GITHUB_REF" >&2
          exit 1

      - name: Checkout complete app history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Derive build-based version
        id: release
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          build_number="$(git rev-list --count "$GITHUB_SHA")"
          version="0.2.$build_number"
          if [ "$RELEASE_CHANNEL" = alpha ]; then
            test -z "$CANDIDATE_VERSION"
          else
            test "$CANDIDATE_VERSION" = "$version" || { echo "Promotion requires the exact validated version for this source: $version" >&2; exit 1; }
          fi
          tag="v$version"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact_name=mister-magik-$version-candidate" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  distribution:
    name: Build distribution ZIP
    if: inputs.release_channel == 'alpha'
    runs-on: ubuntu-24.04
    needs: release-metadata
    timeout-minutes: 120

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve private asset revision
        id: magik-assets-ref
        run: echo "sha=$(git rev-parse HEAD:private/magik-assets)" >> "$GITHUB_OUTPUT"

      - name: Checkout private build assets
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/mister-magik-private-assets
          ref: ${{ steps.magik-assets-ref.outputs.sha }}
          path: private/magik-assets
          ssh-key: ${{ secrets.MAGIK_ASSETS_SSH_KEY }}


      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull cross image
        run: |
          started="$(date +%s)"
          docker pull "${{ steps.cache-id.outputs.cross_image }}"
          finished="$(date +%s)"
          printf 'cross_image_pull_seconds=%s\n' "$((finished - started))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download current published platform and game databases
        id: platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/published
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/published/releases.json

          if ! platform_tag="$(python3 scripts/release/databases/select-published-release.py platform --releases build/published/releases.json)"; then
            echo "::error::No published numbered platform release exists. Run Build MiSTer MagiK Platform."
            exit 1
          fi
          platform_version="$(python3 scripts/release/databases/select-published-release.py platform --field version --releases build/published/releases.json)"
          mkdir -p build/qualified
          gh release download "$platform_tag" --repo "$GITHUB_REPOSITORY" --dir build/qualified \
            --pattern 'mister-magik-platform-v0.*.zip' --pattern 'platform-bundle-v0.*.json'
          archive="$(find build/qualified -name 'mister-magik-platform-v0.*.zip' -print -quit)"
          manifest="$(find build/qualified -name 'platform-bundle-v0.*.json' -print -quit)"
          test -n "$archive" && test -n "$manifest"
          scripts/magik-ci ci platform-bundle verify "$archive" \
            --manifest "$manifest" \
            --release-version "$platform_version" >/dev/null
          unzip -q -o "$archive" -d build/qualified
          format="$(jq -r .format "$manifest")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          if [ "$format" = mister-magik-platform-bundle-v0.2 ]; then
            python3 scripts/release/platform/main-component.py verify \
              --artifact build/qualified/main >/dev/null
            echo "format=v0.2" >> "$GITHUB_OUTPUT"
            echo "main_bin=build/qualified/main/MiSTer_MagiK" >> "$GITHUB_OUTPUT"
            echo "main_revision=$(jq -r .source_revision build/qualified/main/main-component-v0.1.json)" >> "$GITHUB_OUTPUT"
          else
            echo "format=v0.1" >> "$GITHUB_OUTPUT"
            echo "main_bin=" >> "$GITHUB_OUTPUT"
            echo "main_revision=" >> "$GITHUB_OUTPUT"
          fi

          if ! databases_tag="$(python3 scripts/release/databases/select-published-release.py game-databases --releases build/published/releases.json)"; then
            echo "::error::No published numbered game-database release exists. Run Promote MiSTer MagiK Game Databases."
            exit 1
          fi
          databases_version="${databases_tag#game-databases-v}"
          mkdir -p build/game-databases
          gh release download "$databases_tag" --repo "$GITHUB_REPOSITORY" --dir build/game-databases \
            --pattern "mister-magik-game-databases-v${databases_version}.zip" \
            --pattern game-databases-manifest.json --pattern SHA256SUMS
          databases_archive="build/game-databases/mister-magik-game-databases-v${databases_version}.zip"
          scripts/magik-ci ci game-databases verify "$databases_archive" \
            --manifest build/game-databases/game-databases-manifest.json \
            --checksums build/game-databases/SHA256SUMS >/dev/null

      - name: Checkout Main_MiSTer fork for v0.1 compatibility
        if: steps.platform.outputs.format == 'v0.1'
        uses: actions/checkout@v7
        with:
          repository: NigelBreslaw/Main_MiSTer
          ref: ${{ env.MAIN_REF }}
          path: Main_MiSTer
          fetch-depth: 0

      - name: Resolve Main_MiSTer revision for v0.1 compatibility
        if: steps.platform.outputs.format == 'v0.1'
        id: main-rev
        run: echo "sha=$(git -C Main_MiSTer rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test Main_MiSTer state and patch surface for v0.1 compatibility
        if: steps.platform.outputs.format == 'v0.1'
        working-directory: Main_MiSTer
        run: |
          scripts/test-magik-state.sh
          scripts/check-magik-patch-surface.sh

      - name: Install Rust toolchain
        working-directory: apps/mister
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-${{ steps.cache-id.outputs.cargo_dist }}
          restore-keys: |
            cargo-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-
            cargo-arm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-id.outputs.rust_abi }}-

      - name: Cache cross binary
        uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CROSS_VERSION }}-${{ steps.cache-id.outputs.cross_abi }}

      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked

      - name: Cache minimal FFmpeg
        uses: actions/cache@v6
        with:
          path: apps/mister/target/ffmpeg-minimal/armv7
          key: ffmpeg-minimal-v2-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-8.1.2-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.ffmpeg }}

      - name: Restore ARM frontend build outputs
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/mister/target/release-device
            !apps/mister/target/release-device/incremental
            apps/mister/target/armv7-unknown-linux-gnueabihf/release-device
            !apps/mister/target/armv7-unknown-linux-gnueabihf/release-device/incremental
          key: target-arm-v2-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-release-device-${{ steps.cache-id.outputs.cross_abi }}-${{ steps.cache-id.outputs.arm_target }}
          restore-keys: |
            target-arm-v2-${{ runner.os }}-${{ runner.arch }}-armv7-unknown-linux-gnueabihf-release-device-${{ steps.cache-id.outputs.cross_abi }}-

      - name: Build ARM frontend
        env:
          MISTER_MAGIK_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
          MISTER_MAGIK_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          docker image inspect "${{ steps.cache-id.outputs.cross_image }}" >/dev/null
          MISTER_ARM_BUILD_BACKEND=cross scripts/magik-ci build runtime-device

      - name: Check ARM shared libraries
        run: apps/mister/scripts/check-arm-shared-libs.sh apps/mister/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-fb

      - name: Generate matching third-party notices
        run: python3 scripts/release/packaging/generate-third-party-licenses.py

      - name: Cache Main_MiSTer build outputs
        if: steps.platform.outputs.format == 'v0.1'
        id: main-build-cache
        uses: actions/cache@v6
        with:
          path: Main_MiSTer/bin
          key: main-mister-bin-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MAIN_TOOLCHAIN_VERSION }}-${{ steps.main-rev.outputs.sha }}

      - name: Cache Main_MiSTer toolchain
        if: steps.platform.outputs.format == 'v0.1' && steps.main-build-cache.outputs.cache-hit != 'true'
        id: main-toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/mister-magik/${{ env.MAIN_TOOLCHAIN_VERSION }}
          key: main-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MAIN_TOOLCHAIN_VERSION }}

      - name: Install Main_MiSTer toolchain
        if: steps.platform.outputs.format == 'v0.1' && steps.main-build-cache.outputs.cache-hit != 'true' && steps.main-toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/mister-magik
          wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/${MAIN_TOOLCHAIN_VERSION}.tar.xz" \
            | tar -xJ -C ~/.cache/mister-magik

      - name: Build Main_MiSTer fork
        if: steps.platform.outputs.format == 'v0.1' && steps.main-build-cache.outputs.cache-hit != 'true'
        working-directory: Main_MiSTer
        run: |
          export PATH="$HOME/.cache/mister-magik/$MAIN_TOOLCHAIN_VERSION/bin:$PATH"
          make

      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 unzip zip

      - name: Package distribution zip
        env:
          MISTER_ARM_BUILD_BACKEND: cross
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          rbf="$(find build/qualified/fpga -path '*/patched/menu-magik-vblank-latch.rbf' -print -quit)"
          rbf_meta="$(find build/qualified/fpga -path '*/patched/menu-magik-vblank-latch.metadata.txt' -print -quit)"
          module="$(find build/qualified/scanout -name mister_magik_scanout_slots.ko -print -quit)"
          module_meta="$(find build/qualified/scanout -name provenance.txt -print -quit)"
          main_bin='${{ steps.platform.outputs.main_bin }}'
          main_revision='${{ steps.platform.outputs.main_revision }}'
          if [ '${{ steps.platform.outputs.format }}' = v0.1 ]; then
            main_bin=Main_MiSTer/bin/MiSTer
            main_revision='${{ steps.main-rev.outputs.sha }}'
          fi
          test -f "$rbf" && test -f "$rbf_meta" && test -f "$module" && test -f "$module_meta"
          test -f "$main_bin" && [[ "$main_revision" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/checks/generate-platform-v3-consumers.py --check
          scripts/magik-ci build manager-device
          scripts/cargo build --locked --manifest-path mister/platform/contracts/manifest/Cargo.toml --bin platform-manifest-check
          scripts/magik-ci ci platform-manifest generate \
            --layout public \
            --output build/platform-v3.manifest \
            --main "$main_bin" \
            --gui apps/mister/target/armv7-unknown-linux-gnueabihf/release-device/mister-magik-fb \
            --manager mister/tools/manager/target/armv7-unknown-linux-gnueabihf/release/mister-magik-manager \
            --scanout-module "$module" \
            --scanout-metadata "$module_meta" \
            --latch-rbf "$rbf" \
            --latch-metadata "$rbf_meta" \
            --platform-bundle-manifest '${{ steps.platform.outputs.manifest }}' \
            --main-revision "$main_revision" \
            --magik-revision "$GITHUB_SHA"
          scripts/package-distribution.sh \
            --main-bin "$main_bin" \
            --main-source-revision "$main_revision" \
            --scanout-module "$module" \
            --scanout-metadata "$module_meta" \
            --latch-rbf "$rbf" \
            --latch-metadata "$rbf_meta" \
            --platform-manifest build/platform-v3.manifest \
            --platform-bundle-manifest '${{ steps.platform.outputs.manifest }}' \
            --game-databases-release-dir build/game-databases \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --name "mister-magik-$RELEASE_VERSION" \
            --release-assets-dir dist/release-assets
          python3 scripts/release/databases/generate-downloader-db.py \
            --receipt dist/release-assets/release-assets.json \
            --output dist/release-assets \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --timestamp "${{ needs.release-metadata.outputs.timestamp }}"
          if [ "$RELEASE_CHANNEL" = release ]; then
            python3 scripts/release/databases/generate-downloader-db.py \
              --receipt dist/release-assets/release-assets.json \
              --output dist/release-assets \
              --channel beta \
              --tag "$RELEASE_TAG" \
              --timestamp "${{ needs.release-metadata.outputs.timestamp }}"
          fi
          python3 scripts/release/packaging/prepare-published-assets.py \
            --candidate dist/release-assets \
            --output dist/published-assets
          (cd dist/published-assets && sha256sum --check SHA256SUMS)

      - name: Qualify exact distribution candidate
        uses: ./.github/actions/verify-distribution
        with:
          candidate: dist/published-assets
          channel: alpha

      - name: Upload distribution candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.release-metadata.outputs.artifact-name }}
          path: dist/published-assets
          if-no-files-found: error
          retention-days: 30

  promotion:
    name: Verify existing immutable candidate
    if: inputs.release_channel != 'alpha'
    runs-on: ubuntu-24.04
    needs: release-metadata
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build native validators
        run: |
          rustup default "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' apps/mister/rust-toolchain.toml)"
          scripts/cargo build --locked --manifest-path mister/platform/contracts/manifest/Cargo.toml --bin platform-manifest-check
          scripts/cargo build --locked --manifest-path mister/tools/manager/Cargo.toml
      - name: Download and prepare exact promotion
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CHANNEL: ${{ inputs.release_channel }}
          TIMESTAMP: ${{ needs.release-metadata.outputs.timestamp }}
        run: |
          mkdir -p dist/published-assets
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist/published-assets
          scripts/magik-ci ci distribution prepare-promotion dist/published-assets --channel "$CHANNEL" --repository "$GITHUB_REPOSITORY" --source-revision "$GITHUB_SHA" --timestamp "$TIMESTAMP"
      - name: Requalify the same payload without rebuilding it
        uses: ./.github/actions/verify-distribution
        with:
          candidate: dist/published-assets
          channel: ${{ inputs.release_channel }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.release-metadata.outputs.artifact-name }}
          path: dist/published-assets
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ inputs.release_channel }} release
    runs-on: ubuntu-24.04
    needs: [release-metadata, distribution, promotion]
    if: >-
      always() && needs.release-metadata.result == 'success' &&
      ((inputs.release_channel == 'alpha' && needs.distribution.result == 'success') ||
       (inputs.release_channel != 'alpha' && needs.promotion.result == 'success'))
    concurrency:
      group: mister-magik-downloader-feed
      cancel-in-progress: false
    timeout-minutes: 30
    environment:
      name: publish-${{ inputs.release_channel }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build native validators
        run: |
          rustup default "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' apps/mister/rust-toolchain.toml)"
          scripts/cargo build --locked --manifest-path mister/platform/contracts/manifest/Cargo.toml --bin platform-manifest-check
          scripts/cargo build --locked --manifest-path mister/tools/manager/Cargo.toml
      - name: Download verified candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-metadata.outputs.artifact-name }}
          path: candidate
      - name: Publish immutable bytes, verify uploads, then switch feeds
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          scripts/magik-ci ci distribution publish candidate --channel "$CHANNEL" --repository "$GITHUB_REPOSITORY" --source-revision "$GITHUB_SHA"
