name: MiSTer MagiK Tooling 2.0
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["crates/catalog/**", "crates/tooling-support/**", "apps/mister/**", "magik2/**", "scripts/magik2", ".github/workflows/magik2.yml", ".github/CODEOWNERS", ".github/PULL_REQUEST_TEMPLATE/magik2-tooling.md", "crates/framebuffer-stream/**", "crates/magik-core/**", "mister/platform/runtime/**", "mister/platform/contracts/latch/**", "mister/platform/contracts/scanout/**", "apps/mister/ui/fonts/Jersey25-Regular.ttf"]
  push:
    paths: ["crates/catalog/**", "crates/tooling-support/**", "apps/mister/**", "magik2/**", "scripts/magik2", ".github/workflows/magik2.yml"]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv ruff==0.11.8
      # These are host-only fixtures; the private on-device test driver is unused.
      - run: uv export --frozen --project magik2/host --no-emit-project --no-emit-package slint-testing --output-file /tmp/magik2-host-requirements.txt > /dev/null
      - run: uv pip install --system -r /tmp/magik2-host-requirements.txt
      - run: ruff format --check magik2/host magik2/scenarios magik2/scripts
      - run: ruff check --select E4,E7,E9,F magik2/host magik2/scenarios magik2/scripts
      - run: python -m pytest magik2/host/tests -q
      - run: python -m pytest magik2/scenarios --collect-only -q
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo test --locked --manifest-path magik2/agent/Cargo.toml
      - run: cargo test --locked
        working-directory: magik2/probe
      - run: cargo test --locked --manifest-path magik2/probe/Cargo.toml -p mister-magik-tooling-support
      - run: cargo test --locked --manifest-path crates/catalog/Cargo.toml --features builder,development-layout device_layout
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAGIK2_TOOLING_PR: ${{ contains(github.event.pull_request.labels.*.name, 'magik2-tooling') && '1' || '0' }}
        run: python magik2/scripts/check_tooling_scope.py
