name: MiSTer MagiK Tooling 2.0

on:
  pull_request:
    paths: ["magik2/**", "scripts/magik2", ".github/workflows/magik2.yml"]
  push:
    paths: ["magik2/**", "scripts/magik2", ".github/workflows/magik2.yml"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install pytest
      - run: python -m pytest magik2/host/tests -q
      - run: cargo test --manifest-path magik2/agent/Cargo.toml
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAGIK2_TOOLING_PR: ${{ contains(github.event.pull_request.labels.*.name, 'magik2-tooling') && '1' || '0' }}
        run: python magik2/scripts/check_tooling_scope.py
