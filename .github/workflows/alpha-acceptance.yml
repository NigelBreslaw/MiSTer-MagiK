name: Accept MiSTer MagiK Alpha

on:
  workflow_run:
    workflows:
      - Publish MiSTer MagiK
    types:
      - completed
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Immutable alpha candidate tag; newest unaccepted candidate when empty
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: mister-magik-alpha-hil
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  select:
    name: Select immutable candidate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.candidate.outputs.available }}
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Select newest unaccepted candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.candidate_tag }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          candidate="$REQUESTED_TAG"
          if [ -z "$candidate" ]; then
            while IFS= read -r tag; do
              [[ "$tag" =~ ^alpha-candidate-v0\.2\.[0-9]+-[0-9a-f]{12}$ ]] || continue
              if gh release view "$tag" --repo "$GH_REPO" --json assets \
                --jq '.assets[].name' | grep -qx alpha-acceptance-marker.json; then
                continue
              fi
              sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
              if [ -n "$WORKFLOW_SHA" ] && [ "$sha" != "$WORKFLOW_SHA" ]; then
                continue
              fi
              candidate="$tag"
              break
            done < <(gh release list --repo "$GH_REPO" --limit 100 \
              --json tagName,isPrerelease,createdAt \
              --jq '.[] | select(.isPrerelease) | .tagName')
          fi
          if [ -z "$candidate" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$candidate" =~ ^alpha-candidate-v0\.2\.[0-9]+-[0-9a-f]{12}$ ]]
          sha="$(gh api "repos/$GH_REPO/commits/$candidate" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "tag=$candidate" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  hardware:
    name: Install and exercise real alpha UI
    needs: select
    if: needs.select.outputs.available == 'true'
    runs-on:
      - self-hosted
      - macOS
      - magik-hil
    timeout-minutes: 15
    environment:
      name: alpha-hil
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent-cli
        with:
          cache-scope: alpha-hil

      - name: Allocate run-specific evidence paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/mister-magik-alpha.XXXXXX")"
          mkdir -p "$root/candidate"
          echo "candidate=$root/candidate" >> "$GITHUB_OUTPUT"
          echo "evidence=$root/evidence" >> "$GITHUB_OUTPUT"

      - name: Download public immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.select.outputs.tag }}
          CANDIDATE_DIR: ${{ steps.paths.outputs.candidate }}
        shell: bash
        run: gh release download "$CANDIDATE_TAG" --repo "$GH_REPO" --dir "$CANDIDATE_DIR"

      - name: Install exact candidate and run real UI journey
        env:
          CANDIDATE_DIR: ${{ steps.paths.outputs.candidate }}
          EVIDENCE_DIR: ${{ steps.paths.outputs.evidence }}
        shell: bash
        run: scripts/agent alpha accept --candidate "$CANDIDATE_DIR" --output "$EVIDENCE_DIR"

      - name: Upload private hardware evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpha-hil-${{ needs.select.outputs.tag }}
          path: ${{ steps.paths.outputs.evidence }}
          if-no-files-found: warn
          retention-days: 30

  promote:
    name: Promote accepted bytes to rolling alpha
    needs:
      - select
      - hardware
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-agent-cli

      - name: Download immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.select.outputs.tag }}
        run: |
          mkdir candidate
          gh release download "$CANDIDATE_TAG" --repo "$GH_REPO" --dir candidate

      - name: Download private hardware evidence
        uses: actions/download-artifact@v8
        with:
          name: alpha-hil-${{ needs.select.outputs.tag }}
          path: evidence

      - name: Verify candidate-bound acceptance receipt
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir promotion
          scripts/agent alpha verify \
            --candidate candidate \
            --receipt evidence/alpha-acceptance.json \
            --marker promotion/alpha-acceptance-marker.json
          jq --arg workflow_url "$WORKFLOW_URL" \
            '. + {workflow_url: $workflow_url}' \
            promotion/alpha-acceptance-marker.json > promotion/marker.json
          mv promotion/marker.json promotion/alpha-acceptance-marker.json

      - name: Move rolling alpha release to accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.select.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.select.outputs.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="$(jq -r .version promotion/alpha-acceptance-marker.json)"
          title="MiSTer MagiK $version Alpha"
          notes="Accepted immutable candidate $CANDIDATE_TAG. Hardware evidence: $WORKFLOW_URL"
          mapfile -t assets < <(find candidate -type f -print | sort)
          if gh release view alpha --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload alpha "${assets[@]}" --repo "$GH_REPO" --clobber
            gh release edit alpha --repo "$GH_REPO" --title "$title" --notes "$notes" --prerelease
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/alpha" \
              -f sha="$CANDIDATE_SHA" -F force=true >/dev/null
            declare -A expected_assets=()
            for asset_path in "${assets[@]}"; do
              expected_assets["$(basename "$asset_path")"]=1
            done
            while IFS=$'\t' read -r asset_id asset_name; do
              if [[ -z "${expected_assets[$asset_name]+present}" ]]; then
                gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
              fi
            done < <(gh release view alpha --repo "$GH_REPO" --json assets \
              --jq '.assets[] | [(.apiUrl | split("/")[-1]), .name] | @tsv')
          else
            gh release create alpha "${assets[@]}" \
              --repo "$GH_REPO" \
              --target "$CANDIDATE_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi

      - name: Publish accepted alpha Downloader feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source=candidate/mister-magik-alpha-db.json.zip
          destination=mister-magik-alpha-db.json.zip
          if ! gh api "repos/$GH_REPO/git/ref/heads/downloader" >/dev/null 2>&1; then
            blob_sha="$(gh api --method POST "repos/$GH_REPO/git/blobs" \
              -f content="$(base64 -w 0 "$source")" \
              -f encoding=base64 \
              --jq .sha)"
            tree_sha="$(jq -n --arg path "$destination" --arg sha "$blob_sha" \
              '{tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' \
              | gh api --method POST "repos/$GH_REPO/git/trees" --input - --jq .sha)"
            commit_sha="$(gh api --method POST "repos/$GH_REPO/git/commits" \
              -f message="Initialize accepted MiSTer MagiK alpha feed" \
              -f tree="$tree_sha" --jq .sha)"
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/heads/downloader -f sha="$commit_sha" >/dev/null
          else
            existing_sha="$(gh api "repos/$GH_REPO/contents/$destination?ref=downloader" \
              --jq .sha 2>/dev/null || true)"
            args=(
              --method PUT "repos/$GH_REPO/contents/$destination"
              -f message="Publish accepted MiSTer MagiK alpha"
              -f branch=downloader
              -f content="$(base64 -w 0 "$source")"
            )
            if [ -n "$existing_sha" ]; then
              args+=(-f sha="$existing_sha")
            fi
            gh api "${args[@]}" >/dev/null
          fi
          feed_head="$(gh api "repos/$GH_REPO/git/ref/heads/downloader" --jq .object.sha)"
          feed_tree="$(gh api "repos/$GH_REPO/git/commits/$feed_head" --jq .tree.sha)"
          unexpected_paths="$(gh api "repos/$GH_REPO/git/trees/$feed_tree" --jq \
            '.tree[].path | select(. != "mister-magik-alpha-db.json.zip" and . != "mister-magik-beta-db.json.zip" and . != "mister-magik-release-db.json.zip")')"
          test -z "$unexpected_paths"

      - name: Mark immutable candidate accepted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.select.outputs.tag }}
        run: gh release upload "$CANDIDATE_TAG" promotion/alpha-acceptance-marker.json --repo "$GH_REPO"
