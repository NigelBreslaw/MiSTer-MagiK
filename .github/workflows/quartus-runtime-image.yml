name: Quartus Runtime Image

on:
  workflow_dispatch:
    inputs:
      quartus_run_url:
        description: "URL for QuartusLiteSetup-17.0.0.595-linux.run"
        required: false
        default: "https://downloads.intel.com/akdlm/software/acdsinst/17.0std/595/ib_installers/QuartusLiteSetup-17.0.0.595-linux.run"
      cyclonev_qdz_url:
        description: "URL for cyclonev-17.0.0.595.qdz"
        required: false
        default: "https://downloads.intel.com/akdlm/software/acdsinst/17.0std/595/ib_installers/cyclonev-17.0.0.595.qdz"
      image_tag:
        description: "GHCR image tag to publish"
        required: true
        default: "17.0.0.595-cyclonev-ubuntu18.04"

permissions:
  contents: read
  packages: write

env:
  BUILD_CONTEXT: ${{ github.workspace }}/build/quartus-runtime-image

jobs:
  build-and-push:
    name: Build and push Quartus runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Maximize runner build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: false
          remove-android: false
          remove-haskell: false
          remove-codeql: false
          remove-docker-images: true
          build-mount-path: ${{ github.workspace }}

      - name: Checkout MagiK repo
        uses: actions/checkout@v4

      - name: Move Docker data root to build volume
        run: |
          set -euo pipefail
          sudo systemctl stop docker
          mkdir -p "$GITHUB_WORKSPACE/.docker-data"
          printf '{"data-root":"%s/.docker-data"}\n' "$GITHUB_WORKSPACE" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'DockerRootDir={{.DockerRootDir}}'

      - name: Set image name
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/mister-magik-quartus-lite" >> "$GITHUB_ENV"

      - name: Prepare Docker build context
        env:
          QUARTUS_RUN_URL: ${{ github.event.inputs.quartus_run_url }}
          CYCLONEV_QDZ_URL: ${{ github.event.inputs.cyclonev_qdz_url }}
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_CONTEXT"
          cp docker/quartus-lite-17.0/Dockerfile "$BUILD_CONTEXT/Dockerfile"
          cp docker/quartus-lite-17.0/install-quartus-in-image.sh "$BUILD_CONTEXT/install-quartus-in-image.sh"

          download_payload() {
            local url="$1"
            local output="$2"
            curl \
              --fail \
              --location \
              --show-error \
              --continue-at - \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 10 \
              --retry-max-time 900 \
              --connect-timeout 30 \
              --max-time 900 \
              --speed-time 120 \
              --speed-limit 1048576 \
              --output "$output" \
              "$url"
          }

          download_payload "$QUARTUS_RUN_URL" "$BUILD_CONTEXT/QuartusLiteSetup-17.0.0.595-linux.run"
          download_payload "$CYCLONEV_QDZ_URL" "$BUILD_CONTEXT/cyclonev-17.0.0.595.qdz"

          sha1sum "$BUILD_CONTEXT/QuartusLiteSetup-17.0.0.595-linux.run"
          sha1sum "$BUILD_CONTEXT/cyclonev-17.0.0.595.qdz"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push private GHCR image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:17.0-cyclonev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Quartus Prime Lite 17.0.0.595 with Cyclone V support for MiSTer MagiK FPGA builds

      - name: Verify pushed image
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME:${{ github.event.inputs.image_tag }}"
          docker run --rm "$IMAGE_NAME:${{ github.event.inputs.image_tag }}" quartus_sh --version
