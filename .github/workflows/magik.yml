name: MiSTer MagiK Tooling
on:
  pull_request:
    paths: ["crates/catalog/**", "crates/tooling-support/**", "apps/mister/**", "magik/**", "scripts/magik", ".github/workflows/magik.yml", "crates/framebuffer-stream/**", "crates/magik-core/**", "mister/platform/runtime/**", "mister/platform/contracts/latch/**", "mister/platform/contracts/scanout/**", "apps/mister/ui/fonts/Jersey25-Regular.ttf"]
  push:
    paths: ["crates/catalog/**", "crates/tooling-support/**", "apps/mister/**", "magik/**", "scripts/magik", ".github/workflows/magik.yml"]
permissions:
  contents: read
jobs:
  tooling-tests:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-tooling
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-tools
      # These are host-only fixtures; the private on-device test driver is unused.
      - run: uv export --frozen --extra mcp --project magik/host --no-emit-project --no-emit-package slint-testing --output-file /tmp/magik-host-requirements.txt > /dev/null
      - run: uv pip install --python .venv/bin/python -r /tmp/magik-host-requirements.txt
      - run: scripts/magik-ci quality all
      - run: uv run pytest magik/host/tests -q
      - run: uv run pytest magik/scenarios --collect-only -q
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Compute cache identities
        id: cache-id
        run: python3 scripts/checks/ci-cache-identity.py --github-output "$GITHUB_OUTPUT"
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-tooling-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ steps.cache-id.outputs.tooling_build_cache }}
          restore-keys: |
            cargo-tooling-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Cache tooling build outputs
        uses: actions/cache@v6
        with:
          path: target/ci-tooling/debug
          # Share dependencies across agent, probe and catalog. Keep one immutable
          # baseline per dependency/profile identity, including incremental state.
          key: target-tooling-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-debug0-incremental-${{ steps.cache-id.outputs.tooling_build_cache }}
      - run: cargo test --locked --manifest-path magik/agent/Cargo.toml
      - run: cargo test --locked
        working-directory: magik/probe
      - run: cargo test --locked --manifest-path magik/probe/Cargo.toml -p mister-magik-tooling-support
      - run: cargo test --locked --manifest-path crates/catalog/Cargo.toml --features builder,development-layout device_layout
      - name: Report tooling cache footprint
        if: always()
        run: |
          if [ -d "$CARGO_TARGET_DIR/debug" ]; then
            kib="$(du -sk "$CARGO_TARGET_DIR/debug" | awk '{print $1}')"
            printf 'Tooling build cache: %s MiB\n' "$(( (kib + 1023) / 1024 ))" >> "$GITHUB_STEP_SUMMARY"
          fi
