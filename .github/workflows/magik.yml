name: MiSTer MagiK Tooling
on:
  pull_request:
    paths: ["crates/visual-concepts/**", "crates/particles/**", "crates/framebuffer-scenes/**", "crates/catalog/**", "crates/tooling-support/**", "apps/mister/**", "magik/**", "scripts/magik", ".github/workflows/magik.yml", "crates/framebuffer-stream/**", "crates/magik-core/**", "mister/platform/runtime/**", "mister/platform/contracts/latch/**", "mister/platform/contracts/scanout/**", "apps/mister/ui/fonts/Jersey25-Regular.ttf"]
  push:
    paths: ["crates/visual-concepts/**", "crates/particles/**", "crates/framebuffer-scenes/**", "crates/catalog/**", "crates/tooling-support/**", "apps/mister/**", "magik/**", "scripts/magik", ".github/workflows/magik.yml"]
permissions:
  contents: read
jobs:
  tooling-tests:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-tools
      # These are host-only fixtures; the private on-device test driver is unused.
      - run: uv export --frozen --extra mcp --project magik/host --no-emit-project --no-emit-package slint-testing --output-file /tmp/magik-host-requirements.txt > /dev/null
      - run: uv pip install --python .venv/bin/python -r /tmp/magik-host-requirements.txt
      - run: scripts/magik-ci quality all
      - run: uv run pytest magik/host/tests -q
      - run: uv run pytest magik/scenarios --collect-only -q
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo test --locked --manifest-path crates/visual-concepts/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/visual-concepts/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path magik/agent/Cargo.toml
      - run: cargo test --locked
        working-directory: magik/probe
      - run: cargo test --locked --manifest-path magik/probe/Cargo.toml -p mister-magik-tooling-support
      - run: cargo test --locked --manifest-path crates/catalog/Cargo.toml --features builder,development-layout device_layout
