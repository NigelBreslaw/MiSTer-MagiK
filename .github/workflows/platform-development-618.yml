name: Build Linux 6.18 development platform

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified development candidate
        required: false
        default: false
        type: boolean

concurrency:
  group: build-mister-magik-platform-development-618
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  MAIN_REPOSITORY: NigelBreslaw/Main_MiSTer
  MAIN_BRANCH: mister-magik
  KERNEL_REPOSITORY: MiSTer-devel/Linux-Kernel_MiSTer
  KERNEL_REVISION: 6a581bac47c32dfd2525f9874fd263cf08058610
  TOOLCHAIN_VERSION: gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf
  TOOLCHAIN_SHA256: d169f9196e3a6c4248ee79ca85987ebce0e4ea9174c1f8d51af9b28fecf22da1
  LATCH_RBF_SHA256: 0d3b8078853f4e07cfb64cb7776c2eacbed60198b314c461ca9e3d4b6a0fb6b4

jobs:
  build-kernel:
    name: Build exact development platform candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      release-version: ${{ steps.candidate.outputs.release_version }}
      release-tag: ${{ steps.candidate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse non-main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex gcc git jq kmod libelf-dev libssl-dev make python3 \
            unzip wget xz-utils

      - name: Install hash-pinned ARM toolchain
        run: |
          set -euo pipefail
          mkdir -p build/toolchain
          archive=build/toolchain/toolchain.tar.xz
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/$TOOLCHAIN_VERSION.tar.xz" -O "$archive"
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C build/toolchain
          echo "$GITHUB_WORKSPACE/build/toolchain/$TOOLCHAIN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Resolve immutable inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/current-release
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/releases.json
          current_tag="$(python3 scripts/release/databases/select-published-release.py platform --releases build/releases.json)"
          current_version="$(python3 scripts/release/databases/select-published-release.py platform --field version --releases build/releases.json)"
          gh release download "$current_tag" --repo "$GITHUB_REPOSITORY" --dir build/current-release \
            --pattern "mister-magik-platform-v0.$current_version.zip" \
            --pattern platform-bundle-v0.2.json --pattern SHA256SUMS
          current_manifest=build/current-release/platform-bundle-v0.2.json
          fpga_id="$(jq -r .fpga_input_sha256 "$current_manifest")"
          fpga_run_id="$(jq -r .components.fpga.run_id "$current_manifest")"
          fpga_head_sha="$(jq -r .components.fpga.head_sha "$current_manifest")"
          printf 'current_version=%s\nfpga_id=%s\nfpga_run_id=%s\nfpga_head_sha=%s\n' \
            "$current_version" "$fpga_id" "$fpga_run_id" "$fpga_head_sha" >> "$GITHUB_OUTPUT"

      - name: Build latest corrected Main
        id: main
        run: |
          set -euo pipefail
          main_revision="$(git ls-remote "https://github.com/$MAIN_REPOSITORY.git" "refs/heads/$MAIN_BRANCH" | awk '{print $1}')"
          [[ "$main_revision" =~ ^[0-9a-f]{40}$ ]]
          git init build/Main_MiSTer
          git -C build/Main_MiSTer remote add origin "https://github.com/$MAIN_REPOSITORY.git"
          git -C build/Main_MiSTer fetch --depth=1 origin "$main_revision"
          git -C build/Main_MiSTer checkout --detach FETCH_HEAD
          build/Main_MiSTer/scripts/test-magik-state.sh
          build/Main_MiSTer/scripts/check-magik-patch-surface.sh
          python3 build/Main_MiSTer/tests/test_main_component.py
          make -C build/Main_MiSTer
          python3 build/Main_MiSTer/support/mister_magik/main_component.py create \
            --binary build/Main_MiSTer/bin/MiSTer --output build/main-component \
            --revision "$main_revision" --toolchain "$TOOLCHAIN_VERSION" >/dev/null
          python3 scripts/release/platform/main-component.py verify \
            --artifact build/main-component --revision "$main_revision" >/dev/null
          main_id="$(python3 scripts/release/platform/main-component.py identity --revision "$main_revision")"
          printf 'revision=%s\nid=%s\n' "$main_revision" "$main_id" >> "$GITHUB_OUTPUT"

      - name: Build exact upstream Linux and provider
        id: kernel
        run: |
          set -euo pipefail
          git init build/Linux-Kernel_MiSTer
          git -C build/Linux-Kernel_MiSTer remote add origin \
            "https://github.com/$KERNEL_REPOSITORY.git"
          git -C build/Linux-Kernel_MiSTer fetch --depth=1 origin "$KERNEL_REVISION"
          git -C build/Linux-Kernel_MiSTer checkout --detach FETCH_HEAD
          mkdir -p build/kernel-output
          export ARCH=arm CROSS_COMPILE=arm-none-linux-gnueabihf- LOCALVERSION=-MiSTer
          make -C build/Linux-Kernel_MiSTer O="$GITHUB_WORKSPACE/build/kernel-output" MiSTer_defconfig
          echo '584c7fdb7884616363b38c0514266a5fc40083ae327d9a71e72deb6f3101cdab  build/kernel-output/.config' | sha256sum -c -
          make -C build/Linux-Kernel_MiSTer O="$GITHUB_WORKSPACE/build/kernel-output" -j2 zImage modules
          echo 'f58b220d8cdcb925afdd4ba4a4c0a04c02154a8f2fc658cc1fa885b89f79952f  build/kernel-output/Module.symvers' | sha256sum -c -
          KERNEL_SRC="$GITHUB_WORKSPACE/build/Linux-Kernel_MiSTer" \
            KERNEL_BUILD="$GITHUB_WORKSPACE/build/kernel-output" \
            OUT_DIR="$GITHUB_WORKSPACE/build/scanout-618-development" \
            scripts/build-scanout-618-development-module.sh
          kernel_id="$(python3 scripts/release/platform/platform-component-id.py component kernel-development-618)"
          printf 'id=%s\n' "$kernel_id" >> "$GITHUB_OUTPUT"

      - name: Reuse byte-identical latch FPGA component
        run: |
          set -euo pipefail
          archive="build/current-release/mister-magik-platform-v0.${{ steps.inputs.outputs.current_version }}.zip"
          scripts/magik-ci ci platform-bundle extract-component "$archive" \
            --manifest build/current-release/platform-bundle-v0.2.json \
            --component fpga --component-id '${{ steps.inputs.outputs.fpga_id }}' \
            --output build/fpga-component --historical-baseline
          test "$(sha256sum build/fpga-component/patched/menu-magik-vblank-latch.rbf | awk '{print $1}')" = "$LATCH_RBF_SHA256"

      - name: Assemble and verify isolated development bundle
        id: candidate
        run: |
          set -euo pipefail
          next_version=$((${{ steps.inputs.outputs.current_version }} + 1))
          scripts/magik-ci ci platform-bundle create \
            --main-dir build/main-component \
            --fpga-dir build/fpga-component \
            --scanout-dir build/scanout-618-development \
            --main-id '${{ steps.main.outputs.id }}' \
            --fpga-id '${{ steps.inputs.outputs.fpga_id }}' \
            --kernel-id '${{ steps.kernel.outputs.id }}' \
            --main-run-id "$GITHUB_RUN_ID" --fpga-run-id '${{ steps.inputs.outputs.fpga_run_id }}' --kernel-run-id "$GITHUB_RUN_ID" \
            --main-head-sha '${{ steps.main.outputs.revision }}' \
            --fpga-head-sha '${{ steps.inputs.outputs.fpga_head_sha }}' --kernel-head-sha "$GITHUB_SHA" \
            --main-source built-in-current-run \
            --fpga-source reused-from-latest-production-release \
            --kernel-source built-in-current-run \
            --release-version "$next_version" --output build/platform-development-618
          archive="build/platform-development-618/mister-magik-platform-v0.$next_version.zip"
          scripts/magik-ci ci platform-bundle verify "$archive" \
            --manifest build/platform-development-618/platform-bundle-v0.2.json \
            --release-version "$next_version" >/dev/null
          grep -Fxq 'development_only=1' build/scanout-618-development/provenance.txt
          grep -Fxq 'platform_profile=stock-6.18-latch-reuse-v3' build/scanout-618-development/provenance.txt
          bundle_id="$(jq -r .bundle_id build/platform-development-618/platform-bundle-v0.2.json)"
          release_tag="platform-development-618-v0.${next_version}-${bundle_id:0:16}"
          cat > build/platform-development-618/DEVELOPMENT-ONLY.txt <<EOF
          This bundle is restricted to attended Dev-layout installation on the exact
          self-built Linux 6.18 platform. It is excluded from normal platform updates.
          profile=stock-6.18-latch-reuse-v3
          kernel_revision=$KERNEL_REVISION
          app_revision=$GITHUB_SHA
          main_revision=${{ steps.main.outputs.revision }}
          EOF
          printf 'release_version=%s\nrelease_tag=%s\n' "$next_version" "$release_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: platform-development-618-candidate
          path: build/platform-development-618
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable development bundle
    needs: build-kernel
    if: inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: publish-platform-development
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: platform-development-618-candidate
          path: candidate

      - name: Publish development-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-kernel.outputs.release-tag }}
          VERSION: ${{ needs.build-kernel.outputs.release-version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Development tag $TAG already exists and is immutable." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "candidate/mister-magik-platform-v0.$VERSION.zip" \
            candidate/platform-bundle-v0.2.json candidate/SHA256SUMS \
            candidate/DEVELOPMENT-ONLY.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MiSTer MagiK Linux 6.18 development platform" \
            --prerelease
