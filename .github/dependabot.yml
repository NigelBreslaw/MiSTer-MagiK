version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/desktop"
      - "/framebuffer-stream"
      - "/apps/mister"
      - "/crates/catalog"
      - "/apps/mister/ui-generated"
      - "/mister/tools/agent"
      - "/mister/tools/host"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-crates:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "rust-toolchain"
    directory: "/apps/mister"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-toolchain:
        patterns:
          - "*"
