version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-crates:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      documentation:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "rust-toolchain"
    directory: "/apps/mister"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-toolchain:
        patterns:
          - "*"
