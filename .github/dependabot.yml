version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/agent-cli"
      - "/apps/desktop"
      - "/apps/mister"
      - "/apps/mister/ui-generated"
      - "/crates/agent-protocol"
      - "/crates/catalog"
      - "/crates/framebuffer-stream"
      - "/crates/magik-core"
      - "/crates/media-contract"
      - "/mister/platform/contracts/latch"
      - "/mister/platform/contracts/scanout"
      - "/mister/platform/runtime"
      - "/mister/tools/agent"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-crates:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      documentation:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "rust-toolchain"
    directory: "/apps/mister"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-toolchain:
        patterns:
          - "*"
