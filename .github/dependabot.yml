version: 2

# Dependabot cannot resolve private git submodules unless it has explicit repository
# access. Point this to a Dependabot secret containing a PAT with read access to
# the required private submodule repositories.
registries:
  github-private:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.DEPENDABOT_GIT_PRIVATE_TOKEN }}

updates:
  - package-ecosystem: "pip"
    directory: "/"
    registries:
      - github-private
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      python-projects:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-crates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "ffmpeg-next"

  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      documentation:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "rust-toolchain"
    directory: "/apps/mister"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      rust-toolchain:
        patterns:
          - "*"
