workspace_root = ".."

[mcp]
context = "codex"
read_only = false

[mcp.output]
max_total_chars_default = 10000
max_total_chars_hard = 20000

[mcp.tools]
allow = [
  "list_servers",
  "get_server_status",
  "hover_at",
  "get_document_symbols",
  "search_workspace_symbols",
  "find_definition_at",
  "find_references_at",
  "find_implementation_at",
  "find_type_definition_at",
  "find_incoming_calls_at",
  "find_outgoing_calls_at",
  "get_diagnostics",
  "rename_symbol_strict",
]

[[servers]]
id = "rust-main"
kind = "rust_analyzer"
command = "rustup"
args = ["run", "stable", "rust-analyzer"]
extensions = ["rs"]
root_dir = "."
initialize_timeout_ms = 120000
request_timeout_ms = 10000
idle_shutdown_ms = 120000

[servers.request_timeout_overrides_ms]
"textDocument/references" = 30000
"textDocument/rename" = 30000
"callHierarchy/incomingCalls" = 30000
"callHierarchy/outgoingCalls" = 30000

[servers.initialize_options]
linkedProjects = [
  "agent-cli/Cargo.toml",
  "apps/mister/Cargo.toml",
  "apps/mister/ui-generated/Cargo.toml",
  "mister/tools/agent/Cargo.toml",
  "mister/tools/manager/Cargo.toml",
  "private/lspi/Cargo.toml",
]
checkOnSave = true

[servers.initialize_options.cargo]
allTargets = true
targetDir = true

[servers.initialize_options.cargo.buildScripts]
enable = true

[servers.initialize_options.check]
allTargets = true
command = "clippy"
workspace = false

[servers.initialize_options.procMacro]
enable = true

[[servers]]
id = "rust-desktop"
kind = "rust_analyzer"
command = "rustup"
args = ["run", "stable", "rust-analyzer"]
extensions = ["rs"]
root_dir = "apps/desktop"
initialize_timeout_ms = 120000
request_timeout_ms = 10000
idle_shutdown_ms = 120000

[servers.request_timeout_overrides_ms]
