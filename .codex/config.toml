[mcp_servers.lspi]
command = "lspi"
args = [
  "mcp",
  "--workspace-root",
  ".",
  "--config",
  ".lspi/config.toml",
  "--warmup",
  "--read-only",
]
required = false
startup_timeout_sec = 120
env = { RUST_LOG = "error" }
