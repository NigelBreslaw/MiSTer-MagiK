[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep the command harness aligned with the repository's pinned Rust toolchain.
license = "GPL-3.0-or-later"

[features]
default = []
signed-media-manifests = ["mister-magik-media-contract/signed-media-manifests"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
libc = "0.2"
lz4_flex = "0.14.0"
mister-magik-agent-protocol = { path = "../crates/agent-protocol" }
mister-magik-platform-manifest-contract = { path = "../mister/platform/contracts/manifest" }
mister-magik-catalog = { path = "../crates/catalog" }
mister-magik-ini = { path = "../crates/mister-ini" }
mister-magik-latch-contract = { path = "../mister/platform/contracts/latch" }
mister-magik-media-contract = { path = "../crates/media-contract", default-features = false }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ssh2 = "0.9"
thiserror = "2"
toml = "1.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", default-features = false, features = ["backup", "bundled", "modern_sqlite"] }

[profile.dev]
# Workflow tooling favors compile latency. Production/device artifacts use
# their owning release profiles instead of inheriting this host-only policy.
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", features = ["block2", "dispatch2", "objc2-core-media"] }
objc2-core-graphics = "0.3.2"
objc2-core-image = { version = "0.3.2", features = ["objc2-core-graphics", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
