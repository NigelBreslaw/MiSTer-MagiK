[package]
name = "agent-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "modern_sqlite"] }
mister-tool = { path = "../mister/tools/host" }
