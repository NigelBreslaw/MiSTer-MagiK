[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep the command harness aligned with the repository's pinned Rust toolchain.
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
libc = "0.2"
lz4_flex = "0.14.0"
mister-magik-agent-protocol = { path = "../crates/agent-protocol" }
mister-magik-platform-manifest-contract = { path = "../mister/platform/contracts/manifest" }
mister-magik-ini = { path = "../crates/mister-ini" }
mister-magik-latch-contract = { path = "../mister/platform/contracts/latch" }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ssh2 = "0.9"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", default-features = false, features = ["backup", "bundled", "modern_sqlite"] }

[profile.dev]
# Workflow tooling favors compile latency. Production/device artifacts use
# their owning release profiles instead of inheriting this host-only policy.
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false
