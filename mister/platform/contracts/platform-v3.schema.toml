format = "mister-magik-platform-v3-schema-v1"
manifest_format = "mister-magik-platform-v3"
file_name = "platform-v3.manifest"
latch_protocol_version = "5"
latch_capability_mask = "0x03ff"
contract_crate = "platform-manifest-contract"
behavioral_authority = "mister/platform/contracts/manifest/src/lib.rs"
fields = [
  "format",
  "platform_release",
  "platform_release_number",
  "platform_bundle_id",
  "qualification_candidate_id",
  "latch_protocol_version",
  "latch_capability_mask",
  "main_path",
  "gui_path",
  "manager_path",
  "scanout_module_path",
  "scanout_metadata_path",
  "latch_rbf_path",
  "latch_metadata_path",
  "main_sha256",
  "gui_sha256",
  "manager_sha256",
  "scanout_module_sha256",
  "scanout_metadata_sha256",
  "latch_rbf_sha256",
  "latch_metadata_sha256",
  "platform_contract_sha256",
  "main_revision",
  "magik_revision",
  "menu_revision",
]

[layouts.public]
root = "/media/fat/mister-magik"
main = "/media/fat/MiSTer_MagiK"
gui = "/media/fat/mister-magik/mister-magik-fb"
manager = "/media/fat/mister-magik/mister-magik-manager"
scanout_module = "/media/fat/mister-magik/mister_magik_scanout_slots.ko"
scanout_metadata = "/media/fat/mister-magik/mister_magik_scanout_slots.metadata.txt"
latch_rbf = "/media/fat/mister-magik/fpga/menu-magik-vblank-latch.rbf"
latch_metadata = "/media/fat/mister-magik/fpga/menu-magik-vblank-latch.metadata.txt"

[layouts.dev]
root = "/media/fat/mister-magik-dev"
main = "/media/fat/MiSTer_MagiKDev"
gui = "/media/fat/mister-magik-dev/mister-magik-fb"
manager = "/media/fat/mister-magik-dev/mister-magik-manager"
scanout_module = "/media/fat/mister-magik-dev/mister_magik_scanout_slots.ko"
scanout_metadata = "/media/fat/mister-magik-dev/mister_magik_scanout_slots.metadata.txt"
latch_rbf = "/media/fat/mister-magik-dev/fpga/menu-magik-vblank-latch.rbf"
latch_metadata = "/media/fat/mister-magik-dev/fpga/menu-magik-vblank-latch.metadata.txt"
