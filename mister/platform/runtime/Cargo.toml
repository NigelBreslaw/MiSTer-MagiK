[package]
name = "mister-magik-mister-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep runtime builds aligned with the repository's pinned Rust toolchain.
description = "MiSTer platform adapter for MiSTer MagiK applications."
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
bytemuck = { version = "1", optional = true }
libc = "0.2"
lz4_flex = { version = "0.14.0", optional = true }
mister-magik-catalog = { path = "../../../crates/catalog", optional = true, default-features = false }
mister-magik-core = { path = "../../../crates/magik-core" }
mister-magik-framebuffer-scenes = { path = "../../../crates/framebuffer-scenes", optional = true }
mister-magik-framebuffer-stream = { path = "../../../crates/framebuffer-stream", optional = true }
mister-magik-latch-contract = { path = "../contracts/latch" }
mister-magik-scanout-contract = { path = "../contracts/scanout" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "=1.17.1", optional = true, default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "std"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = { version = "=1.17.1", optional = true, default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }

[features]
default = []
app-runtime = ["dep:mister-magik-catalog"]
framebuffer-lab = []
ui = [
    "app-runtime",
    "dep:bytemuck",
    "dep:cc",
    "dep:lz4_flex",
    "dep:mister-magik-framebuffer-scenes",
    "dep:mister-magik-framebuffer-stream",
    "dep:slint",
]
diagnostics = []
bench-tools = []
bench-scenes = []

[build-dependencies]
cc = { version = "1.4.2", optional = true }
