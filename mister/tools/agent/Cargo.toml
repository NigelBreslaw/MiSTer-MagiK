[package]
name = "mister-magik-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Small MiSTer MagiK boot/network agent, independent from the Slint UI."
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-agent"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
lz4_flex = "0.14.0"
mister-magik-framebuffer-stream = { path = "../../../crates/framebuffer-stream" }
mister-magik-scanout-contract = { path = "../../platform/contracts/scanout" }
mister-magik-latch-contract = { path = "../../platform/contracts/latch" }
mister-magik-platform-manifest-contract = { path = "../../platform/contracts/manifest" }
mister-magik-video-diagnostics-contract = { path = "../../platform/contracts/video-diagnostics" }
mister-magik-agent-protocol = { path = "../../../crates/agent-protocol" }
quick-xml = "0.42.0"
serde_json = "1"
sha2 = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
# Retain function symbols for system-wide Streamline attribution while dropping
# line-level debug sections, matching the installed GUI release policy.
strip = "debuginfo"
panic = "abort"

[profile.ci-fast]
# Ordinary CI proves the ARM agent links without paying release optimization.
inherits = "dev"
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false
