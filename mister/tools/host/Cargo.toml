[package]
name = "mister-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep host tooling aligned with the repository's pinned Rust toolchain.
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[features]
default = []
signed-media-manifests = ["mister-magik-media-contract/signed-media-manifests"]

[[bin]]
name = "mister"
path = "src/bin/mister.rs"

[dependencies]
flate2 = "1"
lz4_flex = "0.14.0"
libc = "0.2"
mister-magik-catalog = { path = "../../../crates/catalog" }
mister-magik-media-contract = { path = "../../../crates/media-contract", default-features = false }
mister-magik-ini = { path = "../../../crates/mister-ini" }
mister-magik-agent-protocol = { path = "../../../crates/agent-protocol" }
quick-xml = "0.41"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "modern_sqlite"] }
serde_json = "1"
sha2 = "0.11"
ssh2 = "0.9"

[profile.dev.package.lz4_flex]
opt-level = 3
