[package]
name = "mister-tool"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister"
path = "src/main.rs"

[dependencies]
flate2 = "1"
lz4_flex = "0.14.0"
mister-magik-catalog = { path = "../../../crates/catalog" }
mister-magik-media-contract = { path = "../../../crates/media-contract" }
mister-magik-agent-protocol = { path = "../../../crates/agent-protocol" }
quick-xml = "0.41"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "modern_sqlite"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = "0.9"

[profile.dev.package.lz4_flex]
opt-level = 3
