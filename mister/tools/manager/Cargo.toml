[package]
name = "mister-magik-manager"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-manager"
path = "src/main.rs"

[dependencies]
mister-magik-ini = { path = "../../../crates/mister-ini" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
