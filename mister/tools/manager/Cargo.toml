[package]
name = "mister-magik-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Keep manager builds aligned with the repository's pinned Rust toolchain.
license = "GPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[[bin]]
name = "mister-magik-manager"
path = "src/main.rs"

[dependencies]
libc = "0.2"
mister-magik-ini = { path = "../../../crates/mister-ini" }
mister-magik-platform-manifest-contract = { path = "../../platform/contracts/manifest" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
