[package]
name = "mister-magik-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop companion dashboard for MiSTer MagiK."

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
serde_json = "1"
slint = { version = "~1.17", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "accessibility", "unstable-winit-030"] }
slint-interpreter = { version = "~1.17", optional = true, features = ["display-diagnostics"] }
spin_on = { version = "0.1", optional = true }

[build-dependencies]
slint-build = "~1.17"

[features]
default = ["live-ui"]
live-ui = ["dep:slint-interpreter", "dep:spin_on"]
compiled-ui = []
